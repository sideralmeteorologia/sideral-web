          merge-multiple: false
      - name: Register WRF artifact restore target
        shell: bash
        env:
          WRF_ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/wrf-downloads/d048
          WRF_ARTIFACT_RESTORE_TO: 'tarc_segment_artifacts'
        run: |
          mkdir -p "$WRF_ARTIFACT_DOWNLOAD_DIR"
          printf '%s\n' "$WRF_ARTIFACT_RESTORE_TO" > "$WRF_ARTIFACT_DOWNLOAD_DIR/.restore-to"
      - name: Restore WRF artifacts after checkout (49)
        shell: bash
        run: |
          if [[ -f ".github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 .github/scripts/wrf_artifact_bundle.py unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Restore embedded TARC runtime
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-tarc-runtime-${{ github.sha }}
      - name: Expose WRF helper adapter to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
      - name: Baixar WRFOUT da rodada completa
        env:
          CHECKPOINT_TAG: tarc-${{ env.MODEL_VARIANT }}-3km-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          rm -rf tarc_all_wrfout tarc_products tarc_severe
          mkdir -p tarc_all_wrfout
          mapfile -t files < <(find tarc_segment_artifacts -type f -name 'tarc-wrfout-*' -size +0c -print | sort)
          (( "${#files[@]}" >= 48 )) || { echo "TARC: somente ${#files[@]} WRFOUTs recuperados dos 48 artifacts" >&2; exit 3; }
          for f in "${files[@]}"; do
            name="$(basename "$f" | sed -E 's/^tarc-wrfout-[0-9]+-//; s/_([0-9]{2})[.]([0-9]{2})[.]([0-9]{2})$/_\1:\2:\3/')"
            [[ "$name" == wrfout_d01_* ]] || { echo "Nome WRFOUT invalido no artifact: $f" >&2; exit 4; }
            cp -f "$f" "tarc_all_wrfout/$name"
          done
          mapfile -t outputs < <(find tarc_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print | sort)
          (( "${#outputs[@]}" >= 48 )) || { echo "TARC: somente ${#outputs[@]} WRFOUTs validos" >&2; exit 5; }
          run_env="$(find tarc_segment_artifacts -type f -name 'tarc-run.env' -print -quit)"
          test -s "$run_env" || { echo "tarc-run.env ausente nos artifacts de segmento" >&2; exit 6; }
          cp -f "$run_env" tarc-run.env
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027'
      - name: Gerar produtos principais
        run: |
          if [[ "${MODEL_VARIANT:-wrf}" == "wrf2" ]]; then WRF_PRODUCT_MODEL="WRF TARC2 3 KM"; else WRF_PRODUCT_MODEL="WRF TARC 3 KM"; fi
          export WRF_PRODUCT_MODEL
          python wrf/tarc_postprocess.py tarc_all_wrfout/wrfout_d01_* --output-dir tarc_products
          test -s tarc_products/metadata.json
          test -n "$(find tarc_products -type f -name '*.npz' -size +0c -print -quit)"
          if [[ "${MODEL_VARIANT:-wrf}" == "wrf2" ]]; then
            CATALOG_PATH=wrf/tarc_variable_catalog_wrf2.json
          else
            CATALOG_PATH=wrf/tarc_variable_catalog.json
          fi
          cp -f "$CATALOG_PATH" tarc_products/variable_catalog.json
      - name: Garantir extrator de diagnósticos severos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrf
          if [[ ! -s wrf/extract_wrf_severe.py ]]; then
            install -m 0644 runners/cim5/shared/extract_wrf_severe.py wrf/extract_wrf_severe.py
          fi
          if [[ ! -s wrf/extract_wrf_severe_core.py ]]; then
            install -m 0644 runners/cim5/shared/extract_wrf_severe_core.py wrf/extract_wrf_severe_core.py
          fi
          python3 -m py_compile wrf/extract_wrf_severe.py wrf/extract_wrf_severe_core.py
      - name: Gerar diagnósticos severos
        env:
          WRF_DX_METERS: 3000
        run: |
          source tarc-run.env
          export SOURCE_MODEL
          if [[ "${MODEL_VARIANT:-wrf}" == "wrf2" ]]; then WRF_PRODUCT_LABEL="WRF TARC2 3 KM ${SOURCE_MODEL^^} · diagnósticos severos"; else WRF_PRODUCT_LABEL="WRF TARC 3 KM ${SOURCE_MODEL^^} · diagnósticos severos"; fi
          export WRF_PRODUCT_LABEL
          python wrf/extract_wrf_severe.py --run-dir tarc_all_wrfout --run-env tarc-run.env --output-dir tarc_severe --grid-x 361 --grid-y 445 --model "${SOURCE_MODEL:-icon}" --interval-hours 1 --expected-start 0 --expected-end 48
          test -s tarc_severe/metadata.json
          test -s tarc_severe/diagnostics.json
          cp tarc_products/metadata.json tarc-products-metadata.json
          cp tarc_products/variable_catalog.json tarc-variable-catalog.json
          cp tarc_severe/metadata.json tarc-severe-metadata.json
          cp tarc_severe/diagnostics.json tarc-severe-diagnostics.json
      - name: Validar grade e produtos
        run: |
          python - <<'PY'
          import json, pathlib, os
          m=json.loads(pathlib.Path('tarc_products/metadata.json').read_text(encoding='utf-8'))
          assert m['model']==('WRF TARC2 3 KM' if os.environ.get('MODEL_VARIANT')=='wrf2' else 'WRF TARC 3 KM')
          assert m['resolutionKm']==3
          assert m['nativeReflectivity']=='REFL_10CM'
          assert m['domain']['e_we']==361 and m['domain']['e_sn']==445
          assert m['frames'], 'Nenhum frame TARC produzido'
          s=json.loads(pathlib.Path('tarc_severe/metadata.json').read_text(encoding='utf-8'))
          assert s['frameCount'] > 0
          print('TARC principal:', len(m['frames']), 'frames')
          print('TARC severo:', s['frameCount'], 'frames')
          print('Status severo:', s['status'])
          PY
      - name: Preparar produtos TARC para o publicador comum
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/model-artifacts/wrf-final-tarc3-${MODEL_VARIANT}-${SOURCE_MODEL}-${GITHUB_RUN_ID}"
          rm -rf "$root"
          mkdir -p "$root"
          cp -a tarc_products "$root/tarc_products"
          cp -a tarc_severe "$root/tarc_severe"
          source tarc-run.env
          export RUN_DATE RUN_CYCLE
          ROOT="$root" python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["ROOT"]) / "tarc-run.json"
          p.write_text(json.dumps({
              "model": "TARC WRF 3 km",
              "variant": os.environ.get("MODEL_VARIANT", "wrf"),
              "source_model": os.environ.get("SOURCE_MODEL", "icon"),
              "run_date": os.environ.get("RUN_DATE"),
              "run_cycle": os.environ.get("RUN_CYCLE"),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          test -s "$root/tarc_products/metadata.json"
          test -s "$root/tarc_products/variable_catalog.json"
          test -s "$root/tarc_severe/metadata.json"
          test -s "$root/tarc_severe/diagnostics.json"
      - name: Publicar Release e espelho raw navegável TARC
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_PATH: .github/workflows/tarc-wrf-3km-wrf2-ecmwf.yml
          SOURCE_WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_ARTIFACTS_DIR: ${{ runner.temp }}/model-artifacts
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 .github/scripts/publish_model_release.py publish



