          (("${#dirs[@]}" == 42)) || { echo "METBR: esperados 42 artifacts; encontrados ${#dirs[@]}" >&2; exit 31; }
          for dir in "${dirs[@]}"; do
            [[ -d "$dir" ]] || continue
            printf '%s\n' "metbr_segment_artifacts/${dir##*/}" > "$dir/.restore-to"
          done
          python3 .github/scripts/wrf_artifact_bundle.py unpack-downloads \
