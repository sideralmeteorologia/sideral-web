name: SIDERAL | METBR WRF 4 km | GFS | WRF

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write
  actions: read

# One scheduled METBR run per day. Separate run IDs keep manual runs isolated.
concurrency:
  group: metbr-wrf-4km-${{ github.run_id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  METBR_SOURCE_MODEL: gfs
  CHECKPOINT_PREFIX: metbr-wrf-4km-checkpoint
  SOURCE_MODEL: gfs
  MODEL_VARIANT: wrf
  WRF2_TOMORROW: '0'
  WRF_MPI_PROCS: 8

jobs:
  seg00:
    name: METBR GFS F000-F001
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (1)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Configurar Python e dependências dos fetchers
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar clientes de modelos globais
        run: python -m pip install --disable-pip-version-check 'ecmwf-opendata==0.3.34' 'requests>=2.31'
      - name: Embutir motor científico METBR (WRF 4.3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'wrf/run_metbr_checkpoint_segment.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_metbr_checkpoint_segment.sh'
          mkdir -p "$(dirname 'wrf/run_metbr_source_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_metbr_source_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_icon_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_icon_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_metbr_gfs_segment.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_metbr_gfs_segment.sh'
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          printf '%s' '' | base64 -d > 'wrf/ensure_eccodes_tools.sh'
          mkdir -p "$(dirname 'wrf/run_wrf_restart_segment.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_wrf_restart_segment.sh'
          mkdir -p "$(dirname 'wrf/run_wrf_with_source.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_wrf_with_source.sh'
          mkdir -p "$(dirname 'wrf/prepare_restart_segment.py')"
          printf '%s' '' | base64 -d > 'wrf/prepare_restart_segment.py'
          mkdir -p "$(dirname 'wrf/ensure_metbr_wrf_runtime.sh')"
          printf '%s' '' | base64 -d > 'wrf/ensure_metbr_wrf_runtime.sh'
          mkdir -p "$(dirname 'wrf/run_ecmwf_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_ecmwf_wrf.sh'
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_icon_wrf_step.py'
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_ecmwf_wrf_input.py'
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_gfs_land_support.py'
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.ICONp'
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.ECMWF_OPEN'
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.GFS_SOIL'
          mkdir -p "$(dirname 'wrf/metbr_extract_json.py')"
          printf '%s' '' | base64 -d > 'wrf/metbr_extract_json.py'
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_severe_core.py'
          mkdir -p wrf/bin
          printf '%s' '' | base64 -d > wrf/bin/gh
          chmod +x wrf/bin/gh wrf/*.sh
      - name: Garantir executabilidade dos scripts WRF
        shell: bash
        run: chmod +x wrf/*.sh
      - name: Validar scripts e extrator METBR
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_metbr_checkpoint_segment.sh wrf/run_metbr_source_wrf.sh wrf/run_metbr_gfs_segment.sh wrf/run_wrf_restart_segment.sh wrf/run_wrf_with_source.sh wrf/run_icon_wrf.sh wrf/run_ecmwf_wrf.sh
          python3 -m py_compile wrf/prepare_restart_segment.py wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/metbr_extract_json.py wrf/extract_wrf_severe_core.py
          test -s wrf/Vtable.ICONp && test -s wrf/Vtable.ECMWF_OPEN && test -s wrf/Vtable.GFS_SOIL
      - name: Cachear runtime científico METBR (somente código)
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-metbr-runtime-${{ github.sha }}
      - name: Executar WRF METBR F000-F003
        env:
          CHECKPOINT_TAG: metbr-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 0 1 0 1
      - name: Bundle WRF artifact safely (1)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            metbr-checkpoint-*.tar.gz
            metbr-wrfout-*
            metbr-run.env
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
          WRF_ARTIFACT_REQUIRE_FILES: '1'
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-001.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-metbr4-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-001.tar
          if-no-files-found: error
          retention-days: 1
