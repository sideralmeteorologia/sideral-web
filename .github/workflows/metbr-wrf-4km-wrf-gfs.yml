        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/model-artifacts/wrf-final-metbr4-${MODEL_VARIANT}-${SOURCE_MODEL}-${GITHUB_RUN_ID}"
          rm -rf "$root"
          mkdir -p "$root"
          cp -a metbr_products "$root/metbr_products"
          ROOT="$root" python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["ROOT"]) / "metbr-run.json"
          p.write_text(json.dumps({
              "model": "METBR WRF 4 km",
              "variant": os.environ.get("MODEL_VARIANT", "wrf"),
              "source_model": os.environ.get("SOURCE_MODEL", "icon"),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          test -s "$root/metbr_products/metadata.json"
          test -s "$root/metbr_products/metbr_wrf_4km.json"
          test -s "$root/metbr_products/grid.json"
      - name: Publicar Release e espelho raw navegável METBR
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_PATH: .github/workflows/metbr-wrf-4km-wrf-gfs.yml
          SOURCE_WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_ARTIFACTS_DIR: ${{ runner.temp }}/model-artifacts
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 .github/scripts/publish_model_release.py publish
