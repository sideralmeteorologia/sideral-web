# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Validate workflow YAML and all WRF runner clones
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path(".github/workflows")
          files = sorted(root.glob("*.yml"))
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.load(stream, Loader=yaml.BaseLoader)
          validator = yaml.load(
              (root / "validate-wrf-runner-clones.yml").read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          step = next(
              step for step in validator["jobs"]["validate"]["steps"]
              if step.get("name") == "Validate all original and cloned WRF workflows"
          )
          command = step["run"]
          source = command.split("python - <<'PY'\n", 1)[1].rsplit("\nPY", 1)[0]
          exec(compile(source, "validate-wrf-runner-clones.yml", "exec"), {})
          PY


      - name: Validate public model release publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/publish_model_release.py
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          source = Path(".github/scripts/publish_model_release.py")
          spec = importlib.util.spec_from_file_location("sideral_release_publisher", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.supported(".github/workflows/cbr-wrf-4km-wrf-ecmwf.yml", "CBR WRF ECMWF")
          assert module.supported(".github/workflows/metbr-wrf-4km-wrf-ecmwf.yml", "METBR WRF ECMWF")
          assert module.supported(".github/workflows/tarc-wrf-3km-wrf-ecmwf.yml", "TARC WRF ECMWF")
          assert module.supported(".github/workflows/sideral-global-nwp-artifact.yml", "SIDERAL GLOBAL NWP")
          assert module.supported(".github/workflows/SIDERAL_MULTIMODELS_05_ICON_HORIZON_FIX (1).yml", "SIDERAL MULTIMODELS")
          assert module.central_supported(".github/workflows/cbr-wrf-4km-wrf-ecmwf.yml", "CBR WRF ECMWF")
          assert module.central_supported(".github/workflows/sideral-global-nwp-artifact.yml", "SIDERAL GLOBAL NWP")
          assert module.central_supported(".github/workflows/SIDERAL_MULTIMODELS_05_ICON_HORIZON_FIX (1).yml", "SIDERAL MULTIMODELS")
          assert not module.central_supported(".github/workflows/metbr-wrf-4km-wrf-ecmwf.yml", "METBR WRF ECMWF")
          assert not module.central_supported(".github/workflows/tarc-wrf-3km-wrf-ecmwf.yml", "TARC WRF ECMWF")
          assert not module.central_supported(".github/workflows/wrf-launchpad.yml", "WRF Launchpad")

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              final = root / "wrf-final-cbr4-run"
              products = final / "cbr_products"
              products.mkdir(parents=True)
              (products / "metadata.json").write_text('{"status":"complete"}', encoding="utf-8")
              (products / "frame_000.npz").write_bytes(b"NPZ")
              (final / "wrfout_d01_2026-11-20_15:00:00").write_bytes(b"raw WRFOUT")
              intermediate = root / "wrf-cbr4-seg00"
              intermediate.mkdir()
              (intermediate / "metbr-checkpoint-2026-11-20_15:00:00.tar.gz").write_bytes(b"checkpoint")

              selected = module.collect(root)
              names = {name for _, name in selected}
              assert names == {"cbr_products/metadata.json", "cbr_products/frame_000.npz"}, names
              safe = module.safe_name("wrfout_d01_2026-11-20_15:00:00")
              assert ":" not in safe and "|" not in safe
              parts, record = module.split_file(selected[1][0], selected[1][1], root / "assets")
              assert record["size"] == selected[1][0].stat().st_size and len(parts) == 1

          assert module.product_key(".github/workflows/sideral-global-nwp-artifact.yml", "Global NWP") == "global-nwp"
          assert module.product_key(".github/workflows/SIDERAL_MULTIMODELS_05_ICON_HORIZON_FIX (1).yml", "Multimodels") == "multimodels-05"

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              nwp = root / "sideral-global-nwp-123-1"
              (nwp / "ecmwf_ifs").mkdir(parents=True)
              (nwp / "ecmwf_ifs" / "region.json").write_text('{"ok":true}', encoding="utf-8")
              (nwp / "ecmwf_ifs" / "temperature.nc").write_bytes(b"NC")
              intermediate = root / "global-nwp-ecmwf_eps"
              intermediate.mkdir()
              (intermediate / "model_status.json").write_text('{"status":"failed"}', encoding="utf-8")
              selected = module.collect(root)
              assert {name for _, name in selected} == {
                  "ecmwf_ifs/region.json", "ecmwf_ifs/temperature.nc"
              }, {name for _, name in selected}

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              multimodel = root / "sideral-multimodels-05-123"
              multimodel.mkdir()
              (multimodel / "consensus.json").write_text('{"ok":true}', encoding="utf-8")
              (multimodel / "precipitation.npz").write_bytes(b"NPZ")
              selected = module.collect(root)
              assert {name for _, name in selected} == {
                  "consensus.json", "precipitation.npz"
              }, {name for _, name in selected}

          print("Model release publisher validation passed for WRF, Global NWP and Multimodel final artifacts.")
          PY

      - name: Validate automatic schedules and ECMWF EPS cycle policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          root = Path(".github/workflows")
          def load(name):
              return yaml.load((root / name).read_text(encoding="utf-8"), Loader=yaml.BaseLoader)

          nwp = load("sideral-global-nwp-artifact.yml")
          assert nwp["on"].get("schedule"), "Global NWP must have an automatic schedule"
          models = nwp["jobs"]["collect"]["strategy"]["matrix"]["model"]
          required_models = {
              "ecmwf_ifs", "ecmwf_eps", "ecmwf_aifs", "ecmwf_aifs_ens",
              "icon_dwd", "icon_ai", "gfs", "gfs_ai", "gefs_ai",
              "cmc_gdps", "cmc_geps", "hgefs", "ukmet",
          }
          assert required_models.issubset(set(models)), (
              f"Global NWP model matrix is incomplete: {sorted(required_models - set(models))}"
          )
          collect_steps = nwp["jobs"]["collect"]["steps"]
          collect = next(step for step in collect_steps if step.get("name") == "Coletar todas as variáveis/níveis e validades publicadas")
          collect_run = collect.get("run", "")
          assert 'MODEL_KEY' in collect_run and 'ecmwf_eps' in collect_run
          assert '"06") COLLECT_CYCLE="00"' in collect_run, (
              "ECMWF EPS must map the unsupported 06Z EP cycle to 00Z"
          )
          assert '"18") COLLECT_CYCLE="12"' in collect_run, (
              "ECMWF EPS must map the unsupported 18Z EP cycle to 12Z"
          )
          assert 'COLLECT_CYCLE="12"' in collect_run and 'COLLECT_CYCLE="00"' in collect_run
          assert 'CYCLE_ARG=(--cycle "$COLLECT_CYCLE")' in collect_run

          multimodel = load("SIDERAL_MULTIMODELS_05_ICON_HORIZON_FIX (1).yml")
          assert multimodel["on"].get("schedule"), "Sideral Multimodels must have an automatic schedule"

          publisher = load("publish-model-releases.yml")
          publisher_if = str(publisher["jobs"]["publish"].get("if", ""))
          assert "workflow_run.conclusion" not in publisher_if, (
              "Final valid products must still be mirrored when another model in the run fails."
          )
          assert "github.event.workflow.path" not in publisher_if, (
              "workflow.path is not part of the workflow_run webhook payload; source paths are resolved via the Actions API."
          )
          assert "workflow_run.head_branch == 'main'" in publisher_if, (
              "The central publisher must only process runs from the main branch."
          )
          assert "workflow_run.head_repository.full_name == github.repository" in publisher_if, (
              "The central publisher must only process runs from this repository."
          )

          print(
              f"Automatic schedules OK: {len(nwp['on']['schedule'])} Global NWP cron(s), "
              f"{len(multimodel['on']['schedule'])} Multimodel cron(s), "
              f"{len(models)} Global NWP model collectors."
          )
          print("ECMWF EPS uses only valid ENFO-EP cycles (00/12 UTC).")
          PY

      - name: Validate WRF artifact TAR transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/wrf_artifact_bundle.py
          python3 .github/scripts/wrf_artifact_bundle.py self-test

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
