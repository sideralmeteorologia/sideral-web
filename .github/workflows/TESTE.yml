# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Validate workflow YAML and all WRF runner clones
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path(".github/workflows")
          files = sorted(root.glob("*.yml"))
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.load(stream, Loader=yaml.BaseLoader)
          validator = yaml.load(
              (root / "validate-wrf-runner-clones.yml").read_text(encoding="utf-8"),
              Loader=yaml.BaseLoader,
          )
          step = next(
              step for step in validator["jobs"]["validate"]["steps"]
              if step.get("name") == "Validate all original and cloned WRF workflows"
          )
          command = step["run"]
          source = command.split("python - <<'PY'\n", 1)[1].rsplit("\nPY", 1)[0]
          exec(compile(source, "validate-wrf-runner-clones.yml", "exec"), {})
          PY


      - name: Validate public model release publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/publish_model_release.py
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          source = Path(".github/scripts/publish_model_release.py")
          spec = importlib.util.spec_from_file_location("sideral_release_publisher", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.supported(".github/workflows/cbr-wrf-4km-wrf-ecmwf.yml", "CBR WRF ECMWF")
          assert module.supported(".github/workflows/sideral-global-nwp-artifact.yml", "SIDERAL GLOBAL NWP")
          assert module.supported(".github/workflows/SIDERAL_MULTIMODELS_05_ICON_HORIZON_FIX (1).yml", "SIDERAL MULTIMODELS")

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              final = root / "wrf-final-cbr4-run"
              products = final / "cbr_products"
              products.mkdir(parents=True)
              (products / "metadata.json").write_text('{"status":"complete"}', encoding="utf-8")
              (products / "frame_000.npz").write_bytes(b"NPZ")
              (final / "wrfout_d01_2026-11-20_15:00:00").write_bytes(b"raw WRFOUT")
              intermediate = root / "wrf-cbr4-seg00"
              intermediate.mkdir()
              (intermediate / "metbr-checkpoint-2026-11-20_15:00:00.tar.gz").write_bytes(b"checkpoint")

              selected = module.collect(root)
              names = {name for _, name in selected}
              assert names == {"cbr_products/metadata.json", "cbr_products/frame_000.npz"}, names
              safe = module.safe_name("wrfout_d01_2026-11-20_15:00:00")
              assert ":" not in safe and "|" not in safe
              parts, record = module.split_file(selected[1][0], selected[1][1], root / "assets")
              assert record["size"] == selected[1][0].stat().st_size and len(parts) == 1

          assert module.product_key(".github/workflows/sideral-global-nwp-artifact.yml", "Global NWP") == "global-nwp"
          assert module.product_key(".github/workflows/SIDERAL_MULTIMODELS_05_ICON_HORIZON_FIX (1).yml", "Multimodels") == "multimodels-05"
          print("Model release publisher validation passed.")
          PY

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
