name: TARC WRF 3 km | manual

on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: WRF ou WRF2
        required: true
        default: wrf
        type: choice
        options: [wrf, wrf2]
      source_model:
        description: Modelo global
        required: true
        default: icon
        type: choice
        options: [icon, ecmwf, gfs]
permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  TARC_CHECKPOINT_PREFIX: tarc-wrf-3km-checkpoint
  FAMILY: tarc
  RESOLUTION_KM: '3'
  MODEL_VARIANT: ${{ (github.event.schedule == '0 11 * * *' || github.event.schedule == '45 11 * * *' || github.event.schedule == '5 12 * * *') && 'wrf2' || inputs.model_variant || 'wrf' }}
  SOURCE_MODEL: ${{ (github.event.schedule == '35 10 * * *' || github.event.schedule == '45 11 * * *') && 'ecmwf' || (github.event.schedule == '55 10 * * *' || github.event.schedule == '5 12 * * *') && 'gfs' || inputs.source_model || 'icon' }}
  WRF2_TOMORROW: ${{ (github.event.schedule == '0 11 * * *' || github.event.schedule == '45 11 * * *' || github.event.schedule == '5 12 * * *' || inputs.model_variant == 'wrf2') && '1' || '0' }}
  WRF_MPI_PROCS: 4
  WRF_TARGET_RESOLUTION_KM: 3
  WRF_DX_METERS: 3000
  WRF_DY_METERS: 3000
  WRF_E_WE: 361
  WRF_E_SN: 445
  WRF_TIME_STEP: 18
  WRF_HISTORY_INTERVAL_MINUTES: 60
  WRF_REF_LAT: -28.0
  WRF_REF_LON: -53.5
  WRF_STAND_LON: -53.5

jobs:
  seg00:
    name: TARC ICON F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (1)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Embed TARC executors and R2 adapter
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          mkdir -p wrf/bin
          chmod +x wrf/bin/gh
          chmod +x wrf/*.sh
      - name: Validate embedded TARC executors
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_tarc_checkpoint_segment.sh wrf/run_tarc_icon_wrf.sh wrf/run_tarc_ecmwf_wrf.sh wrf/run_tarc_gfs_wrf.sh wrf/run_tarc_restart_segment.sh wrf/run_tarc_wrf_with_source.sh
          python3 -m py_compile wrf/prepare_restart_segment.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/fetch_icon_wrf_step.py wrf/select_tarc_icon_run.py wrf/tarc_postprocess.py wrf/extract_wrf_severe_core.py
      - name: Cache TARC code only
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-tarc-runtime-${{ github.sha }}
      - name: Add R2 adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
      - name: Executar F000-F003
        env:
          CHECKPOINT_TAG: tarc-${{ env.MODEL_VARIANT }}-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 0 3 0 1
      - name: Bundle WRF artifact safely (1)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-001.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-tarc3-manual-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-001.tar
          if-no-files-found: ignore
          retention-days: 7
