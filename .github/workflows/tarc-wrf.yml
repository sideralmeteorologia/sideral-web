        env:
          CHECKPOINT_TAG: tarc-${{ env.MODEL_VARIANT }}-3km-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          tar -czf tarc-products-3km.tar.gz -C tarc_products .
          tar -czf tarc-severe-3km.tar.gz -C tarc_severe .
          test -s tarc-products-3km.tar.gz
          test -s tarc-severe-3km.tar.gz
          : # artifact-only workflow
          : # artifact-only workflow
          echo "TARC 3 KM: produtos e diagnósticos publicados."
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          if-no-files-found: ignore
          retention-days: 7
