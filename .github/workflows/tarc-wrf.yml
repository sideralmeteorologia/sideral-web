name: SIDERAL | TARC WRF 3 km unificado

on:
  workflow_call:
    inputs:
      model_variant:
        description: "Tipo de execução WRF"
        required: false
        default: "wrf"
        type: string
      source_model:
        description: "Fonte global de contorno"
        required: false
        default: "icon"
        type: string

permissions:
  contents: write
  actions: read

env:
  TARC_CHECKPOINT_PREFIX: tarc-wrf-3km-checkpoint
  FAMILY: tarc
  RESOLUTION_KM: '3'
  MODEL_VARIANT: ${{ inputs.model_variant || 'wrf' }}
  SOURCE_MODEL: ${{ inputs.source_model || 'icon' }}
  WRF2_TOMORROW: ${{ inputs.model_variant == 'wrf2' && '1' || '0' }}


jobs:
  seg00:
    name: TARC ICON F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load WRF parameters from versioned profile
        shell: bash
        run: |
          set -euo pipefail
          profile="runners/parameters/tarc.env"
          test -s "$profile" || { echo "Perfil WRF ausente: $profile" >&2; exit 1; }
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            [[ "$line" == *=* ]] || { echo "Linha inválida em $profile: $line" >&2; exit 1; }
            echo "$line" >> "$GITHUB_ENV"
          done < "$profile"
      - name: Embed TARC executors and R2 adapter
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          mkdir -p "$(dirname 'wrf/run_tarc_checkpoint_segment.sh')"
          cp "runners/tarc/shared/run_tarc_checkpoint_segment.sh" "wrf/run_tarc_checkpoint_segment.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_icon_wrf.sh')"
          cp "runners/tarc/icon/run_tarc_icon_wrf.sh" "wrf/run_tarc_icon_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_ecmwf_wrf.sh')"
          cp "runners/tarc/ecmwf/run_tarc_ecmwf_wrf.sh" "wrf/run_tarc_ecmwf_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_gfs_wrf.sh')"
          cp "runners/tarc/gfs/run_tarc_gfs_wrf.sh" "wrf/run_tarc_gfs_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_restart_segment.sh')"
          cp "runners/tarc/shared/run_tarc_restart_segment.sh" "wrf/run_tarc_restart_segment.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_wrf_with_source.sh')"
          cp "runners/tarc/shared/run_tarc_wrf_with_source.sh" "wrf/run_tarc_wrf_with_source.sh"
          mkdir -p "$(dirname 'wrf/prepare_restart_segment.py')"
          cp "runners/tarc/shared/prepare_restart_segment.py" "wrf/prepare_restart_segment.py"
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          cp "runners/tarc/shared/ensure_eccodes_tools.sh" "wrf/ensure_eccodes_tools.sh"
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          cp "runners/tarc/ecmwf/fetch_ecmwf_wrf_input.py" "wrf/fetch_ecmwf_wrf_input.py"
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          cp "runners/tarc/gfs/fetch_gfs_land_support.py" "wrf/fetch_gfs_land_support.py"
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          cp "runners/tarc/icon/fetch_icon_wrf_step.py" "wrf/fetch_icon_wrf_step.py"
          mkdir -p "$(dirname 'wrf/select_tarc_icon_run.py')"
          cp "runners/tarc/icon/select_tarc_icon_run.py" "wrf/select_tarc_icon_run.py"
          mkdir -p "$(dirname 'wrf/tarc_postprocess.py')"
          cp "runners/tarc/shared/tarc_postprocess.py" "wrf/tarc_postprocess.py"
          mkdir -p "$(dirname 'wrf/tarc_variable_catalog.json')"
          cp "runners/tarc/wrf2/tarc_variable_catalog_wrf2.json" "wrf/tarc_variable_catalog_wrf2.json"
          cp "runners/tarc/shared/tarc_variable_catalog.json" "wrf/tarc_variable_catalog.json"
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          cp "runners/tarc/shared/extract_wrf_severe_core.py" "wrf/extract_wrf_severe_core.py"
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          cp "runners/tarc/ecmwf/Vtable.ECMWF_OPEN" "wrf/Vtable.ECMWF_OPEN"
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          cp "runners/tarc/gfs/Vtable.GFS_SOIL" "wrf/Vtable.GFS_SOIL"
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          cp "runners/tarc/shared/ensure_metbr_wrf_runtime.sh" "wrf/ensure_metbr_wrf_runtime.sh"
          cp "runners/tarc/icon/Vtable.ICONp" "wrf/Vtable.ICONp"
          mkdir -p wrf/bin
          cp "runners/tarc/shared/gh" "wrf/bin/gh"
          chmod +x wrf/bin/gh
          chmod +x wrf/*.sh
      - name: Validate embedded TARC executors
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_tarc_checkpoint_segment.sh wrf/run_tarc_icon_wrf.sh wrf/run_tarc_ecmwf_wrf.sh wrf/run_tarc_gfs_wrf.sh wrf/run_tarc_restart_segment.sh wrf/run_tarc_wrf_with_source.sh
          python3 -m py_compile wrf/prepare_restart_segment.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/fetch_icon_wrf_step.py wrf/select_tarc_icon_run.py wrf/tarc_postprocess.py wrf/extract_wrf_severe_core.py
      - name: Cache TARC code only
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-tarc-runtime-${{ github.sha }}
      - name: Add R2 adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
      - name: Executar F000-F003
        env:
          CHECKPOINT_TAG: tarc-${{ env.MODEL_VARIANT }}-3km-checkpoint-${{ github.run_id }}
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 0 3 0 1
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
