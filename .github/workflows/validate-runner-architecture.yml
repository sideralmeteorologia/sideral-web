name: Validate independent WRF runners

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "runners/**"
      - "scripts/validate_runner_architecture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate runner separation and external sources
        run: python scripts/validate_runner_architecture.py
