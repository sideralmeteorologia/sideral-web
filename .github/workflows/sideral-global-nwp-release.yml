      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas GRIB e Python
        shell: bash
        run: |
          set -euo pipefail
          # Fallback independente: os espelhos Azure/Ubuntu usam DNS da Canonical.
          # A Kernel.org só entra quando os mirrors padrão não resolvem.
          sudo sed -i '$a http://mirrors.edge.kernel.org/ubuntu/' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip wheel setuptools

      - name: Instalar dependências Python de todos os modelos
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "herbie-data>=2026.10.0" \
            "ecmwf-opendata>=0.3.0" \
            "dwdopen>=1.0.0" \
            "eccodes>=2.42.0" \
            "numpy>=1.26,<3" \
            "requests>=2.31"
          python - <<'PY'
          import eccodes
          import numpy
          import requests
          print(f"NumPy {numpy.__version__}: OK")
          print(f"Requests {requests.__version__}: OK")
          print("ecCodes: OK")
          PY

      - name: Preparar CDO e pesos oficiais de regrade ICON
        if: ${{ matrix.model == 'icon_dwd' || matrix.model == 'icon_ai' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y cdo
          mkdir -p .cache/icon-regrid
          curl -fL --retry 4 --retry-delay 3 \
            https://opendata.dwd.de/weather/lib/cdo/ICON_GLOBAL2WORLD_025_EASY.tar.bz2 \
            -o /tmp/ICON_GLOBAL2WORLD_025_EASY.tar.bz2
          tar -xjf /tmp/ICON_GLOBAL2WORLD_025_EASY.tar.bz2 \
            -C .cache/icon-regrid --wildcards \
            '*target_grid_world_025.txt' '*weights_icogl2world_025.nc'
          test -n "$(find .cache/icon-regrid -name target_grid_world_025.txt -print -quit)"
          test -n "$(find .cache/icon-regrid -name weights_icogl2world_025.nc -print -quit)"
          cdo -V | head -n 2

      - name: Coletar todas as variáveis/níveis e validades publicadas
        id: collect
        timeout-minutes: 480
        env:
          MODEL_KEY: ${{ matrix.model }}
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
          ICON_REGRID_DIR: .cache/icon-regrid
        shell: bash
        run: |
          set -euo pipefail
          DATE_ARG=()
          CYCLE_ARG=()
          COLLECT_CYCLE="${RUN_CYCLE:-auto}"
          if [[ -n "${RUN_DATE:-}" ]]; then DATE_ARG=(--date "$RUN_DATE"); fi

          # ECMWF Open Data publishes ENFO ensemble-probability (EP) files
          # at 240/360h only for 00/12 UTC cycles. For 06/18 UTC it publishes
          # ENFO ensemble forecasts (EF) only through 144h. Do not request the
          # non-existent 240h-enfo-ep.index on 06/18: map those cycles back to
          # the most recent compatible 00/12 cycle for the EPS collector only.
          if [[ "$MODEL_KEY" == "ecmwf_eps" ]]; then
            case "$COLLECT_CYCLE" in
              ""|auto)
                UTC_HOUR="$(date -u +%H)"
                if (( 10#$UTC_HOUR >= 12 )); then
                  COLLECT_CYCLE="12"
                else
                  COLLECT_CYCLE="00"
                fi
                ;;
              "06") COLLECT_CYCLE="00" ;;
              "18") COLLECT_CYCLE="12" ;;
            esac
            echo "ECMWF EPS: ciclo compatível ENFO-EP selecionado: ${COLLECT_CYCLE}Z"
          fi

          if [[ -n "$COLLECT_CYCLE" && "$COLLECT_CYCLE" != "auto" ]]; then
            CYCLE_ARG=(--cycle "$COLLECT_CYCLE")
          fi

          python .sideral_embedded/nwp-engine/global-nwp/collect.py \
            --model "$MODEL_KEY" \
            "${DATE_ARG[@]}" \
            "${CYCLE_ARG[@]}" \
            --output-dir global-nwp-output

      - name: Registrar resultado do modelo no resumo do job
        if: always()
        shell: bash
        env:
          MODEL_KEY: ${{ matrix.model }}
        run: |
          mkdir -p global-nwp-output/"$MODEL_KEY"
          STATUS=global-nwp-output/"$MODEL_KEY"/model_status.json
          PROGRESS=global-nwp-output/"$MODEL_KEY"/collection-progress.json
          if [[ ! -f "$STATUS" ]]; then
            python - "$MODEL_KEY" "$STATUS" "$PROGRESS" <<'PY'
          import json, pathlib, sys
          model, status_name, progress_name = sys.argv[1:]
          def read_json(path):
              try:
                  value = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return {}
          progress = read_json(progress_name)
          available = progress.get("available_forecast_hours", [])
          partial = bool(available)
          status = "partial" if partial else "failed"
          message = (
              f"Coleta interrompida; {len(available)} validades foram salvas antes da interrupção."
              if partial else
              "Coletor interrompido antes de produzir dados regionais; consulte collection-progress.json."
          )
          payload = {
              "model_key": model,
              "status": status,
              "run_utc": progress.get("run_utc"),
              "message": message,
              "errors": progress.get("errors", [])[:100],
          }
          target = pathlib.Path(status_name)
          temp = target.with_name(target.name + ".tmp")
          try:
              temp.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
              temp.replace(target)
          except OSError as exc:
              print(f"::warning::Não foi possível gravar model_status.json: {exc}")
          PY
          fi
          python - "$STATUS" "$PROGRESS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          def read_json(path):
              try:
                  value=json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
                  return value if isinstance(value, dict) else {}
              except (OSError, UnicodeError, json.JSONDecodeError):
                  return {}
          status=read_json(sys.argv[1])
          if not status:
              status={"model_key": "unknown", "status": "failed", "message": "Status ausente ou corrompido por falta de espaço/erro do runner."}
          print(f"### {status.get('model_key')} — {status.get('status')}")
          print(status.get("message", ""))
          progress=read_json(sys.argv[2])
          if progress:
              print(
                  f"\n**Progresso:** {progress.get('completed_count', 0)}/"
                  f"{progress.get('requested_forecast_hours', 0)} validades concluídas."
              )
              print(f"**Com arquivo:** {len(progress.get('available_forecast_hours', []))}")
              print(f"**Sem arquivo:** {progress.get('missing_forecast_hours', [])[:40]}")
              errors=progress.get("errors", [])
              if errors:
                  print("\n**Falhas de download/processamento (até 20):**")
                  for item in errors[:20]:
                      print(f"- {item}")
          if status.get("errors"):
              print("\n**Ocorrências finais:**")
              for item in status["errors"][:20]:
                  print(f"- {item}")
          PY

      - name: Enviar dados regionais para o agregador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-nwp-${{ matrix.model }}
          path: global-nwp-output/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 1

      - name: Marcar falha quando o modelo não produzir dados
        if: always()
        shell: bash
        env:
          MODEL_KEY: ${{ matrix.model }}
        run: |
          set -euo pipefail
          STATUS="global-nwp-output/$MODEL_KEY/model_status.json"
          python - "$STATUS" "$MODEL_KEY" <<'PY'
          import json, pathlib, sys
          try:
              status=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
              if not isinstance(status, dict):
                  status={}
          except (OSError, UnicodeError, json.JSONDecodeError):
              status={}
          model = sys.argv[2]
          result = status.get("status", "failed")
          if result == "failed":
              print(f"::error::{model} falhou: {status.get('message', 'status ausente ou corrompido')}")
              for error in status.get("errors", [])[:10]:
                  print(f"::error::{error}")
              raise SystemExit(1)
          print(f"{model}: {result}")
          PY

