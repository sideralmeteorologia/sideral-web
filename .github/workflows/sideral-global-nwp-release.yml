          SIDERAL_NWP_PUBLISHER_PAYLOAD
          base64 --decode .sideral_embedded/nwp-publisher.b64 > .sideral_embedded/nwp-publisher.zip
          unzip -oq .sideral_embedded/nwp-publisher.zip -d .sideral_embedded/nwp-publisher
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".sideral_embedded/nwp-publisher/global-nwp")
          script_path = root / "publish_release.py"
          script = script_path.read_text(encoding="utf-8")
          old_urls = (
              '    public_base = os.getenv("R2_PUBLIC_BASE_URL", "").rstrip("/")\n'
              '    raw_data_base_url = f"{public_base}/nwp/data/" if public_base else "data/"'
          )
          if old_urls not in script:
              raise SystemExit("Não foi possível converter as URLs R2 do publicador.")
          script = script.replace(old_urls, '    raw_data_base_url = "data/"', 1)
          script = script.replace(
              '        "storage": "Cloudflare R2",',
              '        "storage": "GitHub Release e espelho raw",',
              1
          )
          script = script.replace('        "storage_prefix": "nwp/",', '        "storage_prefix": "",', 1)
          script = script.replace(
              "    # A publicação é enviada ao prefixo nwp/ do bucket Cloudflare R2.",
              "    # O pacote final é entregue como GitHub Release e espelho raw com Release pública atualizada.",
              1
          )
          if "R2_PUBLIC_BASE_URL" in script or "Cloudflare R2" in script:
              raise SystemExit("O publicador ainda contém configuração de Cloudflare R2.")
          script_path.write_text(script, encoding="utf-8")
          catalog_path = root / "catalog.json"
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          catalog["output"] = catalog.get("output", "").replace(
              "no prefixo nwp/ do bucket Cloudflare R2",
              "dentro do GitHub Release e espelho raw com Release pública atualizada"
          )
          catalog["notes"] = [
              note.replace(
                  "O prefixo nwp/ do Cloudflare R2 mantém apenas a rodada mais recente;",
                  "Cada execução gera um GitHub Release e espelho raw com Release pública atualizada;"
              )
              for note in catalog.get("notes", [])
          ]
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY
          echo "Motor autônomo reconstruído a partir deste YAML."

      - name: Baixar resultados de todos os modelos
        uses: actions/download-artifact@v4
        with:
          pattern: global-nwp-*
          path: release-input
          merge-multiple: false

      - name: Preparar JSONs individuais por modelo e região
        shell: bash
        env:
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
        run: |
          set -euo pipefail
          DATE_ARG=()
          CYCLE_ARG=()
          if [[ -n "${RUN_DATE:-}" ]]; then DATE_ARG=(--date "$RUN_DATE"); fi
          if [[ -n "${RUN_CYCLE:-}" && "$RUN_CYCLE" != "auto" ]]; then CYCLE_ARG=(--cycle "$RUN_CYCLE"); fi
          python .sideral_embedded/nwp-publisher/global-nwp/publish_release.py \
            --input release-input \
            --output release-assets \
            "${DATE_ARG[@]}" \
            "${CYCLE_ARG[@]}"

      - name: Liberar espaço após preparar produtos finais
        shell: bash
        run: |
          set -euo pipefail
          # release-input contains downloaded model artifacts, which are no longer
          # needed after release-assets has been prepared and validated.
          rm -rf release-input
          df -h "$RUNNER_TEMP" .

      - name: Publicar JSONs Global NWP em GitHub Release e espelho raw (direto no workflow)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_PATH: .github/workflows/sideral-global-nwp-release.yml
          SOURCE_WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_ARTIFACTS_DIR: ${{ runner.temp }}/model-artifacts
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
          FINAL_PRODUCT_DIR: sideral-global-nwp-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          test -d release-assets
          mkdir -p "$SOURCE_ARTIFACTS_DIR/$FINAL_PRODUCT_DIR"
          # Hardlink when the runner workspace and temp directory share a filesystem.
          # Fall back to normal copies on runners where hardlinks are unavailable.
          if ! cp -al release-assets/. "$SOURCE_ARTIFACTS_DIR/$FINAL_PRODUCT_DIR/"; then
            rm -rf "$SOURCE_ARTIFACTS_DIR/$FINAL_PRODUCT_DIR"
            mkdir -p "$SOURCE_ARTIFACTS_DIR/$FINAL_PRODUCT_DIR"
            cp -a release-assets/. "$SOURCE_ARTIFACTS_DIR/$FINAL_PRODUCT_DIR/"
          fi
          export SOURCE_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 .github/scripts/publish_model_release.py publish
