name: SIDERAL — Global NWP | GitHub Release pública

on:
  schedule:
    - cron: "20 9,21 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Data UTC YYYYMMDD; vazio usa a data UTC atual"
        required: false
        type: string
      run_cycle:
        description: "Ciclo UTC"
        required: false
        type: choice
        options: ["auto", "00", "06", "12", "18"]
        default: "auto"

permissions:
  contents: write
  actions: read

concurrency:
  group: sideral-global-nwp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: "Coletar ${{ matrix.model }}"
    concurrency:
      group: sideral-global-nwp-collect-${{ github.ref }}-${{ matrix.model }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model:
          # Interleave providers so one slow ECMWF batch cannot occupy the
          # entire matrix before DWD, NOAA and ECCC get a runner.
          - ecmwf_ifs
          - icon_dwd
          - gfs
          - cmc_gdps
          - ecmwf_eps
          - icon_ai
          - gfs_ai
          - cmc_geps
          - ecmwf_aifs
          - gefs_ai
          - ecmwf_aifs_ens
          - hgefs
          - ukmet
    steps:
      - name: Reconstruir coletor NWP embutido
        shell: bash
