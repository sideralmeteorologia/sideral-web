name: Validate independent WRF runners

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - fix/segmented-model-runners-clones

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML, sources, segments and artifacts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Validate all original and cloned WRF workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess
          import yaml

          root = Path(".github/workflows")
          base_files = [
              "cbr-wrf.yml",
              "cim-wrf-5km.yml",
              "cim-wrf-8km.yml",
              "metbr-wrf.yml",
              "sideral-brasil-wrf.yml",
              "tarc-wrf.yml",
          ]
          clone_prefixes = (
              "cbr-wrf-4km-",
              "cim-wrf-5km-",
              "cim-wrf-8km-",
              "metbr-wrf-4km-",
              "brasil-wrf-21km-",
              "sudeste-wrf-4km-",
              "sudeste-wrf-5km-",
              "tarc-wrf-3km-",
          )
          clone_files = sorted(
              p.name for p in root.glob("*.yml")
              if p.name.startswith(clone_prefixes)
          )
          expected_clone_count = 41
          assert len(clone_files) == expected_clone_count, (
              f"expected {expected_clone_count} independent runner copies, got {len(clone_files)}"
          )

          targets = base_files + clone_files
          configs = {}
          for filename in targets:
              path = root / filename
              with path.open(encoding="utf-8") as stream:
                  cfg = yaml.load(stream, Loader=yaml.BaseLoader)
              assert isinstance(cfg, dict), f"{filename}: root must be a mapping"
              assert isinstance(cfg.get("on"), dict), f"{filename}: missing workflow events"
              assert isinstance(cfg.get("jobs"), dict) and cfg["jobs"], f"{filename}: missing jobs"
              configs[filename] = cfg

              env = cfg.get("env", {})
              permissions = cfg.get("permissions", {})
              assert env.get("GH_TOKEN"), f"{filename}: GH_TOKEN is not set"
              assert permissions.get("actions") in ("read", "write"), (
                  f"{filename}: actions: read permission is required for checkpoint lookups"
              )

              for job_name, job in cfg["jobs"].items():
                  for step in job.get("steps", []) or []:
                      uses = step.get("uses", "")
                      if uses.startswith("actions/upload-artifact@"):
                          artifact_name = (step.get("with") or {}).get("name", "")
                          assert artifact_name, f"{filename}/{job_name}: artifact has no name"
                          forbidden = set('"<>|*?:\\/\r\n')
                          bad = sorted(set(artifact_name) & forbidden)
                          assert not bad, (
                              f"{filename}/{job_name}: invalid artifact-name characters {bad}: {artifact_name}"
                          )

              if filename in base_files:
                  assert "schedule" not in cfg["on"], (
                      f"{filename}: manual base workflow must not compete with source-specific runners"
                  )
              else:
                  schedule = cfg["on"].get("schedule", [])
                  assert schedule, f"{filename}: independent runner has no schedule"
                  assert env.get("SOURCE_MODEL") in ("icon", "ecmwf", "gfs"), (
                      f"{filename}: source model is not pinned"
                  )
                  assert not re.search(r"\\$\\{\\{\\s*github\\.workflow\\s*\\}\\}", str(cfg)), (
                      f"{filename}: artifact name still depends on the workflow display name"
                  )
                  if "-wrf2-" in filename:
                      assert env.get("MODEL_VARIANT") == "wrf2", f"{filename}: WRF2 not pinned"
                      assert env.get("WRF2_TOMORROW") == "1", f"{filename}: tomorrow forecast flag is off"
                  elif filename.startswith(("cbr-", "cim-wrf-5km-", "metbr-", "sudeste-", "tarc-")):
                      assert env.get("MODEL_VARIANT") == "wrf", f"{filename}: primary WRF not pinned"

              # Preserve the original forecast-segment graph for all existing segmented domains.
          count_segments = lambda x: sum(
              bool(re.search(r"F\d{3}-F\d{3}", (job or {}).get("name", "")))
              for job in x["jobs"].values()
          )
          if filename.startswith(("cbr-wrf-4km-", "cim-wrf-5km-", "metbr-wrf-4km-", "tarc-wrf-3km-")):
              base = (
                  "cbr-wrf.yml" if filename.startswith("cbr-") else
                  "cim-wrf-5km.yml" if filename.startswith("cim-wrf-5km-") else
                  "metbr-wrf.yml" if filename.startswith("metbr-") else
                  "tarc-wrf.yml"
              )
              assert count_segments(cfg) == count_segments(configs[base]), (
                  f"{filename}: segment graph changed ({count_segments(cfg)} != {count_segments(configs[base])})"
              )
          elif filename.startswith(("sudeste-wrf-4km-", "sudeste-wrf-5km-")):
              segment_jobs = sorted(
                  name for name in cfg["jobs"] if re.fullmatch(r"seg\d{2}", name)
              )
              assert segment_jobs == [f"seg{i:02d}" for i in range(8)], (
                  f"{filename}: expected seg00-seg07 independently, got {segment_jobs}"
              )
              assert "complete" in cfg["jobs"] and "register-run" in cfg["jobs"], (
                  f"{filename}: completion/publication jobs are missing"
              )

          # METBR runners must execute WRF in all 14 forecast segments and pass checkpoints as artifacts.
          metbr_files = sorted(
              name for name in targets
              if name == "metbr-wrf.yml" or name.startswith("metbr-wrf-4km-")
          )
          assert len(metbr_files) == 7, f"expected seven METBR workflows, got {metbr_files}"
          for filename in metbr_files:
              cfg = configs[filename]
              content = (root / filename).read_text(encoding="utf-8")
              segment_jobs = [f"seg{i:02d}" for i in range(14)]
              assert all(name in cfg["jobs"] for name in segment_jobs), (
                  f"{filename}: all 14 METBR segments are required"
              )
              for i, job_name in enumerate(segment_jobs):
                  steps = cfg["jobs"][job_name].get("steps", [])
                  expected = (
                      f"bash wrf/run_metbr_checkpoint_segment.sh "
                      f"{i * 3} {(i + 1) * 3} {i} {1 if i == 0 else 0}"
                  )
                  assert any(expected == (step.get("run") or "").strip() for step in steps), (
                      f"{filename}/{job_name}: missing WRF execution command {expected!r}"
                  )
                  uploads = [
                      step for step in steps
                      if (step.get("uses") or "").startswith("actions/upload-artifact@")
                  ]
                  assert len(uploads) == 1, f"{filename}/{job_name}: expected one checkpoint artifact upload"
                  upload = uploads[0].get("with") or {}
                  upload_paths = upload.get("path", "")
                  upload_paths = upload_paths if isinstance(upload_paths, list) else str(upload_paths).splitlines()
                  pack_steps = [
                      step for step in steps
                      if (step.get("name") or "").startswith("Bundle WRF artifact safely")
                  ]
                  assert len(pack_steps) == 1, (
                      f"{filename}/{job_name}: WRF TAR bundling step is missing"
                  )
                  pack_patterns = (pack_steps[0].get("env") or {}).get("WRF_ARTIFACT_PATTERNS", "")
                  pack_patterns = pack_patterns if isinstance(pack_patterns, list) else str(pack_patterns).splitlines()
                  assert "metbr-checkpoint-*.tar.gz" in pack_patterns, (
                      f"{filename}/{job_name}: checkpoint TAR is not included in the safe bundle"
                  )
                  assert "metbr-wrfout-*" in pack_patterns, (
                      f"{filename}/{job_name}: segment WRFOUTs are not included in the safe bundle"
                  )
                  assert len(upload_paths) == 1 and ".wrf-artifact-safe/wrf-payload-" in upload_paths[0], (
                      f"{filename}/{job_name}: upload must contain only the colon-safe TAR payload"
                  )
                  assert upload.get("if-no-files-found") == "error", (
                      f"{filename}/{job_name}: empty segment artifacts must fail"
                  )
                  if i > 0:
                      checkout_index = next(
                          (j for j, step in enumerate(steps)
                           if (step.get("uses") or "").startswith("actions/checkout@")),
                          -1,
                      )
                      downloads = [
                          (j, step) for j, step in enumerate(steps)
                          if (step.get("uses") or "").startswith("actions/download-artifact@")
                      ]
                      assert len(downloads) == 1, f"{filename}/{job_name}: checkpoint download is missing"
                      download_index, download = downloads[0]
                      download_with = download.get("with") or {}
                      assert checkout_index >= 0 and download_index > checkout_index, (
                          f"{filename}/{job_name}: download must happen after checkout"
                      )
                      restore_step = steps[download_index + 1] if download_index + 1 < len(steps) else {}
                      restore_env = restore_step.get("env") or {}
                      assert restore_env.get("WRF_ARTIFACT_RESTORE_TO") == "metbr_restart_input", (
                          f"{filename}/{job_name}: downloaded checkpoint must be restored into metbr_restart_input"
                      )
                      assert "/wrf-downloads/" in str(download_with.get("path", "")), (
                          f"{filename}/{job_name}: download must first use a temporary safe location"
                      )
                      assert download_with.get("name") == (
                           f"wrf-metbr4-${{{{ env.MODEL_VARIANT }}}}-${{{{ env.SOURCE_MODEL }}}}-"
                          f"seg{i - 1:02d}-${{{{ github.run_id }}}}"
                      ), f"{filename}/{job_name}: wrong predecessor checkpoint artifact"
              complete = cfg["jobs"].get("complete")
              assert complete, f"{filename}: complete job is missing"
              complete_steps = complete.get("steps", [])
              aggregate = [
                  step for step in complete_steps
                  if (step.get("uses") or "").startswith("actions/download-artifact@")
              ]
              assert len(aggregate) == 1, f"{filename}: complete must download the 14 segment artifacts"
              aggregate_with = aggregate[0].get("with") or {}
              assert aggregate_with.get("pattern") == (
                   "wrf-metbr4-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-"
                  "seg??-${{ github.run_id }}"
              ), f"{filename}: complete artifact pattern is incorrect"
              assert any("metbr_all_wrfout" in (step.get("run") or "") for step in complete_steps), (
                  f"{filename}: WRFOUT aggregation step is missing"
              )
              final_uploads = [
                  step for step in complete_steps
                  if (step.get("uses") or "").startswith("actions/upload-artifact@")
              ]
              assert len(final_uploads) == 1, f"{filename}: final model products artifact is missing"
              final_upload_paths = (final_uploads[0].get("with") or {}).get("path", "")
              final_upload_paths = final_upload_paths if isinstance(final_upload_paths, list) else str(final_upload_paths).splitlines()
              final_pack = [
                  step for step in complete_steps
                  if (step.get("name") or "").startswith("Bundle WRF artifact safely")
              ]
              assert len(final_pack) == 1, f"{filename}: final products must be bundled safely"
              final_pack_patterns = (final_pack[0].get("env") or {}).get("WRF_ARTIFACT_PATTERNS", "")
              assert "metbr_products/**" in str(final_pack_patterns), (
                  f"{filename}: extracted METBR products are not included in the public artifact bundle"
              )
              assert len(final_upload_paths) == 1 and ".wrf-artifact-safe/wrf-payload-" in final_upload_paths[0], (
                  f"{filename}: final product artifact must upload only its colon-safe TAR bundle"
              )
              assert "register-run" not in cfg["jobs"], (
                  f"{filename}: obsolete R2 registration job must not run"
              )
              checkpoint_script = None
              gfs_script = None
              for line in content.splitlines():
                  if "base64 -d > 'wrf/run_metbr_checkpoint_segment.sh'" in line:
                      encoded = line.split("printf '%s' '", 1)[1].split("' | base64 -d >", 1)[0]
                      checkpoint_script = base64.b64decode(encoded).decode("utf-8")
                  if "base64 -d > 'wrf/run_metbr_gfs_segment.sh'" in line:
                      encoded = line.split("printf '%s' '", 1)[1].split("' | base64 -d >", 1)[0]
                      gfs_script = base64.b64decode(encoded).decode("utf-8")
              assert checkpoint_script, f"{filename}: embedded METBR checkpoint runner is missing"
              for label, source in (("checkpoint", checkpoint_script), ("GFS", gfs_script)):
                  result = subprocess.run(
                      ["bash", "-n"],
                      input=source,
                      text=True,
                      capture_output=True,
                      check=False,
                  )
                  assert result.returncode == 0, (
                      f"{filename}: embedded METBR {label} shell syntax failed: {result.stderr}"
                  )
              assert 'START_HOUR="${1:?start hour}"' in checkpoint_script, (
                  f"{filename}: embedded METBR runner has invalid escaped shell parameters"
              )
              assert 'rm -rf "$INPUT"/*' not in checkpoint_script, (
                  f"{filename}: checkpoint runner deletes its downloaded checkpoint"
              )
              assert 'bash "$ROOT/wrf/run_metbr_gfs_segment.sh"' in checkpoint_script
              assert 'bash "$ROOT/wrf/run_metbr_source_wrf.sh"' in checkpoint_script
              assert gfs_script and "main/real.exe" in gfs_script and "main/wrf.exe" in gfs_script, (
                  f"{filename}: GFS runner does not execute both real.exe and wrf.exe"
              )
              assert "time_step = ${WRF_TIME_STEP:-20}," in gfs_script, (
                  f"{filename}: GFS WRF time step is inconsistent with METBR restart segments"
              )
              assert "namelist.segment.input" in gfs_script and "BOUNDARY_END_HOUR" in gfs_script, (
                  f"{filename}: GFS initial boundary is not extended independently of the 3-hour segment"
              )

          # The CBR extractor must exist in seg00, before its first py_compile.
          cbr_steps = configs["cbr-wrf.yml"]["jobs"]["seg00"]["steps"]
          assert any(
              "wrf/cbr_extract_json.py" in (step.get("run") or "")
              for step in cbr_steps
          ), "CBR seg00 still compiles an extractor that has not been embedded"

          # CIM 8 km imports this module directly from extract_cim_wrf_core.py.
          cim8_steps = configs["cim-wrf-8km.yml"]["jobs"]["resolve_runs"]["steps"]
          assert any(
              "wrf/extract_wrf_json.py" in (step.get("run") or "")
              for step in cim8_steps
          ), "CIM 8 km extract_wrf_json.py dependency is missing"

          # Sudeste is no longer a combined 4/5 km runner. Require all 12 fixed variants.
          expected_sudeste = {
              "sudeste-wrf-4km-wrf-icon.yml": ("4", "wrf", "icon", "0 16 * * *"),
              "sudeste-wrf-4km-wrf-ecmwf.yml": ("4", "wrf", "ecmwf", "20 16 * * *"),
              "sudeste-wrf-4km-wrf-gfs.yml": ("4", "wrf", "gfs", "40 16 * * *"),
              "sudeste-wrf-5km-wrf-icon.yml": ("5", "wrf", "icon", "30 16 * * *"),
              "sudeste-wrf-5km-wrf-ecmwf.yml": ("5", "wrf", "ecmwf", "0 17 * * *"),
              "sudeste-wrf-5km-wrf-gfs.yml": ("5", "wrf", "gfs", "20 17 * * *"),
              "sudeste-wrf-4km-wrf2-icon.yml": ("4", "wrf2", "icon", "0 7 * * *"),
              "sudeste-wrf-4km-wrf2-ecmwf.yml": ("4", "wrf2", "ecmwf", "20 7 * * *"),
              "sudeste-wrf-4km-wrf2-gfs.yml": ("4", "wrf2", "gfs", "40 7 * * *"),
              "sudeste-wrf-5km-wrf2-icon.yml": ("5", "wrf2", "icon", "0 19 * * *"),
              "sudeste-wrf-5km-wrf2-ecmwf.yml": ("5", "wrf2", "ecmwf", "20 19 * * *"),
              "sudeste-wrf-5km-wrf2-gfs.yml": ("5", "wrf2", "gfs", "40 19 * * *"),
          }
          assert set(expected_sudeste).issubset(set(clone_files)), "Sudeste independent runner matrix is incomplete"
          sudeste_groups = []
          for filename, (resolution, variant, source, cron) in expected_sudeste.items():
              cfg = configs[filename]
              env = cfg.get("env", {})
              assert env.get("RESOLUTION_KM") == resolution, f"{filename}: resolution is not pinned"
              assert env.get("WRF_TARGET_RESOLUTION_KM") == resolution, f"{filename}: target resolution is not pinned"
              dx, e_we, e_sn, time_step = (
                  ("4000", "337", "501", "20") if resolution == "4"
                  else ("5000", "269", "401", "24")
              )
              assert env.get("WRF_DX_METERS") == dx and env.get("WRF_DY_METERS") == dx, (
                  f"{filename}: DX/DY do not match the {resolution} km grid"
              )
              assert env.get("WRF_E_WE") == e_we and env.get("WRF_E_SN") == e_sn, (
                  f"{filename}: domain dimensions do not match the {resolution} km grid"
              )
              assert env.get("WRF_TIME_STEP") == time_step, f"{filename}: timestep does not match the resolution"
              assert env.get("MODEL_VARIANT") == variant, f"{filename}: model variant is not pinned"
              assert env.get("SOURCE_MODEL") == source, f"{filename}: source is not pinned"
              assert env.get("WRF2_TOMORROW") == ("1" if variant == "wrf2" else "0"), (
                  f"{filename}: WRF2 tomorrow flag does not match the variant"
              )
              schedules = cfg["on"].get("schedule", [])
              assert len(schedules) == 1 and schedules[0].get("cron") == cron, (
                  f"{filename}: expected only cron {cron}, got {schedules}"
              )
              dispatch = cfg["on"].get("workflow_dispatch") or {}
              assert not dispatch.get("inputs"), f"{filename}: must not expose a resolution selector"
              content = (root / filename).read_text(encoding="utf-8")
              assert "inputs.resolution_km" not in content, f"{filename}: still uses the combined resolution input"
              assert "4/5 km" not in content, f"{filename}: combined resolution label remains"
              assert f"sideral-wrf-{resolution}km-{variant}-sudeste-checkpoint" in content, (
                  f"{filename}: checkpoint tag is not isolated by resolution and variant"
              )
              assert "docker/login-action@v3" not in content, f"{filename}: unnecessary Docker Hub login"
              group = (cfg.get("concurrency") or {}).get("group")
              assert group, f"{filename}: concurrency group is missing"
              sudeste_groups.append(group)
          assert len(sudeste_groups) == len(set(sudeste_groups)), "Sudeste runners share concurrency groups"

          legacy_sudeste = [
              "sideral-sudeste-wrf.yml",
              "sudeste-wrf-4-5km-wrf-ecmwf.yml",
              "sudeste-wrf-4-5km-wrf-gfs.yml",
              "sudeste-wrf-4-5km-wrf-icon.yml",
              "sudeste-wrf-4-5km-wrf2-ecmwf.yml",
              "sudeste-wrf-4-5km-wrf2-gfs.yml",
              "sudeste-wrf-4-5km-wrf2-icon.yml",
          ]
          assert not any((root / name).exists() for name in legacy_sudeste), (
              "Old combined Sudeste workflows are still present"
          )

          # The watchdog must query the new source-specific files, not the manual-only base workflows.
          watchdog_path = root / "wrf-watchdog.yml"
          with watchdog_path.open(encoding="utf-8") as stream:
              watchdog_cfg = yaml.load(stream, Loader=yaml.BaseLoader)
          assert isinstance(watchdog_cfg.get("on"), dict), "wrf-watchdog.yml: invalid workflow events"
          assert isinstance(watchdog_cfg.get("jobs"), dict), "wrf-watchdog.yml: missing jobs"
          watchdog = watchdog_path.read_text(encoding="utf-8")
          missing_watchdog = [name for name in clone_files if f'"{name}"' not in watchdog]
          assert not missing_watchdog, f"Watchdog is missing runner entries: {missing_watchdog}"

          # These two families originally declared a shared concurrency group; clones must isolate it.
          for prefix in ("cim-wrf-8km-wrf-", "brasil-wrf-21km-wrf-", "sudeste-wrf-4km-", "sudeste-wrf-5km-"):
              groups = []
              for filename in clone_files:
                  if filename.startswith(prefix):
                      group = (configs[filename].get("concurrency") or {}).get("group")
                      assert group, f"{filename}: missing concurrency group"
                      groups.append(group)
              assert len(groups) == len(set(groups)), f"{prefix}: cloned runners share concurrency groups"

          # No private Docker Hub login is required for the public remapping images.
          for filename in clone_files:
              if filename.startswith("sudeste-wrf-"):
                  assert "docker/login-action@v3" not in (root / filename).read_text(encoding="utf-8")

          print(f"Validated {len(targets)} WRF workflow files and {len(clone_files)} independent clones.")
          PY
