          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/select_tarc_icon_run.py wrf/extract_wrf_severe_core.py wrf/cim4_postprocess.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog_path="wrf/cim4_wrf2_variable_catalog.json" if os.environ.get("MODEL_VARIANT")=="wrf2" else "wrf/cim4_variable_catalog.json"
          catalog=json.loads(Path(catalog_path).read_text(encoding="utf-8"))
          assert catalog["resolutionKm"] == 5
          assert catalog["domain"]["e_we"] == 447 and catalog["domain"]["e_sn"] == 375
          assert catalog["domain"]["dx_m"] == 5000 and catalog["domain"]["dy_m"] == 5000
          print("CIM 5 km catalog: 447x375 WRF domain / 446x374 mass points")
          PY

      - name: Run CIM 5 km forecast segment F039-F042
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ format('cim-{0}-5km-checkpoint-{1}', inputs.model_variant, github.run_id) }}
          WRF2_TOMORROW: ${{ env.WRF2_TOMORROW }}
          WRF_SCHEDULED_CYCLE: ${{ env.SCHEDULED_CYCLE }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_START_HOUR: '39'
          WRF_END_HOUR: '42'
          WRF_BOUNDARY_END_HOUR: '42'
        run: |
          set -euo pipefail
          chmod +x wrf/run_cim4_checkpoint_segment.sh
          bash wrf/run_cim4_checkpoint_segment.sh 39 42 13 0

      - name: Upload diagnostics for segment 13

        uses: actions/upload-artifact@v4

        with:

          name: cim5-diagnostics-seg13-${{ github.run_id }}
          path: |
            cim4_diagnostics/
            cim4_segment_output/rsl.*
            wrf_diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
  verify:
    name: Validar checkpoint CIM 5 km no R2
    runs-on: ubuntu-22.04
    needs: [seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07, seg08, seg09, seg10, seg11, seg12, seg13]
    steps:
      - name: Verificar arquivos do ciclo no R2
        env:
          CHECKPOINT_TAG: cim-${{ inputs.model_variant }}-5km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
          python3 - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('r2-objects.json').read_text()).get('Contents',[])
          npz=sum(x['Key'].endswith('.npz') for x in items)
          wrfout=sum('/wrfout_d01_' in x['Key'] or x['Key'].endswith('.nc') for x in items)
          if npz < 41 or wrfout < 5:
              raise SystemExit(f'Checkpoint CIM 5 km incompleto no R2: NPZ={npz}; WRFOUT={wrfout}')
          print(f'Checkpoint CIM 5 km validado no R2: NPZ={npz}; WRFOUT={wrfout}')
          PY
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          if-no-files-found: ignore
          retention-days: 7
