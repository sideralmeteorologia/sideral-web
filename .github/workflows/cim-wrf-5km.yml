name: SIDERAL | CIM WRF 5 km unificado

on:
  workflow_call:
    inputs:
      model_variant:
        description: "Tipo de execução WRF"
        required: false
        default: "wrf"
        type: string
      source_model:
        description: "Fonte global de contorno"
        required: false
        default: "icon"
        type: string
      scheduled_cycle:
        description: "Ciclo UTC opcional"
        required: false
        default: ""
        type: string
permissions:
  contents: write
  actions: read

env:
  PYTHON_VERSION: '3.12'
  FAMILY: cim
  RESOLUTION_KM: '5'
  MODEL_VARIANT: ${{ inputs.model_variant || 'wrf' }}
  SOURCE_MODEL: ${{ inputs.source_model || 'icon' }}
  WRF2_TOMORROW: ${{ inputs.model_variant == 'wrf2' && '1' || '0' }}
  SCHEDULED_CYCLE: ${{ inputs.scheduled_cycle || '' }}
  ICON_SOURCE_XSIZE: '113'
  ICON_SOURCE_YSIZE: '89'
  ICON_SOURCE_XFIRST: '-67.0'
  ICON_SOURCE_YFIRST: '-39.0'
  ICON_SOURCE_XINC: '0.25'
  ICON_SOURCE_YINC: '0.25'
  ECMWF_SOURCE_WEST: '-67'
  ECMWF_SOURCE_EAST: '-39'
  ECMWF_SOURCE_SOUTH: '-39'
  ECMWF_SOURCE_NORTH: '-17'


jobs:
  seg00:
    name: CIM WRF 5 km ${{ inputs.model_variant == 'wrf2' && 'WRF2' || 'principal' }} · F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load WRF parameters from versioned profile
        shell: bash
        run: |
          set -euo pipefail
          profile="runners/parameters/cim5.env"
          test -s "$profile" || { echo "Perfil WRF ausente: $profile" >&2; exit 1; }
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            [[ "$line" == *=* ]] || { echo "Linha inválida em $profile: $line" >&2; exit 1; }
            echo "$line" >> "$GITHUB_ENV"
          done < "$profile"
      - name: Incorporar executores CIM 5 km e adaptador R2
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          mkdir -p "$(dirname 'wrf/run_cim4_checkpoint_segment.sh')"
          cp "runners/cim5/shared/run_cim4_checkpoint_segment.sh" "wrf/run_cim4_checkpoint_segment.sh"
          mkdir -p "$(dirname 'wrf/run_cim4_icon_wrf.sh')"
          cp "runners/cim5/icon/run_cim4_icon_wrf.sh" "wrf/run_cim4_icon_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_cim4_ecmwf_wrf.sh')"
          cp "runners/cim5/ecmwf/run_cim4_ecmwf_wrf.sh" "wrf/run_cim4_ecmwf_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_cim4_gfs_wrf.sh')"
          cp "runners/cim5/gfs/run_cim4_gfs_wrf.sh" "wrf/run_cim4_gfs_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_cim4_restart_segment.sh')"
          cp "runners/cim5/shared/run_cim4_restart_segment.sh" "wrf/run_cim4_restart_segment.sh"
          mkdir -p "$(dirname 'wrf/run_cim4_wrf_with_source.sh')"
          cp "runners/cim5/shared/run_cim4_wrf_with_source.sh" "wrf/run_cim4_wrf_with_source.sh"
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          cp "runners/cim5/icon/fetch_icon_wrf_step.py" "wrf/fetch_icon_wrf_step.py"
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          cp "runners/cim5/ecmwf/fetch_ecmwf_wrf_input.py" "wrf/fetch_ecmwf_wrf_input.py"
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          cp "runners/cim5/gfs/fetch_gfs_land_support.py" "wrf/fetch_gfs_land_support.py"
          mkdir -p "$(dirname 'wrf/select_tarc_icon_run.py')"
          cp "runners/cim5/icon/select_tarc_icon_run.py" "wrf/select_tarc_icon_run.py"
          mkdir -p "$(dirname 'wrf/extract_wrf_severe.py')"
          cp "runners/cim5/shared/extract_wrf_severe.py" "wrf/extract_wrf_severe.py"
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          cp "runners/cim5/shared/extract_wrf_severe_core.py" "wrf/extract_wrf_severe_core.py"
          mkdir -p "$(dirname 'wrf/cim4_postprocess.py')"
          cp "runners/cim5/shared/cim4_postprocess.py" "wrf/cim4_postprocess.py"
          mkdir -p "$(dirname 'wrf/cim4_variable_catalog.json')"
          cp "runners/cim5/wrf2/cim4_wrf2_variable_catalog.json" "wrf/cim4_wrf2_variable_catalog.json"
          cp "runners/cim5/shared/cim4_variable_catalog.json" "wrf/cim4_variable_catalog.json"
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          cp "runners/cim5/shared/ensure_eccodes_tools.sh" "wrf/ensure_eccodes_tools.sh"
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          cp "runners/cim5/ecmwf/Vtable.ECMWF_OPEN" "wrf/Vtable.ECMWF_OPEN"
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          cp "runners/cim5/gfs/Vtable.GFS_SOIL" "wrf/Vtable.GFS_SOIL"
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          cp "runners/cim5/shared/ensure_metbr_wrf_runtime.sh" "wrf/ensure_metbr_wrf_runtime.sh"
          cp "runners/cim5/icon/Vtable.ICONp" "wrf/Vtable.ICONp"
          mkdir -p wrf/bin
          cp "runners/cim5/shared/gh" "wrf/bin/gh"
          chmod +x wrf/bin/gh
          for script in wrf/*.sh; do [[ -f "$script" ]] && chmod +x "$script"; done
      - name: Validar scripts incorporados
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_cim4_checkpoint_segment.sh wrf/run_cim4_icon_wrf.sh wrf/run_cim4_ecmwf_wrf.sh wrf/run_cim4_gfs_wrf.sh wrf/run_cim4_restart_segment.sh wrf/run_cim4_wrf_with_source.sh
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/select_tarc_icon_run.py wrf/extract_wrf_severe.py wrf/extract_wrf_severe_core.py wrf/cim4_postprocess.py
      - name: Salvar cache de código científico CIM 5 km
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim5-runtime-${{ github.sha }}
      - name: Configurar adaptador R2
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Restore embedded scientific runtime
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim5-runtime-${{ github.sha }}
      - name: Add R2 adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"

      - name: Install WRF input and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          source wrf/ensure_eccodes_tools.sh
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'

      - name: Validate CIM 5 km runner scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cim4_checkpoint_segment.sh
            wrf/run_cim4_icon_wrf.sh
            wrf/run_cim4_ecmwf_wrf.sh
            wrf/run_cim4_gfs_wrf.sh
            wrf/run_cim4_wrf_with_source.sh
            wrf/run_cim4_restart_segment.sh
          )
          for script in "${scripts[@]}"; do
            test -s "$script"
            bash -n "$script"
          done
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/select_tarc_icon_run.py wrf/extract_wrf_severe_core.py wrf/cim4_postprocess.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog_path="wrf/cim4_wrf2_variable_catalog.json" if os.environ.get("MODEL_VARIANT")=="wrf2" else "wrf/cim4_variable_catalog.json"
          catalog=json.loads(Path(catalog_path).read_text(encoding="utf-8"))
          assert catalog["resolutionKm"] == 5
          assert catalog["domain"]["e_we"] == 447 and catalog["domain"]["e_sn"] == 375
          assert catalog["domain"]["dx_m"] == 5000 and catalog["domain"]["dy_m"] == 5000
          print(f"{catalog['model']}: 447x375 WRF domain / 446x374 mass points")
          PY

      - name: Run CIM 5 km forecast segment F000-F003 F000-F006
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ format('cim-{0}-5km-checkpoint-{1}', inputs.model_variant, github.run_id) }}
          WRF2_TOMORROW: ${{ env.WRF2_TOMORROW }}
          WRF_SCHEDULED_CYCLE: ${{ env.SCHEDULED_CYCLE }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '3'
          WRF_BOUNDARY_END_HOUR: '3'
        run: |
          set -euo pipefail
          chmod +x wrf/run_cim4_checkpoint_segment.sh
          bash wrf/run_cim4_checkpoint_segment.sh 0 3 0 1

      - name: Upload diagnostics for segment 00

        uses: actions/upload-artifact@v4

        with:

          name: cim5-diagnostics-seg00-${{ github.run_id }}
          path: |
            cim4_diagnostics/
            cim4_segment_output/rsl.*
            wrf_diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
