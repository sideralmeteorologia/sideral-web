name: SIDERAL | WRF Watchdog Global

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: sideral-wrf-watchdog
  cancel-in-progress: false

jobs:
  inspect:
    name: Verificar estado operacional dos runners WRF
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Consultar últimas execuções (somente leitura)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone

          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          workflows=[
              ("METBR WRF 4 km","metbr-wrf.yml"),
              ("CBR WRF 4 km","cbr-wrf.yml"),
              ("TARC WRF 3 km","tarc-wrf.yml"),
              ("Sudeste WRF 4/5 km","sideral-sudeste-wrf.yml"),
              ("CIM WRF 5 km","cim-wrf-5km.yml"),
              ("CIM WRF 8 km","cim-wrf-8km.yml"),
              ("Brasil WRF 21 km","sideral-brasil-wrf.yml"),
          ]
          print("## Watchdog WRF Sideral")
          print()
          print("| Família | Estado mais recente | Conclusão | Início UTC | Observação |")
          print("|---|---|---|---|---|")
          failures=0
          now=datetime.now(timezone.utc)
          for label,filename in workflows:
              path=urllib.parse.quote(filename,safe="")
              url=f"https://api.github.com/repos/{repo}/actions/workflows/{path}/runs?per_page=3"
              req=urllib.request.Request(url,headers={
                  "Authorization":f"Bearer {token}",
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"Sideral-WRF-Watchdog"
              })
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      runs=json.load(response).get("workflow_runs",[])
                  if not runs:
                      failures+=1
                      print(f"| {label} | — | — | — | Sem execução registrada |")
                      continue
                  run=runs[0]
                  status=run.get("status","unknown")
                  conclusion=run.get("conclusion") or "—"
                  created=datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
                  age=(now-created).total_seconds()/3600
                  note=""
                  if status=="completed" and conclusion not in ("success",None):
                      failures+=1
                      note="Falha na última execução"
                  elif status!="completed" and age>10:
                      failures+=1
                      note=f"Execução parada há {age:.1f} h"
                  elif status=="in_progress":
                      note=f"Em execução ({age:.1f} h)"
                  elif conclusion=="success":
                      note="OK"
                  else:
                      note="Aguardando conclusão"
                  print(f"| {label} | {status} | {conclusion} | {created:%Y-%m-%d %H:%M} | {note} |")
              except Exception as exc:
                  failures+=1
                  safe=str(exc).replace("|","/")
                  print(f"| {label} | erro de consulta | — | — | {safe[:180]} |")
          print()
          print(f"Famílias com alerta: **{failures}** de {len(workflows)}.")
          if failures:
              print()
              print("> O watchdog não reexecuta WRF nem altera workflows. Ele somente sinaliza o estado observado.")
          PY
      - name: Registrar status do watchdog
        run: echo "Consulta concluída. Nenhuma execução ou publicação foi iniciada pelo watchdog."