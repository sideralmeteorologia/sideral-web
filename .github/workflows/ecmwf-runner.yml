name: SIDERAL | Runner ECMWF
run-name: "ECMWF | ${{ inputs.domain }}"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domínio WRF a executar
        required: true
        type: choice
        options: [cbr, cim5, cim8, metbr, sudeste, tarc, brasil]
      resolution_km:
        description: Resolução quando o domínio selecionado for Sudeste
        required: false
        default: '4'
        type: choice
        options: ['4', '5']
      run_date:
        description: Data UTC YYYYMMDD para domínios que aceitam data manual
        required: false
        type: string
      run_cycle:
        description: Ciclo UTC para domínios que aceitam ciclo manual
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  cbr:
    name: CBR 4 km
    if: inputs.domain == 'cbr'
    uses: ./.github/workflows/cbr-wrf.yml
    with:
      model_variant: wrf
      source_model: ecmwf
    secrets: inherit

  cim5:
    name: CIM 5 km
    if: inputs.domain == 'cim5'
    uses: ./.github/workflows/cim-wrf-5km.yml
    with:
      model_variant: wrf
      source_model: ecmwf
      scheduled_cycle: ${{ inputs.run_cycle }}
    secrets: inherit

  cim8:
    name: CIM 8 km
    if: inputs.domain == 'cim8'
    uses: ./.github/workflows/cim-wrf-8km.yml
    with:
      source_model: ecmwf
    secrets: inherit

  metbr:
    name: METBR 4 km
    if: inputs.domain == 'metbr'
    uses: ./.github/workflows/metbr-wrf.yml
    with:
      model_variant: wrf
      source_model: ecmwf
    secrets: inherit

  sudeste:
    name: Sudeste 4/5 km
    if: inputs.domain == 'sudeste'
    uses: ./.github/workflows/sideral-sudeste-wrf.yml
    with:
      model_variant: wrf
      source_model: ecmwf
      resolution_km: ${{ inputs.resolution_km }}
    secrets: inherit

  tarc:
    name: TARC 3 km
    if: inputs.domain == 'tarc'
    uses: ./.github/workflows/tarc-wrf.yml
    with:
      model_variant: wrf
      source_model: ecmwf
    secrets: inherit

  brasil:
    name: Brasil 21 km
    if: inputs.domain == 'brasil'
    uses: ./.github/workflows/sideral-brasil-wrf.yml
    with:
      source_model: ecmwf
      run_date: ${{ inputs.run_date }}
      run_cycle: ${{ inputs.run_cycle }}
    secrets: inherit
