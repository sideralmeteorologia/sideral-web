name: SIDERAL | CIM WRF 8 km | GFS | WRF

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_model:
        description: "Fonte da rodada CIM 8 km"
        required: false
        default: all
        type: string

  schedule:
    - cron: '57 9 * * *'

permissions:
  contents: write
  actions: read

# Cada fonte tem sua própria execução e seu próprio checkpoint; nunca cancelar
# uma rodada ECMWF/GFS porque outra fonte começou.
concurrency:
  group: cim-wrf-8km
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHON_VERSION: '3.12'
  WRF_HISTORY_INTERVAL_MINUTES: '60'
  CIM_RESOLUTION_KM: '8'
  CIM_OUTPUT_INTERVAL_HOURS: '1'
  CIM_MAX_PUBLISHED_HOUR: '40'
  CIM_DOMAIN_VERSION: 'cim-sigma-area-v1-8km'
  CIM_GRID_X: '279'
  CIM_GRID_Y: '234'
  FAMILY: cim
  RESOLUTION_KM: '8'
  MODEL_VARIANT: wrf
  SOURCE_MODEL: gfs

jobs:
  resolve_runs:
    name: Resolver ICON, ECMWF e GFS com cobertura ate F042
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      icon_date: ${{ steps.resolve_icon.outputs.date }}
      icon_cycle: ${{ steps.resolve_icon.outputs.cycle }}
      ecmwf_date: ${{ steps.resolve_ecmwf.outputs.date }}
      ecmwf_cycle: ${{ steps.resolve_ecmwf.outputs.cycle }}
      gfs_date: ${{ steps.resolve_gfs.outputs.date }}
      gfs_cycle: ${{ steps.resolve_gfs.outputs.cycle }}
      models: ${{ steps.filter_models.outputs.models }}
    steps:

      - uses: actions/checkout@v4
      - name: Restaurar código científico CIM 8 km
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim8-runtime-${{ github.sha }}

      - name: Embutir executores científicos CIM 8 km
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'wrf/run_icon_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_icon_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_ecmwf_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_ecmwf_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_gfs_segment.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_gfs_segment.sh'
          mkdir -p "$(dirname 'wrf/run_gfs_test.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_gfs_test.sh'
          mkdir -p "$(dirname 'wrf/run_wrf_with_source.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_wrf_with_source.sh'
          mkdir -p "$(dirname 'wrf/extract_cim_wrf.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_cim_wrf.py'
          mkdir -p "$(dirname 'wrf/extract_cim_wrf_core.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_cim_wrf_core.py'
          mkdir -p "$(dirname 'wrf/extract_wrf_json.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_json.py'
          mkdir -p "$(dirname 'wrf/extract_wrf_severe.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_severe.py'
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_severe_core.py'
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          printf '%s' '' | base64 -d > 'wrf/ensure_eccodes_tools.sh'
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_gfs_land_support.py'
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_icon_wrf_step.py'
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_ecmwf_wrf_input.py'
          mkdir -p "$(dirname 'wrf/run_ecmwf_ifs.py')"
          printf '%s' '' | base64 -d > 'wrf/run_ecmwf_ifs.py'
          mkdir -p "$(dirname 'wrf/ecmwf_ifs_runner.py')"
          printf '%s' '' | base64 -d > 'wrf/ecmwf_ifs_runner.py'
          mkdir -p "$(dirname 'wrf/select_icon_cycle.py')"
          printf '%s' '' | base64 -d > 'wrf/select_icon_cycle.py'
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.ECMWF_OPEN'
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.ICONp'
          printf '%s' '' | base64 -d > 'wrf/Vtable.GFS_SOIL'
      - name: Garantir executabilidade dos scripts WRF
        shell: bash
        run: chmod +x wrf/*.sh
      - name: Cache de código CIM 8 km
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim8-runtime-${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar e validar cliente ECMWF
        if: ${{ env.SOURCE_MODEL == 'all' || env.SOURCE_MODEL == 'ecmwf' }}
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check 'ecmwf-opendata==0.3.34'
          python3 -c 'from ecmwf.opendata import Client; print("ECMWF Open Data client OK")'

      - name: Resolver ciclo ECMWF IFS
        id: resolve_ecmwf
        if: ${{ env.SOURCE_MODEL == 'all' || env.SOURCE_MODEL == 'ecmwf' }}
        shell: bash
        run: |
          set -uo pipefail
          if python3 - <<'PY' > ecmwf-cycle.txt; then
          import datetime as dt
          from ecmwf.opendata import Client
          client = Client(source='ecmwf', model='ifs')
          value = client.latest(type='fc', step=42, param=['2t'])
          if not isinstance(value, dt.datetime):
              value = dt.datetime.fromisoformat(str(value))
          if value.tzinfo is None:
              value = value.replace(tzinfo=dt.timezone.utc)
          value = value.astimezone(dt.timezone.utc)
          print(value.strftime('%Y%m%d %H'))
          PY
            read -r ECMWF_DATE ECMWF_CYCLE < ecmwf-cycle.txt
            if [[ -n "${ECMWF_DATE:-}" && -n "${ECMWF_CYCLE:-}" ]]; then
              echo "date=$ECMWF_DATE" >> "$GITHUB_OUTPUT"
              echo "cycle=$ECMWF_CYCLE" >> "$GITHUB_OUTPUT"
              echo "ECMWF IFS fixado: $ECMWF_DATE $ECMWF_CYCLE Z"
            else
              echo "::warning::ECMWF não retornou ciclo válido; somente o runner ECMWF será pulado."
            fi
          else
            echo "::warning::ECMWF IFS indisponível no resolver; ICON e GFS continuarão independentes."
          fi

      - name: Resolver ciclo ICON Global v1
        id: resolve_icon
        if: ${{ env.SOURCE_MODEL == 'all' || env.SOURCE_MODEL == 'icon' }}
        shell: bash
        run: |
          set -uo pipefail
          if python3 wrf/select_icon_cycle.py --start-hour 0 --end-hour 42 --interval 3 > icon-cycle.txt && read -r RUN_DATE RUN_CYCLE < icon-cycle.txt && printf 'RUN_DATE=%s\nRUN_CYCLE=%s\n' "$RUN_DATE" "$RUN_CYCLE" > icon-v1-run.env; then
            source icon-v1-run.env
            echo "date=$RUN_DATE" >> "$GITHUB_OUTPUT"
            echo "cycle=$RUN_CYCLE" >> "$GITHUB_OUTPUT"
            echo "ICON v1 fixado: $RUN_DATE $RUN_CYCLE Z"
          else
            echo "::warning::Nenhum ciclo ICON recente/completo; somente o runner ICON será pulado."
          fi

      - name: Resolver ciclo GFS com janela completa
        id: resolve_gfs
        if: ${{ env.SOURCE_MODEL == 'all' || env.SOURCE_MODEL == 'gfs' }}
        shell: bash
        run: |
          set -uo pipefail
          GFS_DATE=''
          GFS_CYCLE=''
          while read -r DATE CYCLE; do
            READY=1
            echo "Validando GFS ${DATE} ${CYCLE}Z F000-F042"
            for STEP in $(seq 0 3 42); do
              printf -v FH '%03d' "$STEP"
              URL="https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.${DATE}/${CYCLE}/atmos/gfs.t${CYCLE}z.pgrb2.0p25.f${FH}"
              if ! curl --retry 3 --retry-delay 2 -fsSL --range 0-0 --connect-timeout 15 --max-time 45 -o /dev/null "$URL"; then
                echo "GFS ${DATE} ${CYCLE}Z incompleto em F${FH}"
                READY=0
                break
              fi
            done
            if (( READY == 1 )); then
              GFS_DATE="$DATE"
              GFS_CYCLE="$CYCLE"
              break
            fi
          done < <(python3 - <<'PY'
          import datetime as dt
          now=dt.datetime.now(dt.timezone.utc)
          base=now.replace(hour=(now.hour//6)*6,minute=0,second=0,microsecond=0)
          for n in range(4):
              x=base-dt.timedelta(hours=6*n)
              print(x.strftime("%Y%m%d %H"))
          PY
          )
          if [[ -n "$GFS_DATE" && -n "$GFS_CYCLE" ]]; then
            echo "date=$GFS_DATE" >> "$GITHUB_OUTPUT"
            echo "cycle=$GFS_CYCLE" >> "$GITHUB_OUTPUT"
            echo "GFS fixado: $GFS_DATE $GFS_CYCLE Z"
          else
            echo "::warning::Nenhuma rodada GFS recente e completa; somente o runner GFS será pulado."
          fi

      - id: filter_models
        name: Filtrar matriz pelas fontes disponíveis
        shell: bash
        env:
          SOURCE_INPUT: ${{ env.SOURCE_MODEL }}
          ICON_DATE: ${{ steps.resolve_icon.outputs.date }}
          ECMWF_DATE: ${{ steps.resolve_ecmwf.outputs.date }}
          GFS_DATE: ${{ steps.resolve_gfs.outputs.date }}
        run: |
          set -euo pipefail
          case "${SOURCE_INPUT:-all}" in
            all) requested=(icon ecmwf gfs) ;;
            icon|ecmwf|gfs) requested=("$SOURCE_INPUT") ;;
            *) echo "Fonte inválida: $SOURCE_INPUT" >&2; exit 2 ;;
          esac
          selected=()
          for model in "${requested[@]}"; do
            case "$model" in
              icon) [[ -n "$ICON_DATE" ]] && selected+=("$model") ;;
              ecmwf) [[ -n "$ECMWF_DATE" ]] && selected+=("$model") ;;
              gfs) [[ -n "$GFS_DATE" ]] && selected+=("$model") ;;
            esac
          done
          python3 - "${selected[@]}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          print("models=" + json.dumps(sys.argv[1:]))
          PY
      - name: Verificar se ao menos uma fonte solicitada está disponível
        shell: bash
        env:
          ICON_DATE: ${{ steps.resolve_icon.outputs.date }}
          ECMWF_DATE: ${{ steps.resolve_ecmwf.outputs.date }}
          GFS_DATE: ${{ steps.resolve_gfs.outputs.date }}
        run: |
          if [[ -n "${ICON_DATE:-}" || -n "${ECMWF_DATE:-}" || -n "${GFS_DATE:-}" ]]; then
            exit 0
          fi
          echo "Nenhuma das fontes solicitadas possui uma janela recente/completa." >&2
          exit 1


  run_cim:
    name: CIM 8 km ${{ matrix.model }} - F000 a F040 horario
    needs: resolve_runs

    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ${{ fromJSON(needs.resolve_runs.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar código científico CIM 8 km
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim8-runtime-${{ github.sha }}


      - name: Preparar runner
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          source wrf/ensure_eccodes_tools.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'numpy==1.26.4' 'xarray>=2024.1,<2026' 'netCDF4>=1.7,<2' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'

      - name: Validar extratores e diagnósticos CIM
        run: python3 -m py_compile wrf/extract_wrf_severe_core.py wrf/extract_wrf_severe.py wrf/extract_wrf_json.py wrf/extract_cim_wrf_core.py wrf/extract_cim_wrf.py

      - name: Executar CIM 8 km
        env:
          ICON_DATE: ${{ needs.resolve_runs.outputs.icon_date }}
          ICON_CYCLE: ${{ needs.resolve_runs.outputs.icon_cycle }}
          ECMWF_DATE: ${{ needs.resolve_runs.outputs.ecmwf_date }}
          ECMWF_CYCLE: ${{ needs.resolve_runs.outputs.ecmwf_cycle }}
          GFS_DATE: ${{ needs.resolve_runs.outputs.gfs_date }}
          GFS_CYCLE: ${{ needs.resolve_runs.outputs.gfs_cycle }}
          WRF_DX_METERS: '8000'
          WRF_DY_METERS: '8000'
          WRF_E_WE: '280'
          WRF_E_SN: '235'
          WRF_TIME_STEP: '30'
          WRF_REF_LAT: '-27.50'
          WRF_REF_LON: '-52.75'
          WRF_STAND_LON: '-52.75'
          # A fonte global chega de 3 em 3 h. Integramos ate F042 para manter
          # a fronteira completa e publicamos exatamente F000..F040.
          WRF_RUN_HOURS: '42'
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '42'
          WRF_HISTORY_INTERVAL_MINUTES: '60'
          CIM_RESOLUTION_KM: '8'
          CIM_OUTPUT_INTERVAL_HOURS: '1'
          CIM_MAX_PUBLISHED_HOUR: '40'
          # Buffer da fonte global ao redor da area exibida no mapa Sigma.
          ICON_SOURCE_XSIZE: '113'
          ICON_SOURCE_YSIZE: '89'
          ICON_SOURCE_XFIRST: '-67.0'
          ICON_SOURCE_YFIRST: '-39.0'
          ICON_SOURCE_XINC: '0.25'
          ICON_SOURCE_YINC: '0.25'
          ECMWF_SOURCE_WEST: '-67'
          ECMWF_SOURCE_EAST: '-39'
          ECMWF_SOURCE_SOUTH: '-39'
          ECMWF_SOURCE_NORTH: '-17'
        shell: bash
        run: |
          set -euxo pipefail
          if [[ '${{ matrix.model }}' == 'icon' ]]; then
            export FORCE_RUN_DATE="$ICON_DATE"
            export FORCE_RUN_CYCLE="$ICON_CYCLE"
            export SOURCE_MODEL=icon
            RUNNER='wrf/run_icon_wrf.sh'
          elif [[ '${{ matrix.model }}' == 'ecmwf' ]]; then
            export FORCE_RUN_DATE="$ECMWF_DATE"
            export FORCE_RUN_CYCLE="$ECMWF_CYCLE"
            export SOURCE_MODEL=ecmwf
            RUNNER='wrf/run_ecmwf_wrf.sh'
          else
            export FORCE_RUN_DATE="$GFS_DATE"
            export FORCE_RUN_CYCLE="$GFS_CYCLE"
            export SOURCE_MODEL=gfs
            export WRF_COLD_START=1
            RUNNER='wrf/run_gfs_segment.sh'
          fi
          test "$WRF_DX_METERS" = '8000'
          test "$WRF_TIME_STEP" = '30'
          test "$WRF_DY_METERS" = '8000'
          test "$WRF_HISTORY_INTERVAL_MINUTES" = '60'
          echo "CIM ${{ matrix.model }}: grade 8 km, 280x235 pontos WRF, saida horaria, horizonte publicado F040"
          echo "Area alvo visual: ~63.6W..41.8W / 35.6S..19.4S"
          chmod +x "$RUNNER"
          if [[ "$SOURCE_MODEL" == "gfs" ]]; then
            chmod +x wrf/run_gfs_test.sh
            "$RUNNER"
          else
            "$RUNNER"
          fi

      - name: Extrair grade nativa horaria
        env:
          CIM_RESOLUTION_KM: '8'
          CIM_OUTPUT_INTERVAL_HOURS: '1'
          CIM_MAX_PUBLISHED_HOUR: '40'
        run: python wrf/extract_cim_wrf.py --model ${{ matrix.model }} --output-dir cim_publish

      - name: Identificar dominio e viewport CIM
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('cim_publish/metadata.json')
          meta = json.loads(path.read_text(encoding='utf-8'))
          meta['domainId'] = 'cim-sigma-area-v1-8km'
          meta['domainName'] = 'CIM Sul/Sudeste 8 km'
          meta['domainTargets'] = [
              'Sul do Brasil', 'Sudeste do Brasil', 'Uruguai',
              'leste do Paraguai', 'nordeste/centro-leste da Argentina'
          ]
          meta['displayBoundingBox'] = {
              'west': -63.6, 'east': -41.8, 'south': -35.6, 'north': -19.4
          }
          meta['sourceBoundingBox'] = {
              'west': -67.0, 'east': -39.0, 'south': -39.0, 'north': -17.0
          }
          meta['wrfGridConfig'] = {
              'e_we': 280, 'e_sn': 235, 'gridX': 279, 'gridY': 234,
              'dxMeters': 8000, 'dyMeters': 8000,
              'refLat': -27.50, 'refLon': -52.75, 'standLon': -52.75,
              'timeStepSeconds': 30, 'historyIntervalMinutes': 60,
              'integrationHours': 42, 'publishedHorizonHours': 40
          }
          path.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Validar CIM 8 km F000-F040
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          root = Path('cim_publish')
          meta = json.loads((root / 'metadata.json').read_text(encoding='utf-8'))
          assert float(meta['resolutionKm']) == 8.0, meta.get('resolutionKm')
          assert meta['reflectivitySource'] == 'REFL_10CM_NATIVE'
          assert meta['nativeGrid'] is True
          assert meta['temporalResolutionMinutes'] == 60
          frames = meta['frames']
          hours = [int(f['forecastHour']) for f in frames]
          assert hours == list(range(0, 41)), hours
          assert len(frames) == 41
          for frame in frames:
              assert int(frame['gridX']) == 279, frame
              assert int(frame['gridY']) == 234, frame
              assert frame.get('nativeGrid') is True, frame
              assert frame.get('reflectivitySource') == 'REFL_10CM_NATIVE', frame
              assert (root / frame['file']).is_file(), frame
          with gzip.open(root / frames[0]['file'], 'rt', encoding='utf-8') as fh:
              payload = json.load(fh)
          assert int(payload['dxMeters']) == 8000 and int(payload['dyMeters']) == 8000, payload
          assert int(payload['gridX']) == 279 and int(payload['gridY']) == 234, payload
          assert payload.get('nativeGrid') is True, payload
          assert payload.get('reflectivitySource') == 'REFL_10CM_NATIVE', payload
          print('CIM 8 KM VALIDADO:', meta['model'], 'F000-F040 horario', 'grid=279x234')
          PY

      - name: Publicar produtos CIM 8 km no Cloudflare R2
        shell: bash
        env:
          SOURCE_MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          : # artifact-only workflow
          : # artifact-only workflow
          prefix="sideral/cim/8km/wrf/$SOURCE_MODEL/runs/$GITHUB_RUN_ID"
          latest="sideral/cim/8km/wrf/$SOURCE_MODEL/latest"
          : # artifact-only workflow
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > run-manifest.json <<EOF
          {"schema":"sideral-wrf-run-v1","family":"cim","resolutionKm":8,"variant":"wrf","source":"$SOURCE_MODEL","runId":"$GITHUB_RUN_ID","completedAt":"$completed_at","artifactPrefix":"$prefix/","latestPrefix":"$latest","publishExtensions":[".json",".npz"]}
          EOF
          : # artifact-only workflow
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-cim8-wrf-gfs-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          if-no-files-found: ignore
          retention-days: 7