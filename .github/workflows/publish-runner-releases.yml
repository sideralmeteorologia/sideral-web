name: SIDERAL | Publicar Releases dos Runners

on:
  workflow_run:
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: sideral-release-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar saídas finais no GitHub Releases
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.name != 'SIDERAL | Publicar Releases dos Runners'
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar somente os produtos finais da execução
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          SOURCE_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/extracted
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .size_in_bytes] | @tsv' \
            > "$RUNNER_TEMP/artifacts.tsv"
          : > "$RUNNER_TEMP/selected.tsv"
          while IFS=$'\t' read -r id name size; do
            [[ -n "${id:-}" ]] || continue
            lower="${name,,}"
            if [[ "$lower" =~ checkpoint|(^|[-_])seg[0-9]{1,3}([-_]|$)|runtime|cache|restart|boundary ]]; then
              echo "Ignorando arquivo interno do runner: $name"
              continue
            fi
            safe="$(printf '%s' "$name" | tr -cs '[:alnum:]._-' '-')"
            asset="${safe}-${id}.zip"
            curl --fail --silent --show-error --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "release-assets/$asset"
            test -s "release-assets/$asset"
            printf '%s\t%s\t%s\t%s\n' "$id" "$name" "$size" "$asset" >> "$RUNNER_TEMP/selected.tsv"
            mkdir -p "release-assets/extracted/$id"
            unzip -oq "release-assets/$asset" -d "release-assets/extracted/$id"
          done < "$RUNNER_TEMP/artifacts.tsv"

          if [[ ! -s "$RUNNER_TEMP/selected.tsv" ]]; then
            echo "Nenhum produto final publicável nesta execução; checkpoints internos não serão expostos."
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export RELEASE_TAG="sideral-run-${SOURCE_RUN_ID}-attempt-${SOURCE_RUN_ATTEMPT}"
          export SOURCE_RUN_ID SOURCE_RUN_NUMBER SOURCE_RUN_ATTEMPT SOURCE_WORKFLOW SOURCE_BRANCH SOURCE_SHA SOURCE_RUN_URL SOURCE_CREATED_AT SOURCE_UPDATED_AT

          python3 - <<'PY'
          import csv, json, os, re, shutil
          from pathlib import Path
          from urllib.parse import quote

          root = Path("release-assets")
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          rows = []
          readable = []
          selected = Path(os.environ["RUNNER_TEMP"]) / "selected.tsv"

          def safe(value):
              return re.sub(r"[^A-Za-z0-9._-]+", "-", value).strip("-")[:150] or "file"

          with selected.open(encoding="utf-8") as stream:
              for artifact_id, name, size, archive in csv.reader(stream, delimiter="\t"):
                  rows.append({
                      "artifact_id": int(artifact_id),
                      "artifact_name": name,
                      "size_bytes": int(size),
                      "archive": archive,
                      "browser_url": f"https://github.com/{repo}/releases/download/{tag}/{quote(archive)}",
                  })
                  extracted = root / "extracted" / artifact_id
                  for source in sorted(extracted.rglob("*")):
                      if not source.is_file() or source.suffix.lower() not in {".json", ".geojson", ".csv", ".txt", ".md"}:
                          continue
                      if source.stat().st_size > 12 * 1024 * 1024:
                          continue
                      relative = source.relative_to(extracted).as_posix()
                      asset = f"{safe(name)}-{safe(relative.replace('/', '--'))}"
                      target = root / asset
                      if target.exists():
                          target = root / f"{safe(name)}-{artifact_id}-{safe(relative.replace('/', '--'))}"
                      shutil.copy2(source, target)
                      readable.append({
                          "artifact_name": name,
                          "path_in_artifact": relative,
                          "asset": target.name,
                          "size_bytes": target.stat().st_size,
                          "browser_url": f"https://github.com/{repo}/releases/download/{tag}/{quote(target.name)}",
                      })

          manifest = {
              "publisher": "SIDERAL GitHub Actions",
              "publication": "GitHub Release",
              "source_workflow": os.environ["SOURCE_WORKFLOW"],
              "run_id": int(os.environ["SOURCE_RUN_ID"]),
              "run_number": int(os.environ["SOURCE_RUN_NUMBER"]),
              "run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "branch": os.environ["SOURCE_BRANCH"],
              "commit": os.environ["SOURCE_SHA"],
              "workflow_run_url": os.environ["SOURCE_RUN_URL"],
              "created_at": os.environ["SOURCE_CREATED_AT"],
              "updated_at": os.environ["SOURCE_UPDATED_AT"],
              "release_tag": tag,
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "archives": rows,
              "readable_files": readable,
              "internal_checkpoints_published": False,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "README.md").write_text(
              "# SIDERAL — publicação dos runners\n\n"
              f"- Workflow: {manifest['source_workflow']}\n"
              f"- Execução: {manifest['workflow_run_url']}\n"
              f"- Commit: {manifest['commit']}\n"
              f"- Arquivos compactados: {len(rows)}\n"
              f"- Arquivos de metadados anexados individualmente: {len(readable)}\n\n"
              "Consulte manifest.json para obter os links diretos de cada arquivo. "
              "Checkpoints temporários de segmentos não são publicados nesta Release.\n",
              encoding="utf-8",
          )
          PY

          echo "has_assets=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Arquivos finais recolhidos; metadados legíveis foram separados dos ZIPs."

      - name: Criar GitHub Release com dados e manifesto
        if: steps.collect.outputs.has_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.collect.outputs.release_tag }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          title="SIDERAL | $SOURCE_WORKFLOW | run $SOURCE_RUN_NUMBER"
          notes="release-assets/README.md"
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f ! -name 'README.md' -print | sort)
          test "${#assets[@]}" -ge 2
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$notes"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --notes-file "$notes" \
              --target "$SOURCE_SHA" \
              "${assets[@]}"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
