name: SIDERAL | Publicar modelos, multimodelos e NWP

on:
  workflow_run:
    # Listen to every completed workflow; the source-path allowlist is applied
    # safely after resolving workflow_id through the Actions API.
    workflows: ["*", "!SIDERAL | Publicar modelos, multimodelos e NWP"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: sideral-public-models-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar produtos finais em Releases e endpoint raw
    # workflow_run webhook does not provide github.event.workflow.path.
    # Resolve the source workflow through the Actions API in the steps below;
    # product eligibility and direct-publisher exclusions are handled by the
    # publisher script. Do not require overall success: valid products may
    # already exist when a different matrix/segment job fails.
    if: >-
      ${{ github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout do publicador
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolver caminho e nome do workflow de origem
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$SOURCE_REPOSITORY/actions/workflows/$WORKFLOW_ID")"
          path="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])' <<< "$metadata")"
          name="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<< "$metadata")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Workflow de origem: $name ($path)"

      - name: Identificar workflow de produto compatível
        id: filter
        env:
          SOURCE_WORKFLOW_PATH: ${{ steps.source.outputs.path }}
          SOURCE_WORKFLOW_NAME: ${{ steps.source.outputs.name }}
        run: python3 .github/scripts/publish_model_release.py check

      - name: Baixar artifacts da execução que acabou de concluir
        if: steps.filter.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/model-artifacts"
          artifact_count="$(gh api "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq '.total_count')"
          if [[ "$artifact_count" =~ ^[0-9]+$ ]] && (( artifact_count > 0 )); then
            gh run download "$SOURCE_RUN_ID" \
              --repo "$SOURCE_REPOSITORY" \
              --dir "$RUNNER_TEMP/model-artifacts"
            python3 .github/scripts/wrf_artifact_bundle.py unpack-release-artifacts \
              --root "$RUNNER_TEMP/model-artifacts"
          else
            echo "::warning::A execução de origem não publicou Artifacts; não há dados finais para converter em Release."
          fi

      - name: Publicar Release e espelho legível pelo navegador
        if: steps.filter.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_PATH: ${{ steps.source.outputs.path }}
          SOURCE_WORKFLOW_NAME: ${{ steps.source.outputs.name }}
          SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
          SOURCE_ARTIFACTS_DIR: ${{ runner.temp }}/model-artifacts
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        run: python3 .github/scripts/publish_model_release.py publish
