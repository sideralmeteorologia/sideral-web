      - name: Instalar dependências dos extratores
        run: |
          python3 -m pip install --disable-pip-version-check 'numpy>=1.24,<3' 'netCDF4>=1.6,<2' 'xarray>=2024.1,<2027' 'scipy>=1.11,<2'
      - name: Baixar WRFOUTs do checkpoint R2
        env:
          CHECKPOINT_TAG: cbr-${{ env.MODEL_VARIANT }}-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
          mkdir -p cbr_raw_wrfout cbr_all_wrfout
          : # artifact-only workflow
          for f in cbr_raw_wrfout/cbr-wrfout-*; do
            [[ -f "$f" ]] || continue
            n="$(basename "$f" | sed -E 's/^cbr-wrfout-[0-9]+-//; s/_([0-9]{2})[.]([0-9]{2})[.]([0-9]{2})$/_\1:\2:\3/')"
            mv -f "$f" "cbr_all_wrfout/$n"
          done
          test "$(find cbr_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c | wc -l)" -ge 15
          : # artifact-only workflow
      - name: Gerar produtos meteorológicos compactos
        run: |
          set -euo pipefail
          python3 wrf/cbr_extract_json.py --run-dir cbr_all_wrfout --output-dir cbr_json --run-env cbr-run.env --catalog wrf/cbr_variable_catalog.json --expected-start 0 --expected-end 42
          test -s cbr_json/metadata.json
      - name: Validar e publicar produtos no R2
        env:
          CHECKPOINT_TAG: cbr-${{ env.MODEL_VARIANT }}-4km-checkpoint-${{ github.run_id }}
        run: |
          set -euo pipefail
          test -s cbr_json/metadata.json
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
