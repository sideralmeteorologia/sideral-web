            echo "$line" >> "$GITHUB_ENV"
          done < "$profile"
      - name: Embutir extrator CBR final no YAML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrf
          cp "runners/cbr/shared/cbr_extract_json.py" "wrf/cbr_extract_json.py"
          python3 -m py_compile wrf/cbr_extract_json.py
      - name: Restaurar runtime científico
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cbr-runtime-${{ github.sha }}
      - name: Adicionar adaptador R2 ao PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Pré-validar CBR antes de downloads
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cbr_checkpoint_segment.sh
            wrf/run_cbr_icon_wrf.sh
            wrf/run_cbr_ecmwf_wrf.sh
            wrf/run_cbr_gfs_wrf.sh
            wrf/run_cbr_wrf_with_source.sh
            wrf/run_cbr_restart_segment.sh
          )
          for f in "${scripts[@]}"; do
            test -f "$f" || { echo "ERRO: CBR script ausente: $f" >&2; exit 1; }
          done
          for f in "${scripts[@]}"; do
