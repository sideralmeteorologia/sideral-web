          done
          shellcheck -S error -s bash "${scripts[@]}"
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/select_cbr_icon_run.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/extract_wrf_severe_core.py wrf/extract_wrf_severe.py wrf/cbr_extract_json.py wrf/cbr_postprocess.py wrf/validate_cbr_extraction.py
          test -s wrf/Vtable.ECMWF_OPEN || { echo "Vtable ECMWF CBR ausente" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("wrf/cbr_variable_catalog.json").read_text(encoding="utf-8"))
          if m.get("model") != "WRF CBR 4 KM":
              raise SystemExit(f"Catálogo CBR com model inválido: {m.get('model')!r}")
          if m.get("resolutionKm") != 4:
              raise SystemExit(f"Catálogo CBR deve declarar 4 km, veio {m.get('resolutionKm')!r}")
          domain = m.get("domain") or {}
          if (domain.get("e_we"), domain.get("e_sn")) != (401, 501):
              raise SystemExit(f"Grade de namelist CBR inválida: e_we={domain.get('e_we')}, e_sn={domain.get('e_sn')}; esperado 401x501")
          forecast = m.get("forecast") or {}
          if forecast.get("hours") != 42:
              raise SystemExit(f"Previsão CBR deve ter 42 h, veio {forecast.get('hours')!r}")
          print("CBR preflight: catálogo/grade de namelist OK (grade mass-point esperada 400x500)")
          PY
      - name: Executar CBR F003-F006
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: cbr-${{ env.MODEL_VARIANT }}-4km-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_NO_FALLBACK: '1'
        run: |
          bash wrf/run_cbr_checkpoint_segment.sh 3 6 1 0
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
