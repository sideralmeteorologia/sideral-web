name: SIDERAL | CBR WRF 4 km unificado

on:
  workflow_call:
    inputs:
      model_variant:
        description: "Tipo de execução WRF"
        required: false
        default: "wrf"
        type: string
      source_model:
        description: "Fonte global de contorno"
        required: false
        default: "icon"
        type: string

permissions:
  contents: write
  actions: read

env:
  CBR_CHECKPOINT_PREFIX: cbr-wrf-4km-checkpoint
  FAMILY: cbr
  RESOLUTION_KM: '4'
  MODEL_VARIANT: ${{ inputs.model_variant || 'wrf' }}
  SOURCE_MODEL: ${{ inputs.source_model || 'icon' }}
  WRF2_TOMORROW: ${{ inputs.model_variant == 'wrf2' && '1' || '0' }}


jobs:
  seg00:
    name: CBR ICON F000-F003
    runs-on: ubuntu-22.04
    
    timeout-minutes: 355
    steps:
      - name: Checkout CBR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load WRF parameters from versioned profile
        shell: bash
        run: |
          set -euo pipefail
          profile="runners/parameters/cbr.env"
          test -s "$profile" || { echo "Perfil WRF ausente: $profile" >&2; exit 1; }
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            [[ "$line" == *=* ]] || { echo "Linha inválida em $profile: $line" >&2; exit 1; }
            echo "$line" >> "$GITHUB_ENV"
          done < "$profile"
      - name: Embutir executores WRF CBR (sem arquivos-fonte no Git)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'wrf/run_cbr_checkpoint_segment.sh')"
          cp "runners/cbr/shared/run_cbr_checkpoint_segment.sh" "wrf/run_cbr_checkpoint_segment.sh"
          mkdir -p "$(dirname 'wrf/run_cbr_icon_wrf.sh')"
          cp "runners/cbr/icon/run_cbr_icon_wrf.sh" "wrf/run_cbr_icon_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_cbr_ecmwf_wrf.sh')"
          cp "runners/cbr/ecmwf/run_cbr_ecmwf_wrf.sh" "wrf/run_cbr_ecmwf_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_cbr_gfs_wrf.sh')"
          cp "runners/cbr/gfs/run_cbr_gfs_wrf.sh" "wrf/run_cbr_gfs_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_cbr_restart_segment.sh')"
          cp "runners/cbr/shared/run_cbr_restart_segment.sh" "wrf/run_cbr_restart_segment.sh"
          mkdir -p "$(dirname 'wrf/run_cbr_wrf_with_source.sh')"
          cp "runners/cbr/shared/run_cbr_wrf_with_source.sh" "wrf/run_cbr_wrf_with_source.sh"
          mkdir -p "$(dirname 'wrf/ensure_cbr_wrf_runtime.sh')"
          cp "runners/cbr/shared/ensure_cbr_wrf_runtime.sh" "wrf/ensure_cbr_wrf_runtime.sh"
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          cp "runners/cbr/shared/ensure_eccodes_tools.sh" "wrf/ensure_eccodes_tools.sh"
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          cp "runners/cbr/ecmwf/fetch_ecmwf_wrf_input.py" "wrf/fetch_ecmwf_wrf_input.py"
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          cp "runners/cbr/gfs/fetch_gfs_land_support.py" "wrf/fetch_gfs_land_support.py"
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          cp "runners/cbr/icon/fetch_icon_wrf_step.py" "wrf/fetch_icon_wrf_step.py"
          mkdir -p "$(dirname 'wrf/select_cbr_icon_run.py')"
          cp "runners/cbr/icon/select_cbr_icon_run.py" "wrf/select_cbr_icon_run.py"
          mkdir -p "$(dirname 'wrf/extract_wrf_severe.py')"
          cp "runners/cbr/shared/extract_wrf_severe.py" "wrf/extract_wrf_severe.py"
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          cp "runners/cbr/shared/extract_wrf_severe_core.py" "wrf/extract_wrf_severe_core.py"
          mkdir -p "$(dirname 'wrf/cbr_postprocess.py')"
          cp "runners/cbr/shared/cbr_postprocess.py" "wrf/cbr_postprocess.py"
          mkdir -p "$(dirname 'wrf/cbr_variable_catalog.json')"
          cp "runners/cbr/shared/cbr_variable_catalog.json" "wrf/cbr_variable_catalog.json"
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          cp "runners/cbr/ecmwf/Vtable.ECMWF_OPEN" "wrf/Vtable.ECMWF_OPEN"
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          cp "runners/cbr/gfs/Vtable.GFS_SOIL" "wrf/Vtable.GFS_SOIL"
          mkdir -p wrf/bin
      - name: Validar scripts CBR e catálogo
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cbr_checkpoint_segment.sh
            wrf/run_cbr_icon_wrf.sh
            wrf/run_cbr_ecmwf_wrf.sh
            wrf/run_cbr_gfs_wrf.sh
            wrf/run_cbr_wrf_with_source.sh
            wrf/run_cbr_restart_segment.sh
          )
          for f in "${scripts[@]}"; do
            test -f "$f" || { echo "ERRO: CBR script ausente: $f" >&2; exit 1; }
          done
          for f in "${scripts[@]}"; do
            bash -n "$f"
            stat -c 'CBR script: %A %a %n' "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/select_cbr_icon_run.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/extract_wrf_severe_core.py wrf/extract_wrf_severe.py wrf/cbr_extract_json.py wrf/cbr_postprocess.py wrf/validate_cbr_extraction.py
          test -s wrf/Vtable.ECMWF_OPEN || { echo "Vtable ECMWF CBR ausente" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("wrf/cbr_variable_catalog.json").read_text(encoding="utf-8"))
          if m.get("model") != "WRF CBR 4 KM":
              raise SystemExit(f"Catálogo CBR com model inválido: {m.get('model')!r}")
          if m.get("resolutionKm") != 4:
              raise SystemExit(f"Catálogo CBR deve declarar 4 km, veio {m.get('resolutionKm')!r}")
          domain = m.get("domain") or {}
          if (domain.get("e_we"), domain.get("e_sn")) != (401, 501):
              raise SystemExit(f"Grade de namelist CBR inválida: e_we={domain.get('e_we')}, e_sn={domain.get('e_sn')}; esperado 401x501")
          forecast = m.get("forecast") or {}
          if forecast.get("hours") != 42:
              raise SystemExit(f"Previsão CBR deve ter 42 h, veio {forecast.get('hours')!r}")
          print("CBR preflight: catálogo/grade de namelist OK (grade mass-point esperada 400x500)")
          PY
      - name: Executar CBR F000-F003
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: cbr-${{ env.MODEL_VARIANT }}-4km-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_NO_FALLBACK: '1'
        run: |
          bash wrf/run_cbr_checkpoint_segment.sh 0 3 0 1
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
