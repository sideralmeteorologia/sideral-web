          CHECKPOINT_TAG: sideral-wrf-${{ (inputs.resolution_km || '4') }}km-${{ (inputs.model_variant || 'wrf') }}-sudeste-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ${{ (inputs.source_model || 'icon') }}
          WRF_NO_FALLBACK: '1'
          RUN_DATE: ''
