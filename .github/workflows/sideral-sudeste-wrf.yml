          done
          shellcheck -S error -s bash "${scripts[@]}"
      - name: Executar F006-F012
        env:
          CHECKPOINT_TAG: sideral-wrf-${{ (inputs.resolution_km || '4') }}km-${{ (inputs.model_variant || 'wrf') }}-sudeste-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ${{ (inputs.source_model || 'icon') }}
          WRF_NO_FALLBACK: '1'
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 6 12 1 0
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
