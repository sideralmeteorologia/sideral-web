      - name: Install awscli and expose R2 adapter
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Configure Python for ECMWF Open Data
        if: ${{ (inputs.source_model || 'icon') == 'ecmwf' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify ECMWF Open Data client
        if: ${{ (inputs.source_model || 'icon') == 'ecmwf' }}
