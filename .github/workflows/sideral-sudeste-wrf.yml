name: SIDERAL | Sudeste WRF 4/5 km unificado

on:
  workflow_call:
    inputs:
      resolution_km:
        description: "Resolução do domínio"
        required: false
        default: '4'
        type: string
      model_variant:
        description: "Tipo de execução WRF"
        required: false
        default: "wrf"
        type: string
      source_model:
        description: "Fonte global de contorno"
        required: false
        default: "icon"
        type: string
  schedule:
    - cron: '0 16 * * *'
    - cron: '20 16 * * *'
    - cron: '40 16 * * *'
    - cron: '0 7 * * *'
    - cron: '20 7 * * *'
    - cron: '40 7 * * *'
    - cron: '30 16 * * *'
    - cron: '0 17 * * *'
    - cron: '20 17 * * *'
    - cron: '0 19 * * *'
    - cron: '20 19 * * *'
    - cron: '40 19 * * *'

permissions:
  contents: write
  actions: read

env:
  SIDERAL_CHECKPOINT_PREFIX: sideral-wrf-sudeste-checkpoint
  FAMILY: sideral-sudeste
  RESOLUTION_KM: ${{ (github.event.schedule == '30 16 * * *' || github.event.schedule == '0 17 * * *' || github.event.schedule == '20 17 * * *' || github.event.schedule == '0 19 * * *' || github.event.schedule == '20 19 * * *' || github.event.schedule == '40 19 * * *') && '5' || inputs.resolution_km || '4' }}
  MODEL_VARIANT: ${{ (github.event.schedule == '0 7 * * *' || github.event.schedule == '20 7 * * *' || github.event.schedule == '40 7 * * *' || github.event.schedule == '0 19 * * *' || github.event.schedule == '20 19 * * *' || github.event.schedule == '40 19 * * *') && 'wrf2' || inputs.model_variant || 'wrf' }}
  SOURCE_MODEL: ${{ (github.event.schedule == '20 16 * * *' || github.event.schedule == '20 7 * * *' || github.event.schedule == '0 17 * * *' || github.event.schedule == '20 19 * * *') && 'ecmwf' || (github.event.schedule == '40 16 * * *' || github.event.schedule == '40 7 * * *' || github.event.schedule == '20 17 * * *' || github.event.schedule == '40 19 * * *') && 'gfs' || inputs.source_model || 'icon' }}
  WRF2_TOMORROW: ${{ (github.event.schedule == '0 7 * * *' || github.event.schedule == '20 7 * * *' || github.event.schedule == '40 7 * * *' || github.event.schedule == '0 19 * * *' || github.event.schedule == '20 19 * * *' || github.event.schedule == '40 19 * * *' || inputs.model_variant == 'wrf2') && '1' || '0' }}
  WRF2_ICON_ONLY: '0'
  WRF_SCHEDULED_CYCLE: ${{ (github.event.schedule == '0 7 * * *' || github.event.schedule == '20 7 * * *' || github.event.schedule == '40 7 * * *') && '00' || (github.event.schedule == '0 16 * * *' || github.event.schedule == '20 16 * * *' || github.event.schedule == '40 16 * * *' || github.event.schedule == '30 16 * * *' || github.event.schedule == '0 17 * * *' || github.event.schedule == '20 17 * * *' || github.event.schedule == '0 19 * * *' || github.event.schedule == '20 19 * * *' || github.event.schedule == '40 19 * * *') && '12' || '' }}


jobs:

  seg00:
    name: SIDERAL ${{ (inputs.resolution_km || '4') }} KM ${{ (inputs.model_variant || 'wrf') }} ${{ (inputs.source_model || 'icon') }} F000-F006
    runs-on: ubuntu-22.04
    timeout-minutes: 478
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load WRF parameters from versioned profile
        shell: bash
        run: |
          set -euo pipefail
          profile="runners/parameters/sudeste-${RESOLUTION_KM}km.env"
          test -s "$profile" || { echo "Perfil WRF ausente: $profile" >&2; exit 1; }
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            [[ "$line" == *=* ]] || { echo "Linha inválida em $profile: $line" >&2; exit 1; }
            echo "$line" >> "$GITHUB_ENV"
          done < "$profile"
      - name: Embed Sudeste executors and R2 adapter
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          mkdir -p "$(dirname 'wrf/run_tarc_checkpoint_segment.sh')"
          cp "runners/sudeste/shared/run_tarc_checkpoint_segment.sh" "wrf/run_tarc_checkpoint_segment.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_icon_wrf.sh')"
          cp "runners/sudeste/icon/run_tarc_icon_wrf.sh" "wrf/run_tarc_icon_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_ecmwf_wrf.sh')"
          cp "runners/sudeste/ecmwf/run_tarc_ecmwf_wrf.sh" "wrf/run_tarc_ecmwf_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_gfs_wrf.sh')"
          cp "runners/sudeste/gfs/run_tarc_gfs_wrf.sh" "wrf/run_tarc_gfs_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_restart_segment.sh')"
          cp "runners/sudeste/shared/run_tarc_restart_segment.sh" "wrf/run_tarc_restart_segment.sh"
          mkdir -p "$(dirname 'wrf/run_tarc_wrf_with_source.sh')"
          cp "runners/sudeste/shared/run_tarc_wrf_with_source.sh" "wrf/run_tarc_wrf_with_source.sh"
          mkdir -p "$(dirname 'wrf/prepare_restart_segment.py')"
          cp "runners/sudeste/shared/prepare_restart_segment.py" "wrf/prepare_restart_segment.py"
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          cp "runners/sudeste/shared/ensure_eccodes_tools.sh" "wrf/ensure_eccodes_tools.sh"
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          cp "runners/sudeste/ecmwf/fetch_ecmwf_wrf_input.py" "wrf/fetch_ecmwf_wrf_input.py"
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          cp "runners/sudeste/gfs/fetch_gfs_land_support.py" "wrf/fetch_gfs_land_support.py"
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          cp "runners/sudeste/icon/fetch_icon_wrf_step.py" "wrf/fetch_icon_wrf_step.py"
          mkdir -p "$(dirname 'wrf/select_tarc_icon_run.py')"
          cp "runners/sudeste/icon/select_tarc_icon_run.py" "wrf/select_tarc_icon_run.py"
          mkdir -p "$(dirname 'wrf/tarc_postprocess.py')"
          cp "runners/sudeste/shared/tarc_postprocess.py" "wrf/tarc_postprocess.py"
          mkdir -p "$(dirname 'wrf/tarc_variable_catalog.json')"
          cp "runners/sudeste/shared/tarc_variable_catalog.json" "wrf/tarc_variable_catalog.json"
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          cp "runners/sudeste/shared/extract_wrf_severe_core.py" "wrf/extract_wrf_severe_core.py"
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          cp "runners/sudeste/ecmwf/Vtable.ECMWF_OPEN" "wrf/Vtable.ECMWF_OPEN"
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          cp "runners/sudeste/gfs/Vtable.GFS_SOIL" "wrf/Vtable.GFS_SOIL"
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          cp "runners/sudeste/shared/ensure_metbr_wrf_runtime.sh" "wrf/ensure_metbr_wrf_runtime.sh"
          cp "runners/sudeste/shared/sideral_wrf_5km_2_sudeste_variable_catalog.json" "wrf/sideral_wrf_5km_2_sudeste_variable_catalog.json"
          cp "runners/sudeste/shared/sideral_wrf_5km_sudeste_variable_catalog.json" "wrf/sideral_wrf_5km_sudeste_variable_catalog.json"
          cp "runners/sudeste/shared/sideral_wrf_4km_2_sudeste_variable_catalog.json" "wrf/sideral_wrf_4km_2_sudeste_variable_catalog.json"
          cp "runners/sudeste/shared/sideral_wrf_4km_sudeste_variable_catalog.json" "wrf/sideral_wrf_4km_sudeste_variable_catalog.json"
          cp "runners/sudeste/icon/Vtable.ICONp" "wrf/Vtable.ICONp"
          mkdir -p wrf/bin
          cp "runners/sudeste/shared/gh" "wrf/bin/gh"
          chmod +x wrf/bin/gh
          chmod +x wrf/*.sh
      - name: Configure the selected Sudeste grid and catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          km=int(os.environ['RESOLUTION_KM'])
          expected=(337,501) if km==4 else (269,401)
          p=Path('wrf/tarc_variable_catalog.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          d=m['domain']
          actual=(int(d['e_we']),int(d['e_sn']))
          if actual not in ((361,445),expected):
              raise SystemExit(f'grid base incompatible: {actual}')
          d['e_we'],d['e_sn']=expected
          d['dx_m']=km*1000; d['dy_m']=km*1000
          m['resolutionKm']=km
          m['model']=f'WRF SIDERAL {km} KM SUDESTE'
          m['modelKey']=f'sideral_wrf_{km}km_sudeste'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate embedded Sudeste scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_tarc_checkpoint_segment.sh wrf/run_tarc_icon_wrf.sh wrf/run_tarc_ecmwf_wrf.sh wrf/run_tarc_gfs_wrf.sh wrf/run_tarc_restart_segment.sh wrf/run_tarc_wrf_with_source.sh
          python3 -m py_compile wrf/prepare_restart_segment.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/fetch_icon_wrf_step.py wrf/select_tarc_icon_run.py wrf/tarc_postprocess.py wrf/extract_wrf_severe_core.py
      - name: Cache Sudeste code only
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-sudeste-runtime-${{ github.sha }}
      - name: Add R2 adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Configure Python for ECMWF Open Data
        if: ${{ (inputs.source_model || 'icon') == 'ecmwf' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify ECMWF Open Data client
        if: ${{ (inputs.source_model || 'icon') == 'ecmwf' }}
        shell: bash
        run: |
          set -euo pipefail
          # Instala em diretorio fixo exportado via PYTHONPATH para qualquer python3.
          DEPS="$RUNNER_TEMP/ecmwf-pydeps"
          python -m pip install --disable-pip-version-check --upgrade --target "$DEPS" 'ecmwf-opendata==0.3.34' 'requests>=2.31'
          echo "PYTHONPATH=$DEPS${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          export PYTHONPATH="$DEPS${PYTHONPATH:+:$PYTHONPATH}"
          python -c "from ecmwf.opendata import Client; print('ECMWF Open Data client OK em python')"
          for PYBIN in python3 /usr/bin/python3; do
            command -v "$PYBIN" >/dev/null 2>&1 || continue
            "$PYBIN" -c "from ecmwf.opendata import Client; print('ECMWF Open Data client OK em $PYBIN')" || echo "AVISO: $PYBIN nao importa ecmwf.opendata"
          done
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          # Normalize checkout permissions: helpers are explicitly run with bash.
          chmod +x "${scripts[@]}"
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável após chmod: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          grep -Fq ' -e WRF_BOUNDARY_ONLY="${WRF_BOUNDARY_ONLY:-0}"' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: WRF_BOUNDARY_ONLY nao esta sendo passado ao container; isso executa WRF duplicado." >&2; exit 1; }
          grep -Fq 'if [[ "${WRF_BOUNDARY_ONLY:-0}" == "1" ]]; then' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: guarda de boundary-only ausente." >&2; exit 1; }
          grep -Fq -- '--start-hour "$WRF_START_HOUR" --max-hour "$BOUNDARY_END_HOUR"' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: suporte de solo ainda baixa horas repetidas." >&2; exit 1; }
          grep -Fq 'p.add_argument("--start-hour", type=int, default=0' wrf/fetch_gfs_land_support.py || { echo "ERRO: seletor de horas GFS ausente." >&2; exit 1; }
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/select_tarc_icon_run.py wrf/fetch_gfs_land_support.py wrf/extract_wrf_severe_core.py wrf/extract_wrf_severe.py wrf/tarc_postprocess.py
          echo "ShellCheck e sintaxe Python dos fallbacks validados."
      - name: Executar F000-F006
        env:
          CHECKPOINT_TAG: sideral-wrf-${{ (inputs.resolution_km || '4') }}km-${{ (inputs.model_variant || 'wrf') }}-sudeste-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ${{ (inputs.source_model || 'icon') }}
          WRF_NO_FALLBACK: '1'
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 0 6 0 1
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
  seg01:
    name: SIDERAL ${{ (inputs.resolution_km || '4') }} KM ${{ (inputs.model_variant || 'wrf') }} ${{ (inputs.source_model || 'icon') }} F006-F012
