name: SIDERAL | WRF Sudeste 5 km | ECMWF | WRF

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: sideral-sudeste-5km-wrf-ecmwf-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  SIDERAL_CHECKPOINT_PREFIX: 'sideral-wrf-sudeste-5km-checkpoint'
  FAMILY: sideral-sudeste
  RESOLUTION_KM: '5'
  MODEL_VARIANT: wrf
  SOURCE_MODEL: ecmwf
  WRF2_TOMORROW: '0'
  WRF_MPI_PROCS: 4
  WRF_TARGET_RESOLUTION_KM: '5'
  WRF_DX_METERS: '5000'
  WRF_DY_METERS: '5000'
  WRF_E_WE: '269'
  WRF_E_SN: '401'
  WRF_TIME_STEP: '24'
  WRF_HISTORY_INTERVAL_MINUTES: 60
  WRF2_ICON_ONLY: '0'
  WRF_SCHEDULED_CYCLE: ${{ (github.event.schedule == '0 7 * * *' || github.event.schedule == '20 7 * * *' || github.event.schedule == '40 7 * * *') && '00' || (github.event.schedule == '0 16 * * *' || github.event.schedule == '20 16 * * *' || github.event.schedule == '40 16 * * *' || github.event.schedule == '30 16 * * *' || github.event.schedule == '0 17 * * *' || github.event.schedule == '20 17 * * *' || github.event.schedule == '0 19 * * *' || github.event.schedule == '20 19 * * *' || github.event.schedule == '40 19 * * *') && '12' || '' }}
  WRF_REF_LAT: -23.0
  WRF_REF_LON: -45.5
  WRF_STAND_LON: -45.5
  # ECMWF input box padded around the full Sudeste Lambert grid (4/5 km).
  ECMWF_SOURCE_WEST: '-58'
  ECMWF_SOURCE_EAST: '-32'
  ECMWF_SOURCE_SOUTH: '-38'
  ECMWF_SOURCE_NORTH: '-8'

jobs:

  seg00:
    name: SIDERAL 5 KM wrf ecmwf F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (1)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Embed Sudeste executors and GitHub artifact helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'wrf/run_tarc_checkpoint_segment.sh')"
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          mkdir -p "$(dirname 'wrf/run_tarc_icon_wrf.sh')"
          chmod +x wrf/run_tarc_icon_wrf.sh
          mkdir -p "$(dirname 'wrf/run_tarc_ecmwf_wrf.sh')"
          chmod +x wrf/run_tarc_ecmwf_wrf.sh
          mkdir -p "$(dirname 'wrf/run_tarc_gfs_wrf.sh')"
          chmod +x wrf/run_tarc_gfs_wrf.sh
          mkdir -p "$(dirname 'wrf/run_tarc_restart_segment.sh')"
          chmod +x wrf/run_tarc_restart_segment.sh
          mkdir -p "$(dirname 'wrf/run_tarc_wrf_with_source.sh')"
          chmod +x wrf/run_tarc_wrf_with_source.sh
          mkdir -p "$(dirname 'wrf/prepare_restart_segment.py')"
          chmod +x wrf/prepare_restart_segment.py
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          chmod +x wrf/ensure_eccodes_tools.sh
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          chmod +x wrf/fetch_ecmwf_wrf_input.py
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          chmod +x wrf/fetch_gfs_land_support.py
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          chmod +x wrf/fetch_icon_wrf_step.py
          mkdir -p "$(dirname 'wrf/select_tarc_icon_run.py')"
          chmod +x wrf/select_tarc_icon_run.py
          mkdir -p "$(dirname 'wrf/tarc_postprocess.py')"
          chmod +x wrf/tarc_postprocess.py
          mkdir -p "$(dirname 'wrf/tarc_variable_catalog.json')"
          chmod +x wrf/tarc_variable_catalog.json
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          chmod +x wrf/extract_wrf_severe_core.py
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          chmod +x wrf/Vtable.ECMWF_OPEN
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          chmod +x wrf/Vtable.GFS_SOIL
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          chmod +x wrf/ensure_metbr_wrf_runtime.sh
          chmod +x wrf/sideral_wrf_5km_2_sudeste_variable_catalog.json
          chmod +x wrf/sideral_wrf_5km_sudeste_variable_catalog.json
          chmod +x wrf/sideral_wrf_4km_2_sudeste_variable_catalog.json
          chmod +x wrf/sideral_wrf_4km_sudeste_variable_catalog.json
          chmod +x wrf/Vtable.ICONp
          mkdir -p wrf/bin
          chmod +x wrf/*.sh
      - name: Configure the selected Sudeste grid and catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          km=int(os.environ['RESOLUTION_KM'])
          expected=(337,501) if km==4 else (269,401)
          p=Path('wrf/tarc_variable_catalog.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          d=m['domain']
          actual=(int(d['e_we']),int(d['e_sn']))
          if actual not in ((361,445),expected):
              raise SystemExit(f'grid base incompatible: {actual}')
          d['e_we'],d['e_sn']=expected
          d['dx_m']=km*1000; d['dy_m']=km*1000
          m['resolutionKm']=km
          m['model']=f'WRF SIDERAL {km} KM SUDESTE'
          m['modelKey']=f'sideral_wrf_{km}km_sudeste'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate embedded Sudeste scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_tarc_checkpoint_segment.sh wrf/run_tarc_icon_wrf.sh wrf/run_tarc_ecmwf_wrf.sh wrf/run_tarc_gfs_wrf.sh wrf/run_tarc_restart_segment.sh wrf/run_tarc_wrf_with_source.sh
          python3 -m py_compile wrf/prepare_restart_segment.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/fetch_icon_wrf_step.py wrf/select_tarc_icon_run.py wrf/tarc_postprocess.py wrf/extract_wrf_severe_core.py
      - name: Cache Sudeste code only
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-sudeste-runtime-${{ github.sha }}
      - name: Expose WRF helper adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Configure Python for ECMWF Open Data
        if: ${{ 'ecmwf' == 'ecmwf' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify ECMWF Open Data client
        if: ${{ 'ecmwf' == 'ecmwf' }}
        shell: bash
        run: |
          set -euo pipefail
          # Instala em diretorio fixo exportado via PYTHONPATH para qualquer python3.
          DEPS="$RUNNER_TEMP/ecmwf-pydeps"
          python -m pip install --disable-pip-version-check --upgrade --target "$DEPS" 'ecmwf-opendata==0.3.34' 'requests>=2.31'
          echo "PYTHONPATH=$DEPS${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          export PYTHONPATH="$DEPS${PYTHONPATH:+:$PYTHONPATH}"
          python -c "from ecmwf.opendata import Client; print('ECMWF Open Data client OK em python')"
          for PYBIN in python3 /usr/bin/python3; do
            command -v "$PYBIN" >/dev/null 2>&1 || continue
            "$PYBIN" -c "from ecmwf.opendata import Client; print('ECMWF Open Data client OK em $PYBIN')" || echo "AVISO: $PYBIN nao importa ecmwf.opendata"
          done
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          # Normalize checkout permissions: helpers are explicitly run with bash.
          chmod +x "${scripts[@]}"
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável após chmod: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          grep -Fq ' -e WRF_BOUNDARY_ONLY="${WRF_BOUNDARY_ONLY:-0}"' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: WRF_BOUNDARY_ONLY nao esta sendo passado ao container; isso executa WRF duplicado." >&2; exit 1; }
          grep -Fq 'if [[ "${WRF_BOUNDARY_ONLY:-0}" == "1" ]]; then' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: guarda de boundary-only ausente." >&2; exit 1; }
          grep -Fq -- '--start-hour "$WRF_START_HOUR" --max-hour "$BOUNDARY_END_HOUR"' wrf/run_tarc_wrf_with_source.sh || { echo "ERRO: suporte de solo ainda baixa horas repetidas." >&2; exit 1; }
          grep -Fq 'p.add_argument("--start-hour", type=int, default=0' wrf/fetch_gfs_land_support.py || { echo "ERRO: seletor de horas GFS ausente." >&2; exit 1; }
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/select_tarc_icon_run.py wrf/fetch_gfs_land_support.py wrf/extract_wrf_severe_core.py wrf/extract_wrf_severe.py wrf/tarc_postprocess.py
          echo "ShellCheck e sintaxe Python dos fallbacks validados."
      - name: Executar F000-F003
        env:
          CHECKPOINT_TAG: sideral-wrf-5km-wrf-sudeste-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ecmwf
          WRF_NO_FALLBACK: '1'
          RUN_DATE: ''
          RUN_CYCLE: ''
          FORCE_RUN_DATE: ''
          FORCE_RUN_CYCLE: ''
        run: |
          chmod +x wrf/run_tarc_checkpoint_segment.sh
          bash wrf/run_tarc_checkpoint_segment.sh 0 3 0 1
      - name: Bundle WRF artifact safely (1)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-001.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-sudeste-5km-wrf-ecmwf-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-001.tar
          if-no-files-found: error
          retention-days: 1
