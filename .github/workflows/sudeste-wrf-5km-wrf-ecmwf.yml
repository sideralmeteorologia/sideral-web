          DEPS="$RUNNER_TEMP/ecmwf-pydeps"
          python -m pip install --disable-pip-version-check --upgrade --target "$DEPS" 'ecmwf-opendata==0.3.34' 'requests>=2.31'
          echo "PYTHONPATH=$DEPS${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          export PYTHONPATH="$DEPS${PYTHONPATH:+:$PYTHONPATH}"
          python -c "from ecmwf.opendata import Client; print('ECMWF Open Data client OK em python')"
          for PYBIN in python3 /usr/bin/python3; do
            command -v "$PYBIN" >/dev/null 2>&1 || continue
            "$PYBIN" -c "from ecmwf.opendata import Client; print('ECMWF Open Data client OK em $PYBIN')" || echo "AVISO: $PYBIN nao importa ecmwf.opendata"
          done
      - name: Pré-validar scripts Bash e ShellCheck
