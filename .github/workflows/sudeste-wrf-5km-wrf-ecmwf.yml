          DEPS="$RUNNER_TEMP/ecmwf-pydeps"
          python -m pip install --disable-pip-version-check --upgrade --target "$DEPS" 'ecmwf-opendata==0.3.34' 'requests>=2.31'
          echo "PYTHONPATH=$DEPS${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
