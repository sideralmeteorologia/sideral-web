    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (9)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Restore embedded Sudeste runtime
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-sudeste-runtime-${{ github.sha }}
      - name: Install awscli and expose R2 adapter
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Pré-validar scripts Bash e ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find wrf -maxdepth 1 -type f -name '*.sh' -print | sort)
          test "${#scripts[@]}" -gt 0
          if grep -nIl $'\r' "${scripts[@]}"; then
            echo "ERRO: existe CRLF em script wrf/*.sh; converta para LF." >&2
            exit 1
          fi
          # Normalize checkout permissions: helpers are explicitly run with bash.
          chmod +x "${scripts[@]}"
          for f in "${scripts[@]}"; do
            test -x "$f" || { echo "ERRO: script não executável após chmod: $f" >&2; exit 1; }
            bash -n "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
      - name: Baixar WRFOUT da rodada completa
        env:
          CHECKPOINT_TAG: sideral-wrf-5km-wrf-sudeste-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ecmwf
          WRF_NO_FALLBACK: '1'
        run: |
          set -euo pipefail
          rm -rf tarc_all_wrfout tarc_raw_wrfout tarc_products tarc_severe
          mkdir -p tarc_all_wrfout
          : # artifact-only workflow
          mkdir -p tarc_raw_wrfout
          : # artifact-only workflow
          for f in tarc_raw_wrfout/tarc-wrfout-*; do
            [[ -f "$f" ]] || continue
            n="$(basename "$f" | sed -E 's/^tarc-wrfout-[0-9]+-//; s/_([0-9]{2})[.]([0-9]{2})[.]([0-9]{2})$/_\1:\2:\3/')"
            mv -f "$f" "tarc_all_wrfout/$n"
          done
          : # artifact-only workflow
          test -n "$(find tarc_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print -quit)"
          test -s tarc-run.env
          source tarc-run.env
          export SOURCE_MODEL
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check 'numpy>=2.0,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027'
      - name: Gerar produtos principais
        env:
          WRF_PRODUCT_MODEL: "WRF SIDERAL 5 KM SUDESTE"
        run: |
          python wrf/tarc_postprocess.py tarc_all_wrfout/wrfout_d01_* --output-dir tarc_products
          test -s tarc_products/metadata.json
          test -n "$(find tarc_products -type f -name '*.npz' -size +0c -print -quit)"
          case "${RESOLUTION_KM}:${MODEL_VARIANT}" in
            4:wrf) CATALOG_PATH=wrf/sideral_wrf_4km_sudeste_variable_catalog.json ;;
            4:wrf2) CATALOG_PATH=wrf/sideral_wrf_4km_2_sudeste_variable_catalog.json ;;
            5:wrf) CATALOG_PATH=wrf/sideral_wrf_5km_sudeste_variable_catalog.json ;;
            5:wrf2) CATALOG_PATH=wrf/sideral_wrf_5km_2_sudeste_variable_catalog.json ;;
            *) echo "Catálogo Sudeste inválido" >&2; exit 2 ;;
          esac
          echo "CATALOG_PATH=$CATALOG_PATH" >> "$GITHUB_ENV"
          cp -f "$CATALOG_PATH" tarc_products/variable_catalog.json
      - name: Garantir extrator de diagnósticos severos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrf
          if [[ ! -s wrf/extract_wrf_severe.py ]]; then
            install -m 0644 runners/cim5/shared/extract_wrf_severe.py wrf/extract_wrf_severe.py
          fi
          if [[ ! -s wrf/extract_wrf_severe_core.py ]]; then
            install -m 0644 runners/cim5/shared/extract_wrf_severe_core.py wrf/extract_wrf_severe_core.py
          fi
          python3 -m py_compile wrf/extract_wrf_severe.py wrf/extract_wrf_severe_core.py
      - name: Gerar diagnósticos severos
        env:
          WRF_DX_METERS: '5000'
          WRF_PRODUCT_LABEL: "WRF SIDERAL 5 KM SUDESTE ECMWF"
        run: |
          python wrf/extract_wrf_severe.py --run-dir tarc_all_wrfout --run-env tarc-run.env --output-dir tarc_severe --grid-x "$WRF_E_WE" --grid-y "$WRF_E_SN" --model "${SOURCE_MODEL:-icon}" --interval-hours 3 --expected-start 0 --expected-end 48
          test -s tarc_severe/metadata.json
          test -s tarc_severe/diagnostics.json
      - name: Validar grade e produtos
        env:
          WRF_PRODUCT_MODEL: "WRF SIDERAL 5 KM SUDESTE"
        run: |
          python - <<'PY'
          import json, pathlib, os
          m=json.loads(pathlib.Path('tarc_products/metadata.json').read_text(encoding='utf-8'))
          assert m['model']==os.environ['WRF_PRODUCT_MODEL']
          assert m['resolutionKm']==int(os.environ['RESOLUTION_KM'])
          assert m['nativeReflectivity']=='REFL_10CM'
          assert m['domain']['e_we']==int(os.environ['WRF_E_WE']) and m['domain']['e_sn']==int(os.environ['WRF_E_SN'])
          assert len(m['frames'])==49, f"Esperados 49 horários F000-F048; encontrados {len(m['frames'])}"
          valid_times=[str(frame.get('time','')) for frame in m['frames']]
          assert len(set(valid_times))==49, 'TARC contém horários duplicados ou inválidos'
          s=json.loads(pathlib.Path('tarc_severe/metadata.json').read_text(encoding='utf-8'))
          required = ('sbcape', 'mlcape', 'mucapeWrf2', 'cin', 'stp', 'scp', 'srh01', 'srh03', 'bulkShear06', 'pwat', 'thetaE850')
          assert s.get('status') == 'complete', f"Diagnosticos severos incompletos: {s.get('status')}"
          assert s['frameCount'] == 17, f"Esperados 17 frames severos F000-F048 de 3 em 3 h; encontrados {s.get('frameCount')}"
          variables = s.get('variables', {})
          unavailable = [name for name in required if variables.get(name, {}).get('status') != 'available']
          assert not unavailable, f"Diagnosticos WRF ausentes: {unavailable}"
          cape_incomplete = [name for name in ('sbcape', 'mlcape', 'mucapeWrf2', 'cin') if variables.get(name, {}).get('availableFrames') != s['frameCount']]
          assert not cape_incomplete, f"CAPE/CIN ausentes em alguns frames: {cape_incomplete}"
          print('TARC principal:', len(m['frames']), 'frames')
          print('TARC severo:', s['frameCount'], 'frames')
          print('Status severo:', s['status'])
          PY
      - name: Publicar produtos no Release
        env:
          CHECKPOINT_TAG: sideral-wrf-5km-wrf-sudeste-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ecmwf
          WRF_NO_FALLBACK: '1'
        run: |
          set -euo pipefail
          tar -czf "sideral-wrf-${RESOLUTION_KM}km-${MODEL_VARIANT}-sudeste-products.tar.gz" -C tarc_products .
          tar -czf "sideral-wrf-${RESOLUTION_KM}km-${MODEL_VARIANT}-sudeste-severe.tar.gz" -C tarc_severe .
          test -s "sideral-wrf-${RESOLUTION_KM}km-${MODEL_VARIANT}-sudeste-products.tar.gz"
          test -s "sideral-wrf-${RESOLUTION_KM}km-${MODEL_VARIANT}-sudeste-severe.tar.gz"
          : # artifact-only workflow
          case "${RESOLUTION_KM}:${MODEL_VARIANT}" in
            4:wrf) CATALOG_PATH=wrf/sideral_wrf_4km_sudeste_variable_catalog.json ;;
            4:wrf2) CATALOG_PATH=wrf/sideral_wrf_4km_2_sudeste_variable_catalog.json ;;
            5:wrf) CATALOG_PATH=wrf/sideral_wrf_5km_sudeste_variable_catalog.json ;;
            5:wrf2) CATALOG_PATH=wrf/sideral_wrf_5km_2_sudeste_variable_catalog.json ;;
            *) echo "Combinação de catálogo Sudeste inválida: $RESOLUTION_KM/$MODEL_VARIANT" >&2; exit 2 ;;
          esac
          test -s "$CATALOG_PATH"
          : # artifact-only workflow
      - name: Bundle WRF artifact safely (9)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-009.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-sudeste-wrf-ecmwf-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-009.tar
          if-no-files-found: ignore
          retention-days: 7
  register-run:
    name: Registrar rodada validada para o maestro global
    runs-on: ubuntu-22.04
    needs: complete
    steps:
      - name: Registrar metadados da rodada concluída no R2
        env:
          CHECKPOINT_TAG: sideral-wrf-5km-wrf-sudeste-checkpoint-${{ github.run_id }}
          MODEL_VARIANT: wrf
          SOURCE_MODEL: ecmwf
          RESOLUTION_KM: 5
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
          latest_prefix="sideral/sudeste/${RESOLUTION_KM}km/$MODEL_VARIANT/$SOURCE_MODEL/latest"
          [[ "$count" != 0 && "$count" != None ]] || { echo "Nenhum produto validado no prefixo: $artifact_prefix" >&2; exit 41; }
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Bundle WRF artifact safely (10)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-010.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-sudeste-wrf-ecmwf-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-010.tar
          if-no-files-found: ignore
          retention-days: 7