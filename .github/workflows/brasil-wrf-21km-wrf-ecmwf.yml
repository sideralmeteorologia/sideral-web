name: SIDERAL | WRF Brasil 21 km | ECMWF | WRF

on:
  workflow_dispatch:
    inputs:
      source_model:
        description: Modelo global de inicialização
        required: true
        default: icon
        type: choice
        options: [icon, ecmwf]
      run_date:
        description: "Rodada da fonte selecionada em YYYYMMDD (vazio = mais recente com F048)"
        required: false
        type: string
      run_cycle:
        description: "Ciclo da fonte selecionada (ICON 00/06/12/18; ECMWF 00/12)"
        required: false
        type: string
  schedule:
    - cron: '45 5 * * *'

permissions:
  contents: write

concurrency:
  group: sideral-wrf-brasil-21km-icon
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PYTHON_VERSION: '3.11'
  WRF_TARGET_RESOLUTION_KM: '21'
  SOURCE_MODEL: ecmwf
  WRF_DX_METERS: '21000'
  WRF_DY_METERS: '21000'
  WRF_EXPECTED_RESOLUTION_KM: '21'
  WRF_EXPECTED_DX_METERS: '21000'
  WRF_EXPECTED_DY_METERS: '21000'
  WRF_HISTORY_INTERVAL_MINUTES: '60'
  WRF_START_HOUR: '0'
  WRF_END_HOUR: '48'
  WRF_RUN_HOURS: '48'
  WRF_TIME_STEP: '45'
  WRF_E_WE: '216'
  WRF_E_SN: '216'
  WRF_GRID_X: '215'
  WRF_GRID_Y: '215'

jobs:
  brasil:
    name: ICON -> WRF Brasil 21 km F000-F048 horario
    runs-on: ubuntu-22.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - name: Incorporar executores meteorológicos Brasil 21 km neste YAML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'wrf/run_icon_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_icon_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_ecmwf_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_ecmwf_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_wrf_with_source.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_wrf_with_source.sh'
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_icon_wrf_step.py'
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_ecmwf_wrf_input.py'
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_gfs_land_support.py'
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          printf '%s' '' | base64 -d > 'wrf/ensure_eccodes_tools.sh'
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.ECMWF_OPEN'
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.GFS_SOIL'
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.ICONp'
          mkdir -p "$(dirname 'wrf/extract_wrf_brasil_21km.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_brasil_21km.py'
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_severe_core.py'
          mkdir -p "$(dirname 'wrf/validate_wrf_publication.py')"
          printf '%s' '' | base64 -d > 'wrf/validate_wrf_publication.py'
      - name: Garantir executabilidade dos scripts WRF
        shell: bash
        run: chmod +x wrf/*.sh
      - name: Validar executores incorporados
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_icon_wrf.sh wrf/run_ecmwf_wrf.sh wrf/run_wrf_with_source.sh
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/extract_wrf_brasil_21km.py wrf/extract_wrf_severe_core.py wrf/validate_wrf_publication.py
          test -s wrf/Vtable.ICONp && test -s wrf/Vtable.ECMWF_OPEN && test -s wrf/Vtable.GFS_SOIL
      - name: Preparar runner
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          source wrf/ensure_eccodes_tools.sh
          docker pull dtcenter/wps_wrf@sha256:418e36889e469a1038bf343986116a056f7a4744be4306091ef3d7e44881be63
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências WRF, ECMWF e extratores
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027' 'requests>=2.31' 'scipy>=1.11,<2' 'ecmwf-opendata==0.3.34' 'eccodes>=2.35,<3'

      - name: Validar extratores e núcleo de diagnósticos
        run: python3 -m py_compile wrf/extract_wrf_severe_core.py wrf/extract_wrf_brasil_21km.py

      - name: Selecionar ciclo da fonte escolhida
        id: run
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date || '' }}
          INPUT_RUN_CYCLE: ${{ inputs.run_cycle || '' }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_RUN_DATE" || -n "$INPUT_RUN_CYCLE" ]]; then
            [[ -n "$INPUT_RUN_DATE" && -n "$INPUT_RUN_CYCLE" ]] || { echo "run_date e run_cycle devem ser informados juntos" >&2; exit 2; }
            date="${INPUT_RUN_DATE//-/}"; cycle="$(printf '%02d' "$((10#$INPUT_RUN_CYCLE))")"
            [[ "$date" =~ ^[0-9]{8}$ ]]
            if [[ "$SOURCE_MODEL" == ecmwf ]]; then [[ "$cycle" == 00 || "$cycle" == 12 ]]; else [[ "$cycle" == 00 || "$cycle" == 06 || "$cycle" == 12 || "$cycle" == 18 ]]; fi
          elif [[ "$SOURCE_MODEL" == ecmwf ]]; then
            python3 - <<'PY' > selected-cycle.txt
          import datetime as dt
          from ecmwf.opendata import Client
          v=Client(source='ecmwf',model='ifs').latest(type='fc',step=48,param=['2t'])
          if not isinstance(v,dt.datetime): v=dt.datetime.fromisoformat(str(v))
          if v.tzinfo is None: v=v.replace(tzinfo=dt.timezone.utc)
          v=v.astimezone(dt.timezone.utc)
          if v.hour not in (0,12): raise SystemExit(f'ciclo ECMWF invalido: {v:%H}')
          print(v.strftime('%Y%m%d %H'))
          PY
            read -r date cycle < selected-cycle.txt
          else
            date=""; cycle=""
          fi
          echo "run_date=$date" >> "$GITHUB_OUTPUT"
          echo "run_cycle=$cycle" >> "$GITHUB_OUTPUT"
          echo "Fonte: $SOURCE_MODEL; data=$date; ciclo=$cycle"
      - name: Executar WRF Brasil 21 km com fonte exclusiva
        env:
          FORCE_RUN_DATE: ${{ steps.run.outputs.run_date }}
          FORCE_RUN_CYCLE: ${{ steps.run.outputs.run_cycle }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_REF_LAT: '-13.50'
          WRF_REF_LON: '-54.00'
          WRF_STAND_LON: '-54.00'
          WRF_E_WE: '216'
          WRF_E_SN: '216'
          WRF_GRID_X: '215'
          WRF_GRID_Y: '215'
          WRF_HISTORY_INTERVAL_MINUTES: '60'
          WRF_TARGET_RESOLUTION_KM: '21'
          WRF_DX_METERS: '21000'
          WRF_DY_METERS: '21000'
          WRF_TIME_STEP: '45'
          WRF_RUN_HOURS: '48'
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '48'
          ICON_SOURCE_XSIZE: '261'
          ICON_SOURCE_YSIZE: '241'
          ICON_SOURCE_XFIRST: '-85.0'
          ICON_SOURCE_YFIRST: '-50.0'
          ICON_SOURCE_XINC: '0.25'
          ICON_SOURCE_YINC: '0.25'
        shell: bash
        run: |
          set -euo pipefail
          test "$WRF_DX_METERS" = '21000'
          test "$WRF_DY_METERS" = '21000'
          test "$WRF_TIME_STEP" = '45'
          test "$WRF_E_WE" = '216'
          test "$WRF_E_SN" = '216'
          test "$WRF_GRID_X" = '215'
          test "$WRF_GRID_Y" = '215'
          test "$WRF_START_HOUR" = '0'
          test "$WRF_END_HOUR" = '48'
          chmod +x wrf/run_icon_wrf.sh wrf/run_ecmwf_wrf.sh wrf/run_wrf_with_source.sh
          if [[ "$SOURCE_MODEL" == icon ]]; then bash wrf/run_icon_wrf.sh; else bash wrf/run_ecmwf_wrf.sh; fi
          grep -q 'SUCCESS COMPLETE WRF' wrf_work/run/rsl.error.0000
          mapfile -t OUTS < <(find wrf_work/run -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print | sort)
          test "${#OUTS[@]}" -eq 49 || { echo "ERRO: esperado 49 wrfout horários F000-F048; recebido ${#OUTS[@]}" >&2; printf '%s\n' "${OUTS[@]}" >&2; exit 50; }
          printf '%s\n' "${OUTS[@]}" > wrf_work/hourly-wrfout-files.txt
          echo 'ICON Brasil 21 km: 49 horários nativos; sem fallback de atmosfera.'
          ls -lh wrf_work/run/wrfout_d01_* | tail -10
          df -h
      - name: Extrair JSON nativo Brasil 21 km
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wrf_publish
          mkdir -p wrf_publish wrf_diagnostics
          test "$(find wrf_work/run -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c | wc -l)" -eq 49
          python wrf/extract_wrf_brasil_21km.py \
            --run-dir wrf_work/run \
            --output-dir wrf_publish \
            --grid-x 215 \
            --grid-y 215
          test -s wrf_publish/wrf_brasil_21km.json
          test -s wrf_publish/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('wrf_publish/wrf_brasil_21km.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['resolutionKm'] == 21
          assert data['grid']['nx'] == 215 and data['grid']['ny'] == 215
          assert data['grid']['dxMeters'] == 21000 and data['grid']['dyMeters'] == 21000
          assert data['frameCount'] == 49 and len(data['frames']) == 49
          assert data['reflectivitySource'] == 'REFL_10CM_NATIVE'
          assert data['nativeGrid'] is True
          assert [f['forecastHour'] for f in data['frames']] == list(range(49))
          assert all(len(f['reflectivityDbz']) == 215 and len(f['reflectivityDbz'][0]) == 215 for f in data['frames'])
          print('JSON Brasil 21 km validado: 49 frames nativos 215x215.')
          PY

      - name: Identificar fonte no metadata Brasil 21 km
        env:
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('wrf_publish/metadata.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['sourceModel']=os.environ['SOURCE_MODEL']
          data['modelKey']='wrf_brasil_21km_'+os.environ['SOURCE_MODEL']
          data['displayName']='SIDERAL WRF Brasil 21 km - '+os.environ['SOURCE_MODEL'].upper()
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Metadata source:',data['sourceModel'])
          PY
      - name: Validar 49 frames nativos Brasil 21 km
        shell: bash
        run: |
          set -euo pipefail
          test -s wrf_publish/wrf_brasil_21km.json
          test -s wrf_publish/metadata.json
          python wrf/validate_wrf_publication.py \
            --json wrf_publish/wrf_brasil_21km.json \
            --metadata wrf_publish/metadata.json \
            --resolution-km 21 \
            --nx 215 --ny 215 \
            --frames 49 \
            --require-reflectivity-source REFL_10CM_NATIVE \
            --require-native-grid \
            --temporal-resolution-minutes 60

      - name: Publicar rodada validada no R2
        env:
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          : # artifact-only workflow
          : # artifact-only workflow
          prefix="sideral/brasil/21km/wrf/$SOURCE_MODEL/runs/$GITHUB_RUN_ID"
          latest="sideral/brasil/21km/wrf/$SOURCE_MODEL/latest"
          : # artifact-only workflow
          tar -czf wrfout-brasil-21km.tar.gz -C wrf_work/run .
          : # artifact-only workflow
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > run-manifest.json <<EOF
          {"schema":"sideral-wrf-run-v1","family":"brasil","resolutionKm":21,"variant":"wrf","source":"$SOURCE_MODEL","runId":"$GITHUB_RUN_ID","completedAt":"$completed_at","artifactPrefix":"$prefix/","latestPrefix":"$latest","publishExtensions":[".json",".npz",".tar.gz"],"frames":49,"grid":"215x215"}
          EOF
          : # artifact-only workflow
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-brasil21-wrf-ecmwf-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          if-no-files-found: ignore
          retention-days: 7