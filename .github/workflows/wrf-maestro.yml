name: SIDERAL | WRF Publication Maestro Global

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: Dias para manter os objetos de execução em /runs/
        required: true
        default: '7'
        type: string
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: read

concurrency:
  group: sideral-wrf-publication-maestro
  cancel-in-progress: false

jobs:
  catalog-and-retention:
    name: Consolidar catálogo e limpar execuções antigas no R2
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Configurar Python e boto3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar cliente S3 compatível com Cloudflare R2
        run: python -m pip install --disable-pip-version-check 'boto3>=1.34,<2'
      - name: Construir catálogo latest e aplicar retenção de /runs/
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RETENTION_DAYS: ${{ inputs.retention_days || '7' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, boto3
          from datetime import datetime, timezone, timedelta
          from botocore.config import Config

          account=os.environ["R2_ACCOUNT_ID"]
          bucket=os.environ["R2_BUCKET"]
          retention=int(os.environ.get("RETENTION_DAYS","7"))
          if retention < 1 or retention > 90:
              raise SystemExit("RETENTION_DAYS deve estar entre 1 e 90")
          s3=boto3.client(
              "s3",
              endpoint_url=f"https://{account}.r2.cloudflarestorage.com",
              region_name="auto",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              config=Config(signature_version="s3v4", retries={"max_attempts":5,"mode":"standard"})
          )

          # Promove apenas execuções que registraram conclusão após as validações da família.
          # O run_id impede que uma rodada antiga, terminada depois, sobrescreva uma rodada nova.
          run_paginator=s3.get_paginator("list_objects_v2")
          ready_manifests=[]
          for page in run_paginator.paginate(Bucket=bucket,Prefix="sideral/"):
              for item in page.get("Contents",[]):
                  key=item["Key"]
                  if "/runs/" in key and key.endswith("/_run-manifest.json"):
                      ready_manifests.append(key)

          promoted=0
          skipped=0
          promotion_errors=[]
          for marker_key in sorted(ready_manifests):
              try:
                  manifest=json.loads(s3.get_object(Bucket=bucket,Key=marker_key)["Body"].read())
                  if manifest.get("schema")!="sideral-wrf-run-v1":
                      skipped+=1
                      continue
                  run_id=int(manifest["runId"])
                  artifact_prefix=str(manifest["artifactPrefix"]).strip("/")+"/"
                  latest_prefix=str(manifest["latestPrefix"]).strip("/")
                  if (not artifact_prefix.startswith("sideral/") or not latest_prefix.startswith("sideral/")
                          or ".." in artifact_prefix or ".." in latest_prefix):
                      raise ValueError("Prefixo R2 inválido no manifesto")
                  extensions=manifest.get("publishExtensions",[".json",".npz"])
                  if not isinstance(extensions,list) or not extensions:
                      raise ValueError("publishExtensions ausente ou inválido")
                  latest_key=f"{latest_prefix}/run-manifest.json"
                  latest_run_id=-1
                  try:
                      current=json.loads(s3.get_object(Bucket=bucket,Key=latest_key)["Body"].read())
                      latest_run_id=int(current.get("runId",-1))
                  except Exception as exc:
                      code=getattr(exc,"response",{}).get("Error",{}).get("Code","")
                      if code not in ("NoSuchKey","404","NotFound"):
                          raise
                  if run_id<=latest_run_id:
                      skipped+=1
                      continue
                  sample=s3.list_objects_v2(Bucket=bucket,Prefix=artifact_prefix,MaxKeys=1).get("Contents",[])
                  if not sample:
                      raise RuntimeError(f"Prefixo de produtos vazio: {artifact_prefix}")
                  copied=0
                  for page in run_paginator.paginate(Bucket=bucket,Prefix=artifact_prefix):
                      for item in page.get("Contents",[]):
                          source_key=item["Key"]
                          if source_key.endswith("/_run-manifest.json"):
                              continue
                          filename=source_key.rsplit("/",1)[-1]
                          if filename.startswith("_") or not any(filename.endswith(ext) for ext in extensions):
                              continue
                          relative=source_key[len(artifact_prefix):]
                          if not relative:
                              continue
                          destination=f"{latest_prefix}/{relative}"
                          s3.copy({"Bucket":bucket,"Key":source_key},bucket,destination)
                          copied+=1
                  if copied==0:
                      raise RuntimeError(f"Nenhum arquivo publicável encontrado: {artifact_prefix}")
                  published_manifest=dict(manifest)
                  published_manifest["publishedAt"]=datetime.now(timezone.utc).isoformat()
                  published_manifest["publishedBy"]="wrf-maestro-global"
                  published_manifest["publishedObjects"]=copied
                  s3.put_object(Bucket=bucket,Key=latest_key,Body=json.dumps(published_manifest,ensure_ascii=False,separators=(",",":")).encode("utf-8"),ContentType="application/json; charset=utf-8",CacheControl="public, max-age=300")
                  promoted+=1
                  print(f"PROMOVIDO {manifest.get('family')} {manifest.get('resolutionKm')}km {manifest.get('variant')} {manifest.get('source')} run={run_id} objetos={copied}")
              except Exception as exc:
                  promotion_errors.append({"marker":marker_key,"error":str(exc)[:300]})
          if promotion_errors:
              print(json.dumps({"promotionErrors":promotion_errors},ensure_ascii=False))

          products=[]
          definitions=[]
          for family,resolution,variants,sources in [
              ("metbr","4km",["wrf","wrf2"],["icon","ecmwf","gfs"]),
              ("cbr","4km",["wrf","wrf2"],["icon","ecmwf","gfs"]),
              ("tarc","3km",["wrf","wrf2"],["icon","ecmwf","gfs"]),
              ("sudeste-4km","4km",["wrf","wrf2"],["icon","ecmwf","gfs"]),
              ("sudeste-5km","5km",["wrf","wrf2"],["icon","ecmwf","gfs"]),
              ("cim","5km",["wrf","wrf2"],["icon","ecmwf","gfs"]),
              ("cim","8km",["wrf"],["icon","ecmwf","gfs"]),
              ("brasil","21km",["wrf"],["icon","ecmwf"]),
          ]:
              for variant in variants:
                  for source in sources:
                      if family=="sudeste-4km":
                          key=f"sideral/sudeste/4km/{variant}/{source}/latest/run-manifest.json"
                      elif family=="sudeste-5km":
                          key=f"sideral/sudeste/5km/{variant}/{source}/latest/run-manifest.json"
                      elif family=="brasil":
                          key=f"sideral/brasil/21km/{variant}/{source}/latest/run-manifest.json"
                      elif family=="cim" and resolution=="8km":
                          key=f"sideral/cim/8km/{variant}/{source}/latest/run-manifest.json"
                      else:
                          key=f"sideral/{family}/{resolution}/{variant}/{source}/latest/run-manifest.json"
                      definitions.append((family,resolution,variant,source,key))

          missing=[]
          for family,resolution,variant,source,key in definitions:
              try:
                  obj=s3.get_object(Bucket=bucket,Key=key)
                  manifest=json.loads(obj["Body"].read())
                  products.append({
                      "family":family,
                      "resolution":resolution,
                      "variant":variant,
                      "source":source,
                      "manifestKey":key,
                      "runId":manifest.get("runId"),
                      "publishedAt":manifest.get("publishedAt") or manifest.get("generatedAt") or manifest.get("completedAt"),
                      "manifest":manifest
                  })
              except Exception as exc:
                  code=getattr(exc,"response",{}).get("Error",{}).get("Code","")
                  if code in ("NoSuchKey","404","NotFound"):
                      missing.append(key)
                  else:
                      raise

          catalog={
              "schema":"sideral-wrf-catalog-v1",
              "generatedAt":datetime.now(timezone.utc).isoformat(),
              "retentionDays":retention,
              "products":products,
              "missingLatestManifests":missing
          }
          catalog_bytes=json.dumps(catalog,ensure_ascii=False,separators=(",",":")).encode("utf-8")
          s3.put_object(
              Bucket=bucket,
              Key="sideral/index/wrf-catalog.json",
              Body=catalog_bytes,
              ContentType="application/json; charset=utf-8",
              CacheControl="public, max-age=300"
          )

          cutoff=datetime.now(timezone.utc)-timedelta(days=retention)
          paginator=s3.get_paginator("list_objects_v2")
          pending=[]
          scanned=0
          deleted=0
          for page in paginator.paginate(Bucket=bucket,Prefix="sideral/"):
              for item in page.get("Contents",[]):
                  key=item["Key"]
                  if "/runs/" not in key:
                      continue
                  if "/latest/" in key or key.startswith("sideral/index/"):
                      continue
                  scanned+=1
                  if item["LastModified"] < cutoff:
                      pending.append({"Key":key})
                      if len(pending)==1000:
                          response=s3.delete_objects(Bucket=bucket,Delete={"Objects":pending,"Quiet":True})
                          deleted+=len(pending)-len(response.get("Errors",[]))
                          if response.get("Errors"):
                              raise RuntimeError(f"Falha ao apagar objetos R2: {response['Errors'][:3]}")
                          pending=[]
          if pending:
              response=s3.delete_objects(Bucket=bucket,Delete={"Objects":pending,"Quiet":True})
              deleted+=len(pending)-len(response.get("Errors",[]))
              if response.get("Errors"):
                  raise RuntimeError(f"Falha ao apagar objetos R2: {response['Errors'][:3]}")

          print(json.dumps({
              "catalogKey":"sideral/index/wrf-catalog.json",
              "latestProducts":len(products),
              "missingLatestManifests":len(missing),
              "runObjectsScanned":scanned,
              "oldObjectsDeleted":deleted,
              "readyRunManifests":len(ready_manifests),
              "newRunsPromoted":promoted,
              "runManifestsSkipped":skipped,
              "promotionErrors":len(promotion_errors),
              "readyRunManifests":len(ready_manifests),
              "newRunsPromoted":promoted,
              "runManifestsSkipped":skipped,
              "promotionErrors":len(promotion_errors),
              "retentionDays":retention
          },ensure_ascii=False))
          PY
      - name: Finalizar Maestro
        run: echo "Rodadas validadas promovidas para /latest/, catálogo R2 atualizado e objetos expirados sob /runs/ removidos."