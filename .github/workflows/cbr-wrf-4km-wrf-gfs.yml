name: SIDERAL | CBR WRF 4 km | GFS | WRF

on:
  workflow_dispatch:
  schedule:
    - cron: '45 10 * * *'

  workflow_call:
    inputs:
      source_model:
        description: "Modelo global usado nas condições iniciais e de contorno"
        required: false
        default: icon
        type: string
permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  CBR_CHECKPOINT_PREFIX: cbr-wrf-4km-checkpoint
  WRF_MPI_PROCS: 8
  WRF_TARGET_RESOLUTION_KM: 4
  WRF_DX_METERS: 4000
  WRF_DY_METERS: 4000
  WRF_E_WE: 401
  WRF_E_SN: 501
  WRF_TIME_STEP: 20
  WRF_HISTORY_INTERVAL_MINUTES: 60
  WRF_REF_LAT: -10.5
  WRF_REF_LON: -40.0
  WRF_STAND_LON: -40.0
  FAMILY: cbr
  RESOLUTION_KM: '4'
  MODEL_VARIANT: wrf
  SOURCE_MODEL: gfs
  WRF2_TOMORROW: '0'

jobs:
  seg00:
    name: CBR GFS F000-F003
    runs-on: ubuntu-22.04
    
    timeout-minutes: 355
    steps:
      - name: Checkout CBR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (1)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Embutir executores WRF CBR (sem arquivos-fonte no Git)
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0644 runners/cbr/icon/Vtable.ICONp wrf/Vtable.ICONp
          mkdir -p wrf/bin
          mkdir -p wrf
          chmod +x wrf/*.sh
      - name: Validar scripts CBR e catálogo
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cbr_checkpoint_segment.sh
            wrf/run_cbr_icon_wrf.sh
            wrf/run_cbr_ecmwf_wrf.sh
            wrf/run_cbr_gfs_wrf.sh
            wrf/run_cbr_wrf_with_source.sh
            wrf/run_cbr_restart_segment.sh
          )
          for f in "${scripts[@]}"; do
            test -f "$f" || { echo "ERRO: CBR script ausente: $f" >&2; exit 1; }
          done
          for f in "${scripts[@]}"; do
            bash -n "$f"
            stat -c 'CBR script: %A %a %n' "$f"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/select_cbr_icon_run.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/extract_wrf_severe_core.py wrf/extract_wrf_severe.py wrf/cbr_extract_json.py wrf/cbr_postprocess.py
          test -s wrf/Vtable.ECMWF_OPEN && test -s wrf/Vtable.ICONp || { echo "Vtable ECMWF/ICON CBR ausente" >&2; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("wrf/cbr_variable_catalog.json").read_text(encoding="utf-8"))
          if m.get("model") != "WRF CBR 4 KM":
              raise SystemExit(f"Catálogo CBR com model inválido: {m.get('model')!r}")
          if m.get("resolutionKm") != 4:
              raise SystemExit(f"Catálogo CBR deve declarar 4 km, veio {m.get('resolutionKm')!r}")
          domain = m.get("domain") or {}
          if (domain.get("e_we"), domain.get("e_sn")) != (401, 501):
              raise SystemExit(f"Grade de namelist CBR inválida: e_we={domain.get('e_we')}, e_sn={domain.get('e_sn')}; esperado 401x501")
          forecast = m.get("forecast") or {}
          if forecast.get("hours") != 42:
              raise SystemExit(f"Previsão CBR deve ter 42 h, veio {forecast.get('hours')!r}")
          print("CBR preflight: catálogo/grade de namelist OK (grade mass-point esperada 400x500)")
          PY
      - name: Executar CBR F000-F003
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: cbr-${{ env.MODEL_VARIANT }}-4km-checkpoint-${{ github.run_id }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_NO_FALLBACK: '1'
        run: |
          bash wrf/run_cbr_checkpoint_segment.sh 0 3 0 1
      - name: Bundle WRF artifact safely (1)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-001.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-cbr4-wrf-gfs-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-001.tar
          if-no-files-found: ignore
          retention-days: 7
