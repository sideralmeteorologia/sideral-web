        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cbr-runtime-${{ github.sha }}
      - name: Adicionar adaptador R2 ao PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Pré-validar CBR antes de downloads
