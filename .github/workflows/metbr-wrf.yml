    needs: seg12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (14)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Restaurar runtime científico METBR
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-metbr-runtime-${{ github.sha }}
      - name: Configurar Python e dependências dos fetchers
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar clientes de modelos globais
        run: python -m pip install --disable-pip-version-check 'ecmwf-opendata==0.3.34' 'requests>=2.31'
      - name: Restaurar checkpoint do segmento anterior
        uses: actions/download-artifact@v4
        with:
          name: wrf-metbr4-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-seg12-${{ github.run_id }}
          path: ${{ runner.temp }}/wrf-downloads/d013
      - name: Register WRF artifact restore target (13)
        shell: bash
        env:
          WRF_ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/wrf-downloads/d013
          WRF_ARTIFACT_RESTORE_TO: 'metbr_restart_input'
        run: |
          mkdir -p "$WRF_ARTIFACT_DOWNLOAD_DIR"
          printf '%s\n' "$WRF_ARTIFACT_RESTORE_TO" > "$WRF_ARTIFACT_DOWNLOAD_DIR/.restore-to"
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Executar WRF METBR F039-F042
        env:
          CHECKPOINT_TAG: metbr-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-4km-checkpoint-${{ github.run_id }}
        run: bash wrf/run_metbr_checkpoint_segment.sh 39 42 13 0
      - name: Bundle WRF artifact safely (14)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            metbr-checkpoint-*.tar.gz
            metbr-wrfout-*
            metbr-run.env
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
          WRF_ARTIFACT_REQUIRE_FILES: '1'
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-014.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-metbr4-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-014.tar
          if-no-files-found: error
          retention-days: 7
  complete:
    name: Extrair e validar METBR WRF 4 km
    runs-on: ubuntu-22.04
    needs: [seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07, seg08, seg09, seg10, seg11, seg12, seg13]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (15)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Restaurar runtime científico METBR
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-metbr-runtime-${{ github.sha }}
      - name: Configurar Python científico
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas científicas
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027' 'scipy>=1.11,<2'
      - name: Baixar artifacts dos 14 segmentos WRF
        uses: actions/download-artifact@v4
        with:
          pattern: wrf-metbr4-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-seg??-${{ github.run_id }}
          path: ${{ runner.temp }}/wrf-downloads/d014
          merge-multiple: false
      - name: Register WRF artifact restore target (14)
        shell: bash
        env:
          WRF_ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/wrf-downloads/d014
          WRF_ARTIFACT_RESTORE_TO: 'metbr_segment_artifacts'
        run: |
          mkdir -p "$WRF_ARTIFACT_DOWNLOAD_DIR"
          printf '%s\n' "$WRF_ARTIFACT_RESTORE_TO" > "$WRF_ARTIFACT_DOWNLOAD_DIR/.restore-to"
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Reunir e validar WRFOUTs dos 14 segmentos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metbr_all_wrfout
          mapfile -t files < <(find metbr_segment_artifacts -type f -name 'metbr-wrfout-*' -size +0c -print | sort)
          (("${#files[@]}" >= 40)) || { echo "METBR: somente ${#files[@]} WRFOUTs recuperados dos artifacts" >&2; exit 3; }
          for f in "${files[@]}"; do
            name="${f##*/}"
            name="${name#metbr-wrfout-}"
            name="${name#*-}"
            [[ "$name" == wrfout_d01_* ]] || { echo "Nome WRFOUT invalido no artifact: $f" >&2; exit 4; }
            cp -f "$f" "metbr_all_wrfout/$name"
          done
          mapfile -t outputs < <(find metbr_all_wrfout -maxdepth 1 -type f -name 'wrfout_d01_*' -size +0c -print | sort)
          (("${#outputs[@]}" >= 40)) || { echo "METBR: somente ${#outputs[@]} WRFOUTs validos" >&2; exit 5; }
          echo "METBR: ${#outputs[@]} WRFOUTs recuperados e validados."
      - name: Extrair JSON nativo e perfis verticais
        shell: bash
        run: |
          set -euo pipefail
          python3 wrf/metbr_extract_json.py --run-dir metbr_all_wrfout --output-dir metbr_products
          test -s metbr_products/metadata.json
          test -s metbr_products/metbr_wrf_4km.json
          test -s metbr_products/grid.json
          test -s metbr_products/vertical-f000.npz
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('metbr_products/metadata.json').read_text(encoding='utf-8'))
          g=m['grid']
          assert m['model']=='METBR WRF 4 km'
          assert m['resolutionKm']==4 and m['nativeGrid'] is True
          assert int(g['nx'])==300 and int(g['ny'])==360, g
          assert m['frameCount']>=40, m['frameCount']
          assert m['reflectivitySource']
          print(f"METBR validado: {m['frameCount']} quadros; grade {g['nx']}x{g['ny']}")
          PY
      - name: Bundle WRF artifact safely (15)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            metbr_products/**
            metbr_all_wrfout/wrfout_d01_*
          WRF_ARTIFACT_REQUIRE_FILES: '1'
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-015.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-metbr4-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-complete-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-015.tar
          if-no-files-found: error
          retention-days: 7
