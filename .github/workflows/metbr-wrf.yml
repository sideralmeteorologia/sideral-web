name: SIDERAL | METBR WRF 4 km unificado

on:
  workflow_call:
    inputs:
      model_variant:
        description: "Tipo de execução WRF"
        required: false
        default: "wrf"
        type: string
      source_model:
        description: "Fonte global de contorno"
        required: false
        default: "icon"
        type: string

permissions:
  contents: write

# One scheduled METBR run per day. Separate run IDs keep manual runs isolated.
concurrency:
  group: metbr-wrf-4km-${{ github.run_id }}
  cancel-in-progress: false

env:
  METBR_SOURCE_MODEL: icon
  CHECKPOINT_PREFIX: metbr-wrf-4km-checkpoint
  SOURCE_MODEL: ${{ inputs.source_model || 'icon' }}
  MODEL_VARIANT: ${{ inputs.model_variant || 'wrf' }}
  WRF2_TOMORROW: ${{ inputs.model_variant == 'wrf2' && '1' || '0' }}


jobs:
  seg00:
    name: METBR ICON F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load WRF parameters from versioned profile
        shell: bash
        run: |
          set -euo pipefail
          profile="runners/parameters/metbr.env"
          test -s "$profile" || { echo "Perfil WRF ausente: $profile" >&2; exit 1; }
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            [[ "$line" == *=* ]] || { echo "Linha inválida em $profile: $line" >&2; exit 1; }
            echo "$line" >> "$GITHUB_ENV"
          done < "$profile"
      - name: Configurar Python e dependências dos fetchers
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar clientes de modelos globais
        run: python -m pip install --disable-pip-version-check 'ecmwf-opendata==0.3.34' 'requests>=2.31'
      - name: Embutir motor científico METBR e adaptador R2
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          mkdir -p "$(dirname 'wrf/run_metbr_checkpoint_segment.sh')"
          cp "runners/metbr/shared/run_metbr_checkpoint_segment.sh" "wrf/run_metbr_checkpoint_segment.sh"
          mkdir -p "$(dirname 'wrf/run_metbr_source_wrf.sh')"
          cp "runners/metbr/shared/run_metbr_source_wrf.sh" "wrf/run_metbr_source_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_icon_wrf.sh')"
          cp "runners/metbr/icon/run_icon_wrf.sh" "wrf/run_icon_wrf.sh"
          mkdir -p "$(dirname 'wrf/run_metbr_gfs_segment.sh')"
          cp "runners/metbr/gfs/run_metbr_gfs_segment.sh" "wrf/run_metbr_gfs_segment.sh"
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          cp "runners/metbr/shared/ensure_eccodes_tools.sh" "wrf/ensure_eccodes_tools.sh"
          mkdir -p "$(dirname 'wrf/run_wrf_restart_segment.sh')"
          cp "runners/metbr/shared/run_wrf_restart_segment.sh" "wrf/run_wrf_restart_segment.sh"
          mkdir -p "$(dirname 'wrf/run_wrf_with_source.sh')"
          cp "runners/metbr/shared/run_wrf_with_source.sh" "wrf/run_wrf_with_source.sh"
          mkdir -p "$(dirname 'wrf/prepare_restart_segment.py')"
          cp "runners/metbr/shared/prepare_restart_segment.py" "wrf/prepare_restart_segment.py"
          mkdir -p "$(dirname 'wrf/ensure_metbr_wrf_runtime.sh')"
          cp "runners/metbr/shared/ensure_metbr_wrf_runtime.sh" "wrf/ensure_metbr_wrf_runtime.sh"
          mkdir -p "$(dirname 'wrf/run_ecmwf_wrf.sh')"
          cp "runners/metbr/ecmwf/run_ecmwf_wrf.sh" "wrf/run_ecmwf_wrf.sh"
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          cp "runners/metbr/icon/fetch_icon_wrf_step.py" "wrf/fetch_icon_wrf_step.py"
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          cp "runners/metbr/ecmwf/fetch_ecmwf_wrf_input.py" "wrf/fetch_ecmwf_wrf_input.py"
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          cp "runners/metbr/gfs/fetch_gfs_land_support.py" "wrf/fetch_gfs_land_support.py"
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          cp "runners/metbr/icon/Vtable.ICONp" "wrf/Vtable.ICONp"
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          cp "runners/metbr/ecmwf/Vtable.ECMWF_OPEN" "wrf/Vtable.ECMWF_OPEN"
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          cp "runners/metbr/gfs/Vtable.GFS_SOIL" "wrf/Vtable.GFS_SOIL"
          mkdir -p "$(dirname 'wrf/metbr_extract_json.py')"
          cp "runners/metbr/shared/metbr_extract_json.py" "wrf/metbr_extract_json.py"
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          cp "runners/metbr/shared/extract_wrf_severe_core.py" "wrf/extract_wrf_severe_core.py"
          mkdir -p wrf/bin
          cp "runners/metbr/shared/gh" "wrf/bin/gh"
          chmod +x wrf/bin/gh wrf/*.sh
      - name: Validar scripts e extrator METBR
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_metbr_checkpoint_segment.sh wrf/run_metbr_source_wrf.sh wrf/run_metbr_gfs_segment.sh wrf/run_wrf_restart_segment.sh wrf/run_wrf_with_source.sh wrf/run_icon_wrf.sh wrf/run_ecmwf_wrf.sh
          python3 -m py_compile wrf/prepare_restart_segment.py wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/metbr_extract_json.py wrf/extract_wrf_severe_core.py
          test -s wrf/Vtable.ICONp && test -s wrf/Vtable.ECMWF_OPEN && test -s wrf/Vtable.GFS_SOIL
      - name: Cachear runtime científico METBR (somente código)
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-metbr-runtime-${{ github.sha }}
      - name: Adicionar adaptador R2 ao PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          if-no-files-found: ignore
          retention-days: 7
