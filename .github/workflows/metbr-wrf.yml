  complete:
    name: Extrair e validar METBR WRF 4 km
    runs-on: ubuntu-22.04
    needs: [seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07, seg08, seg09, seg10, seg11, seg12, seg13]
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Load WRF parameters from versioned profile
        shell: bash
        run: |
          set -euo pipefail
          profile="runners/parameters/metbr.env"
          test -s "$profile" || { echo "Perfil WRF ausente: $profile" >&2; exit 1; }
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            [[ "$line" == *=* ]] || { echo "Linha inválida em $profile: $line" >&2; exit 1; }
            echo "$line" >> "$GITHUB_ENV"
          done < "$profile"
      - name: Restaurar runtime científico METBR
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-metbr-runtime-${{ github.sha }}
      - name: Configurar Python científico
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas científicas
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027' 'scipy>=1.11,<2'
      - name: Baixar WRFOUTs desta rodada no R2
        env:
          CHECKPOINT_TAG: metbr-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-4km-checkpoint-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
          mkdir -p metbr_raw_wrfout metbr_all_wrfout
          while IFS= read -r key; do
            [[ -n "$key" && "${key##*/}" == metbr-wrfout-* ]] || continue
            : # artifact-only workflow
          done < <(tr '\t' '\n' < keys.txt)
          count=0
          for f in metbr_raw_wrfout/metbr-wrfout-*; do
            [[ -f "$f" ]] || continue
            name="${f##*/}"
            name="${name#metbr-wrfout-}"
            name="${name#*-}"
            cp -f "$f" "metbr_all_wrfout/$name"
            count=$((count+1))
          done
          [[ "$count" -ge 40 ]] || { echo "METBR: somente $count WRFOUTs recuperados" >&2; exit 3; }
      - name: Extrair JSON nativo e perfis verticais
        shell: bash
        run: |
          set -euo pipefail
          python3 wrf/metbr_extract_json.py --run-dir metbr_all_wrfout --output-dir metbr_products
          test -s metbr_products/metadata.json
          test -s metbr_products/metbr_wrf_4km.json
          test -s metbr_products/grid.json
          test -s metbr_products/vertical-f000.npz
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('metbr_products/metadata.json').read_text(encoding='utf-8'))
          g=m['grid']
          assert m['model']=='METBR WRF 4 km'
          assert m['resolutionKm']==4 and m['nativeGrid'] is True
          assert int(g['nx'])==300 and int(g['ny'])==360, g
          assert m['frameCount']>=40, m['frameCount']
          assert m['reflectivitySource']
          print(f"METBR validado: {m['frameCount']} quadros; grade {g['nx']}x{g['ny']}")
          PY
      - name: Publicar produtos validados na área da rodada do R2
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y awscli; }
          : # artifact-only workflow
          : # artifact-only workflow
          : # artifact-only workflow
      - name: Publicar produtos finais como artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrf-final-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}
          path: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          if-no-files-found: ignore
          retention-days: 7
