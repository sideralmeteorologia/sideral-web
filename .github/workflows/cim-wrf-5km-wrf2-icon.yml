          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-028.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-cim5-wrf2-icon-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-028.tar
          if-no-files-found: ignore
          retention-days: 7
  verify:
    name: Validar os 14 segmentos CIM 5 km e a Release
    runs-on: ubuntu-22.04
    needs: [seg00, seg01, seg02, seg03, seg04, seg05, seg06, seg07, seg08, seg09, seg10, seg11, seg12, seg13]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore WRF artifacts after checkout (final CIM verification)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Baixar artifacts dos 14 segmentos CIM 5 km
        uses: actions/download-artifact@v4
        with:
          pattern: wrf-cim5-${{ env.MODEL_VARIANT }}-${{ env.SOURCE_MODEL }}-seg??-${{ github.run_id }}
          path: ${{ runner.temp }}/wrf-downloads/cim5-segments
          merge-multiple: false
      - name: Register WRF artifact restore target (CIM 5 km final products)
        shell: bash
        env:
          WRF_ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/wrf-downloads/cim5-segments
          WRF_ARTIFACT_RESTORE_TO: 'cim5_segment_artifacts'
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=("$WRF_ARTIFACT_DOWNLOAD_DIR"/*)
          (("${#dirs[@]}" == 14)) || { echo "CIM 5 km: esperados 14 artifacts de segmentos; encontrados ${#dirs[@]}" >&2; exit 31; }
          for dir in "${dirs[@]}"; do
            [[ -d "$dir" ]] || continue
            printf '%s\n' "cim5_segment_artifacts/${dir##*/}" > "$dir/.restore-to"
          done
          python3 .github/scripts/wrf_artifact_bundle.py unpack-downloads \
            --downloads-root "$WRF_ARTIFACT_DOWNLOAD_DIR" \
            --workspace "$GITHUB_WORKSPACE"
      - name: Reunir e validar JSON/NPZ nativos dos 14 segmentos CIM 5 km
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, shutil
          from pathlib import Path

          root = Path("cim5_segment_artifacts")
          target = Path("cim5_release_products")
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True)
          metadata = sorted(root.rglob("cim4-products-*.json"))
          if len(metadata) != 14:
              raise SystemExit(f"CIM 5 km: esperados 14 JSONs de segmento; encontrados {len(metadata)}")
          seen = set()
          total_npz = 0
          for meta in metadata:
              match = re.fullmatch(r"cim4-products-(\d+)\.json", meta.name)
              if not match:
                  raise SystemExit(f"Nome de metadados CIM inválido: {meta}")
              index = match.group(1)
              if index in seen:
                  raise SystemExit(f"Segmento CIM duplicado: {index}")
              seen.add(index)
              product_dir = meta.parent / f"cim4_products_{index}"
              if not product_dir.is_dir():
                  raise SystemExit(f"Diretório de produtos ausente para o segmento CIM {index}")
              product_npz = list(product_dir.rglob("*.npz"))
              if not product_npz:
                  raise SystemExit(f"Segmento CIM {index} não contém NPZ")
              data = json.loads(meta.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not data:
                  raise SystemExit(f"JSON CIM vazio ou inválido: {meta}")
              shutil.copytree(product_dir, target / product_dir.name)
              shutil.copy2(meta, target / meta.name)
              total_npz += len(product_npz)
          if len(seen) != 14 or total_npz < 14:
              raise SystemExit(f"CIM 5 km incompleto: segmentos={len(seen)}; NPZ={total_npz}")
          shutil.rmtree(root)
          print(f"CIM 5 km: 14 segmentos validados; {len(metadata)} JSONs e {total_npz} NPZs prontos para Release.")
          PY
      - name: Bundle WRF artifact safely (29)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-029.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Publicar JSON em GitHub Release e espelho raw (direto no workflow)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_PATH: .github/workflows/cim-wrf-5km-wrf2-icon.yml
          SOURCE_WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_ARTIFACTS_DIR: ${{ runner.temp }}/model-artifacts
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
          FINAL_PRODUCT_TAR: .wrf-artifact-safe/wrf-payload-029.tar
          FINAL_PRODUCT_DIR: wrf-final-cim-wrf-5km-wrf2-icon-${{ github.job }}-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/$FINAL_PRODUCT_TAR"
          product_dir="$SOURCE_ARTIFACTS_DIR/$FINAL_PRODUCT_DIR"
          rm -rf "$product_dir"
          mkdir -p "$product_dir"
          tar -xf "$GITHUB_WORKSPACE/$FINAL_PRODUCT_TAR" -C "$product_dir"
          export SOURCE_COMPLETED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 .github/scripts/publish_model_release.py publish
      - name: Confirmar manifesto e assets da GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_PATH: .github/workflows/cim-wrf-5km-wrf2-icon.yml
          SOURCE_WORKFLOW_NAME: ${{ github.workflow }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          MODEL_VARIANT: ${{ env.MODEL_VARIANT }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_BRANCH" == "main" ]] || { echo "Release pública somente no main; branch=$SOURCE_BRANCH"; exit 0; }
          product_key="$(python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("sideral_release", ".github/scripts/publish_model_release.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print(mod.product_key(os.environ["SOURCE_WORKFLOW_PATH"], os.environ["SOURCE_WORKFLOW_NAME"]))
          PY
          )"
          tag="sideral-data-$product_key-latest"
          mkdir -p "$RUNNER_TEMP/release-verify"
          gh release download "$tag" --repo "$SOURCE_REPOSITORY" --pattern manifest.json --dir "$RUNNER_TEMP/release-verify"
          python3 - "$RUNNER_TEMP/release-verify/manifest.json" "$product_key" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert manifest.get("productId") == sys.argv[2], manifest.get("productId")
          assert int(manifest.get("fileCount", 0)) > 0, manifest
          assert int(manifest.get("assetCount", 0)) > 0, manifest
          assert manifest.get("rawManifestUrl"), "rawManifestUrl ausente"
          print(f"GitHub Release validada: {manifest['productId']} / {manifest['fileCount']} arquivos")
          PY
