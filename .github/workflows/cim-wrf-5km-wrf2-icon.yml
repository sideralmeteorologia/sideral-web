name: SIDERAL | CIM WRF 5 km | ICON | WRF2

on:
  workflow_dispatch:
    inputs:
      scheduled_cycle:
        description: Ciclo UTC opcional
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: sideral-cim-5km-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  PYTHON_VERSION: '3.12'
  WRF_TARGET_RESOLUTION_KM: '5'
  FAMILY: cim
  RESOLUTION_KM: '5'
  MODEL_VARIANT: wrf2
  SOURCE_MODEL: icon
  WRF2_TOMORROW: '1'
  SCHEDULED_CYCLE: ${{ (github.event.schedule == '17 19 * * *' || github.event.schedule == '0 20 * * *' || github.event.schedule == '30 20 * * *') && '12' || inputs.scheduled_cycle || '' }}
  WRF_DX_METERS: '5000'
  WRF_DY_METERS: '5000'
  WRF_E_WE: '447'
  WRF_E_SN: '375'
  WRF_TIME_STEP: '25'
  WRF_HISTORY_INTERVAL_MINUTES: '60'
  WRF_MPI_PROCS: '8'
  WRF_REF_LAT: '-27.50'
  WRF_REF_LON: '-52.75'
  WRF_STAND_LON: '-52.75'
  ICON_SOURCE_XSIZE: '113'
  ICON_SOURCE_YSIZE: '89'
  ICON_SOURCE_XFIRST: '-67.0'
  ICON_SOURCE_YFIRST: '-39.0'
  ICON_SOURCE_XINC: '0.25'
  ICON_SOURCE_YINC: '0.25'
  ECMWF_SOURCE_WEST: '-67'
  ECMWF_SOURCE_EAST: '-39'
  ECMWF_SOURCE_SOUTH: '-39'
  ECMWF_SOURCE_NORTH: '-17'

jobs:
  seg00:
    name: CIM WRF 5 km ${{ 'wrf2' == 'wrf2' && 'WRF2' || 'principal' }} · F000-F003
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (1)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Incorporar executores CIM 5 km e adaptador GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'wrf/run_cim4_checkpoint_segment.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_cim4_checkpoint_segment.sh'
          mkdir -p "$(dirname 'wrf/run_cim4_icon_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_cim4_icon_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_cim4_ecmwf_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_cim4_ecmwf_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_cim4_gfs_wrf.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_cim4_gfs_wrf.sh'
          mkdir -p "$(dirname 'wrf/run_cim4_restart_segment.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_cim4_restart_segment.sh'
          mkdir -p "$(dirname 'wrf/run_cim4_wrf_with_source.sh')"
          printf '%s' '' | base64 -d > 'wrf/run_cim4_wrf_with_source.sh'
          mkdir -p "$(dirname 'wrf/fetch_icon_wrf_step.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_icon_wrf_step.py'
          mkdir -p "$(dirname 'wrf/fetch_ecmwf_wrf_input.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_ecmwf_wrf_input.py'
          mkdir -p "$(dirname 'wrf/fetch_gfs_land_support.py')"
          printf '%s' '' | base64 -d > 'wrf/fetch_gfs_land_support.py'
          mkdir -p "$(dirname 'wrf/select_tarc_icon_run.py')"
          printf '%s' '' | base64 -d > 'wrf/select_tarc_icon_run.py'
          mkdir -p "$(dirname 'wrf/extract_wrf_severe.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_severe.py'
          mkdir -p "$(dirname 'wrf/extract_wrf_severe_core.py')"
          printf '%s' '' | base64 -d > 'wrf/extract_wrf_severe_core.py'
          mkdir -p "$(dirname 'wrf/cim4_postprocess.py')"
          printf '%s' '' | base64 -d > 'wrf/cim4_postprocess.py'
          mkdir -p "$(dirname 'wrf/cim4_variable_catalog.json')"
          printf '%s' '' | base64 -d > 'wrf/cim4_wrf2_variable_catalog.json'
          printf '%s' '' | base64 -d > 'wrf/cim4_variable_catalog.json'
          mkdir -p "$(dirname 'wrf/ensure_eccodes_tools.sh')"
          printf '%s' '' | base64 -d > 'wrf/ensure_eccodes_tools.sh'
          mkdir -p "$(dirname 'wrf/Vtable.ECMWF_OPEN')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.ECMWF_OPEN'
          mkdir -p "$(dirname 'wrf/Vtable.GFS_SOIL')"
          printf '%s' '' | base64 -d > 'wrf/Vtable.GFS_SOIL'
          mkdir -p "$(dirname 'wrf/Vtable.ICONp')"
          printf '%s' '' | base64 -d > 'wrf/ensure_metbr_wrf_runtime.sh'
          printf '%s' '' | base64 -d > 'wrf/Vtable.ICONp'
          mkdir -p wrf/bin
          printf '%s' '' | base64 -d > wrf/bin/gh
          chmod +x wrf/bin/gh
          for script in wrf/*.sh; do [[ -f "$script" ]] && chmod +x "$script"; done
      - name: Garantir executabilidade dos scripts WRF
        shell: bash
        run: chmod +x wrf/*.sh
      - name: Validar scripts incorporados
        shell: bash
        run: |
          set -euo pipefail
          bash -n wrf/run_cim4_checkpoint_segment.sh wrf/run_cim4_icon_wrf.sh wrf/run_cim4_ecmwf_wrf.sh wrf/run_cim4_gfs_wrf.sh wrf/run_cim4_restart_segment.sh wrf/run_cim4_wrf_with_source.sh
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/select_tarc_icon_run.py wrf/extract_wrf_severe.py wrf/extract_wrf_severe_core.py wrf/cim4_postprocess.py
      - name: Salvar cache de código científico CIM 5 km
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim5-runtime-${{ github.sha }}
      - name: Expose WRF helper adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"
      - name: Restore embedded scientific runtime
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim5-runtime-${{ github.sha }}
      - name: Expose WRF helper adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"

      - name: Install WRF input and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          source wrf/ensure_eccodes_tools.sh
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'

      - name: Validate CIM 5 km runner scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cim4_checkpoint_segment.sh
            wrf/run_cim4_icon_wrf.sh
            wrf/run_cim4_ecmwf_wrf.sh
            wrf/run_cim4_gfs_wrf.sh
            wrf/run_cim4_wrf_with_source.sh
            wrf/run_cim4_restart_segment.sh
          )
          for script in "${scripts[@]}"; do
            test -s "$script"
            bash -n "$script"
          done
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/select_tarc_icon_run.py wrf/extract_wrf_severe_core.py wrf/cim4_postprocess.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog_path="wrf/cim4_wrf2_variable_catalog.json" if os.environ.get("MODEL_VARIANT")=="wrf2" else "wrf/cim4_variable_catalog.json"
          catalog=json.loads(Path(catalog_path).read_text(encoding="utf-8"))
          assert catalog["resolutionKm"] == 5
          assert catalog["domain"]["e_we"] == 447 and catalog["domain"]["e_sn"] == 375
          assert catalog["domain"]["dx_m"] == 5000 and catalog["domain"]["dy_m"] == 5000
          print(f"{catalog['model']}: 447x375 WRF domain / 446x374 mass points")
          PY

      - name: Run CIM 5 km forecast segment F000-F003 F000-F006
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ format('cim-{0}-5km-checkpoint-{1}', 'wrf2', github.run_id) }}
          WRF2_TOMORROW: ${{ env.WRF2_TOMORROW }}
          WRF_SCHEDULED_CYCLE: ${{ env.SCHEDULED_CYCLE }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_START_HOUR: '0'
          WRF_END_HOUR: '3'
          WRF_BOUNDARY_END_HOUR: '3'
        run: |
          set -euo pipefail
          chmod +x wrf/run_cim4_checkpoint_segment.sh
          bash wrf/run_cim4_checkpoint_segment.sh 0 3 0 1

      - name: Bundle WRF artifact safely (1)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            cim4_diagnostics/
            cim4_segment_output/rsl.*
            wrf_diagnostics/
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-001.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Upload diagnostics for segment 00

        uses: actions/upload-artifact@v4

        with:

          name: cim5-diagnostics-seg00-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-001.tar
          if-no-files-found: ignore
          retention-days: 7
      - name: Bundle WRF artifact safely (2)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-002.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-cim5-wrf2-icon-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-002.tar
          if-no-files-found: ignore
          retention-days: 7
  seg01:
    name: CIM WRF 5 km ${{ 'wrf2' == 'wrf2' && 'WRF2' || 'principal' }} · F003-F006
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    needs: seg00
    steps:
      - name: Restaurar checkpoint do segmento anterior
        uses: actions/download-artifact@v4
        with:
          name: wrf-cim5-wrf2-icon-seg00-${{ github.run_id }}
          path: ${{ runner.temp }}/wrf-downloads/d001
      - name: Register WRF artifact restore target (1)
        shell: bash
        env:
          WRF_ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/wrf-downloads/d001
          WRF_ARTIFACT_RESTORE_TO: '.'
        run: |
          mkdir -p "$WRF_ARTIFACT_DOWNLOAD_DIR"
          printf '%s\n' "$WRF_ARTIFACT_RESTORE_TO" > "$WRF_ARTIFACT_DOWNLOAD_DIR/.restore-to"
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore WRF artifacts after checkout (2)
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" ]]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/wrf_artifact_bundle.py" unpack-downloads \
              --downloads-root "$RUNNER_TEMP/wrf-downloads" \
              --workspace "$GITHUB_WORKSPACE"
          fi
      - name: Restore WRF runtime files from runners catalog
        shell: bash
        run: python3 .github/scripts/restore_wrf_runtime.py
      - name: Restore embedded scientific runtime
        uses: actions/cache@v4
        with:
          path: wrf
          key: ${{ runner.os }}-sideral-cim5-runtime-${{ github.sha }}
      - name: Expose WRF helper adapter to PATH
        run: echo "$GITHUB_WORKSPACE/wrf/bin" >> "$GITHUB_PATH"

      - name: Install WRF input and validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          source wrf/ensure_eccodes_tools.sh
          command -v shellcheck >/dev/null || { echo "ShellCheck não disponível na imagem runner" >&2; exit 1; }
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'netCDF4>=1.7,<2' 'xarray>=2024.1,<2027' 'scipy>=1.11,<2' 'requests>=2.31' 'ecmwf-opendata==0.3.34'

      - name: Validate CIM 5 km runner scripts
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            wrf/run_cim4_checkpoint_segment.sh
            wrf/run_cim4_icon_wrf.sh
            wrf/run_cim4_ecmwf_wrf.sh
            wrf/run_cim4_gfs_wrf.sh
            wrf/run_cim4_wrf_with_source.sh
            wrf/run_cim4_restart_segment.sh
          )
          for script in "${scripts[@]}"; do
            test -s "$script"
            bash -n "$script"
          done
          shellcheck -S error -s bash "${scripts[@]}"
          python3 -m py_compile wrf/fetch_icon_wrf_step.py wrf/fetch_ecmwf_wrf_input.py wrf/fetch_gfs_land_support.py wrf/select_tarc_icon_run.py wrf/extract_wrf_severe_core.py wrf/cim4_postprocess.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          catalog_path="wrf/cim4_wrf2_variable_catalog.json" if os.environ.get("MODEL_VARIANT")=="wrf2" else "wrf/cim4_variable_catalog.json"
          catalog=json.loads(Path(catalog_path).read_text(encoding="utf-8"))
          assert catalog["resolutionKm"] == 5
          assert catalog["domain"]["e_we"] == 447 and catalog["domain"]["e_sn"] == 375
          assert catalog["domain"]["dx_m"] == 5000 and catalog["domain"]["dy_m"] == 5000
          print("CIM 5 km catalog: 447x375 WRF domain / 446x374 mass points")
          PY

      - name: Run CIM 5 km forecast segment F003-F006
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_TAG: ${{ format('cim-{0}-5km-checkpoint-{1}', 'wrf2', github.run_id) }}
          WRF2_TOMORROW: ${{ env.WRF2_TOMORROW }}
          WRF_SCHEDULED_CYCLE: ${{ env.SCHEDULED_CYCLE }}
          SOURCE_MODEL: ${{ env.SOURCE_MODEL }}
          WRF_START_HOUR: '3'
          WRF_END_HOUR: '6'
          WRF_BOUNDARY_END_HOUR: '6'
        run: |
          set -euo pipefail
          chmod +x wrf/run_cim4_checkpoint_segment.sh
          bash wrf/run_cim4_checkpoint_segment.sh 3 6 1 0

      - name: Bundle WRF artifact safely (3)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            cim4_diagnostics/
            cim4_segment_output/rsl.*
            wrf_diagnostics/
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-003.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Upload diagnostics for segment 01

        uses: actions/upload-artifact@v4

        with:

          name: cim5-diagnostics-seg01-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-003.tar
          if-no-files-found: ignore
          retention-days: 7
      - name: Bundle WRF artifact safely (4)
        shell: bash
        env:
          WRF_ARTIFACT_PATTERNS: |
            **/*restart*/**
            **/*products*/**
            **/*publish*/**
            **/*.json
            **/*.npz
            **/*.tar.gz
            **/wrfout_d01_*
            **/*-run.env
          WRF_ARTIFACT_OUTPUT: .wrf-artifact-safe/wrf-payload-004.tar
        run: |
          python3 .github/scripts/wrf_artifact_bundle.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/$WRF_ARTIFACT_OUTPUT"
      - name: Salvar checkpoint e produtos desta etapa
        uses: actions/upload-artifact@v4
        with:
          name: wrf-cim5-wrf2-icon-${{ github.job }}-${{ github.run_id }}
          path: |
            .wrf-artifact-safe/wrf-payload-004.tar
          if-no-files-found: ignore
          retention-days: 7
  seg02:
    name: CIM WRF 5 km ${{ 'wrf2' == 'wrf2' && 'WRF2' || 'principal' }} · F006-F009
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    needs: seg01
    steps:
      - name: Restaurar checkpoint do segmento anterior
